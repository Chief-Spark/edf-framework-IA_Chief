    - {id: DUP_RECIENTE, descripcion: "duplicado más reciente: se conserva", cambios: {NUM_DOCUMENTO: "1000000099", FECHA_ACTUALIZACION_CNS: "01/06/2024"}, esperado: {codigos: [], duplicado: false}}
