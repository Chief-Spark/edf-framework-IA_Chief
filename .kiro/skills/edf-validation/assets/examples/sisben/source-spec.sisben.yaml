# source-spec de SISBEN V4 para la etapa Validation (EDF/Oxygen).
# Modo "SISBEN pre-llenado": el ingeniero de datos lo revisa, no lo escribe desde cero.
# Cada valor marcado "ASSUMPTION" es provisional; ver references/decisiones-y-abiertos.md.
# `supuestos: [<ID>]` en un campo, regla o catálogo hace que el generador escriba `ASSUMPTION <ID>` junto a su
# código; manifest.json["supuestos"] se deriva de esas marcas (ADR-G1).
# DATOS SINTÉTICOS: todo valor de `fixture` y `catalogos[].filas_sinteticas` es inventado.
# DIVIPOLA: muestra mínima NO verificada contra DANE (F-13).

spec_version: "sisben-v4-0.1.0"

fuente:
  Fuente: SISBEN            # prefijo de clase
  fuente: sisben            # carpeta / paquete
  event_type: 30            # inferido (VAL-PA04)
  datasource: DNP
  subscriber: "999722"
  zona_horaria: America/Bogota

paquetes:
  comun: com.experian.edf.oxygen.validation.source.common   # ASSUMPTION VAL-PT01
  base_fuente: com.experian.edf.oxygen.validation.source     # F-05 / 04_Etapas §1

archivo:
  formato: text
  delimitador: ";"
  filas_header: 1
  filas_footer: 0
  footer_regex: null
  encoding: null            # D5/F-17: sin clave `encoding`
  # filePattern del HOCON: el motor compara contra la RUTA COMPLETA → empieza con `.*` (D8, F-07)
  file_pattern: '.*(RT_|EP_)?SISBEN_EXPERIAN_\d{6}\.\d{14}[+-]\d{4}\.txt'
  nombre:
    descripcion: "[RT_|EP_]SISBEN_EXPERIAN_AAAAMM.AAAAMMDDHHMMSS±ZZZZ.txt"
    regex: '(RT_|EP_)?SISBEN_EXPERIAN_(\d{6})\.(\d{14})([+-]\d{4})\.txt'
    grupos: {prefijo: 1, periodo: 2, marca_tiempo: 3, offset: 4}
    file_tag_por_prefijo: {"": REGULAR, "RT_": RT, "EP_": EP}   # ASSUMPTION F-07
    file_as_of_date: ultimo_dia_periodo                          # ASSUMPTION (inferido)

guard_rails:
  subscriber_relation: NUM_DOCUMENTO
  as_of_date: FECHA_ACTUALIZACION_CNS
  received_date: marca_tiempo_nombre

campos:
  - {posicion: 1, nombre: ID_FICHA_ORIGEN, alias: [ide_ficha_origen], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 50, codigo: SISBEN_ERR_001, ejemplo_invalido: ""}
  - {posicion: 2, nombre: ID_HOGAR, alias: [ide_hogar], obligatorio: true, severidad: "1", tipo: numerico, rango: [1, 15], catalogo: {tabla: SISBEN_HOME_ID_CLASIFICATION_NH, columna: id_hogar}, codigo: SISBEN_ERR_002, ejemplo_invalido: "16"}
  - {posicion: 3, nombre: COD_DPTO, alias: [cod_dpto], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 2, catalogo: {tabla: 102_DANE_DIVIPOLA_STATES_CODES_NH, columna: cod_dpto}, codigo: SISBEN_ERR_003, ejemplo_invalido: "99"}
  - {posicion: 4, nombre: NOM_DPTO, alias: [nom_dpto], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 60, codigo: SISBEN_ERR_004, ejemplo_invalido: ""}
  - {posicion: 5, nombre: COD_MPIO, alias: [cod_mpio], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 5, catalogo: {tabla: 2_DANE_DIVIPOLA_CITIES_CODES_NH, columna: cod_mpio}, codigo: SISBEN_ERR_005, ejemplo_invalido: "99999"}
  - {posicion: 6, nombre: NOM_MPIO, alias: [nom_mpio], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 60, codigo: SISBEN_ERR_006, ejemplo_invalido: ""}
  - {posicion: 7, nombre: ID_CLASE, alias: [cod_clase], obligatorio: true, severidad: "1", tipo: numerico, longitud_max: 1, dominio: ["1", "2", "3"], catalogo: {tabla: 201_SISBEN_ZONES_NH, columna: cod_clase}, codigo: SISBEN_ERR_007, ejemplo_invalido: "4"}
  - {posicion: 8, nombre: ID_PERSONA_ORDEN, alias: [ide_persona], obligatorio: true, severidad: "1", tipo: numerico, rango: [1, 25], codigo: SISBEN_ERR_008, ejemplo_invalido: "26"}
  - {posicion: 9, nombre: ID_NACIONAL, alias: [ide_nacional], obligatorio: true, severidad: "1", tipo: numerico, codigo: SISBEN_ERR_009, ejemplo_invalido: "ABC"}
  - {posicion: 10, nombre: PRI_APELLIDO, alias: [pri_apellido], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 50, codigo: SISBEN_ERR_010, ejemplo_invalido: ""}
  - {posicion: 11, nombre: SEG_APELLIDO, alias: [seg_apellido], obligatorio: false, severidad: "3", tipo: alfanumerico, longitud_max: 50, codigo: SISBEN_INC_011, ejemplo_invalido: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"}
  - {posicion: 12, nombre: PRI_NOMBRE, alias: [pri_nombre], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 50, codigo: SISBEN_ERR_012, ejemplo_invalido: ""}
  - {posicion: 13, nombre: SEG_NOMBRE, alias: [seg_nombre], obligatorio: false, severidad: "3", tipo: alfanumerico, longitud_max: 50, codigo: SISBEN_INC_013, ejemplo_invalido: "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"}
  - {posicion: 14, nombre: TIP_DOCUMENTO, alias: [tip_documento], obligatorio: true, severidad: "1", tipo: alfanumerico, dominio: ["1", "2", "3", "4", "5", "6", "7", "8", "PPT"], catalogo: {tabla: 202_SISBEN_PROCESS_ID_TYPE_HO, columna: cod_sisben}, codigo: SISBEN_ERR_014, ejemplo_invalido: "9", supuestos: [VAL-SP06]}
  - {posicion: 15, nombre: NUM_DOCUMENTO, alias: [num_documento], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 20, normalizacion: [quitar_espacios, quitar_ceros_izquierda], codigo: SISBEN_ERR_015, ejemplo_invalido: ""}
  - {posicion: 16, nombre: ID_GRUPO, alias: [grupo], obligatorio: true, severidad: "1", tipo: alfanumerico, longitud_max: 50, dominio: [A, B, C, D], catalogo: {tabla: SISBEN_GROUP_SUBGROUP_NH, columna: grupo}, codigo: SISBEN_ERR_016, ejemplo_invalido: "E"}
  - {posicion: 17, nombre: ID_NIVEL, alias: [nivel], obligatorio: true, severidad: "1", tipo: numerico, longitud_max: 50, rango: [1, 21], codigo: SISBEN_ERR_017, ejemplo_invalido: "22", supuestos: [VAL-SP04]}
  - {posicion: 18, nombre: FECHA_DIGITACION, alias: [fecha, fec_digitacion], obligatorio: true, severidad: "1", tipo: fecha, formatos_fecha: ["dd/MM/yyyy", "yyyy-MM-dd HH:mm:ss"], no_futura: true, codigo: SISBEN_ERR_018, ejemplo_invalido: "2099-01-01 00:00:00"}
  - {posicion: 19, nombre: FECHA_ACTUALIZACION_PERSONA, alias: [fec_actualizacion_persona], obligatorio: false, severidad: "3", tipo: fecha, formatos_fecha: ["dd/MM/yyyy"], codigo: SISBEN_INC_019, ejemplo_invalido: "2024-05-20"}
  - {posicion: 20, nombre: ID_MARCA, alias: [marca], obligatorio: false, severidad: "3", tipo: numerico, dominio: ["0", "1", "10"], catalogo: {tabla: 203_SISBEN_RECORD_STATUS_AND_MARK_NH, columna: codigo}, codigo: SISBEN_INC_020, ejemplo_invalido: "5", supuestos: [VAL-SP05]}
  - {posicion: 21, nombre: ID_ESTADO, alias: [estado], obligatorio: true, severidad: "1", tipo: numerico, dominio: ["0", "10", "40", "41", "42", "43", "60", "61", "70", "90", "91"], catalogo: {tabla: 203_SISBEN_RECORD_STATUS_AND_MARK_NH, columna: codigo}, codigo: SISBEN_ERR_021, ejemplo_invalido: "50", supuestos: [VAL-SP05]}
  - {posicion: 22, nombre: FECHA_ACTUALIZACION_CNS, alias: [fec_actualizacion_cns], obligatorio: true, severidad: "1", tipo: fecha, formatos_fecha: ["dd/MM/yyyy", "yyyy-MM-dd HH:mm:ss"], codigo: SISBEN_ERR_022, ejemplo_invalido: "31/02/2024"}

# Parte "manual" de VAL-TPL-06 expresada como datos (IN-04).
reglas_entre_campos:
  - {id: RV-SIS-02, tipo: correspondencia_catalogo, campo_codigo: COD_DPTO, campo_nombre: NOM_DPTO, tabla: 102_DANE_DIVIPOLA_STATES_CODES_NH, columna_clave: cod_dpto, columna_nombre: nom_dpto, codigo: SISBEN_ERR_004, severidad: "1"}
  - {id: RV-SIS-03, tipo: correspondencia_catalogo, campo_codigo: COD_MPIO, campo_nombre: NOM_MPIO, tabla: 2_DANE_DIVIPOLA_CITIES_CODES_NH, columna_clave: cod_mpio, columna_nombre: nom_mpio, codigo: SISBEN_ERR_006, severidad: "1"}
  - {id: RV-SIS-06, tipo: valor_con_codigo_propio, campo: TIP_DOCUMENTO, valores: ["7"], codigo: SISBEN_ERR_023, severidad: "1", causa: TIPO_PENDIENTE_CREACION, supuestos: [F-08]}

filtro_filas:              # IN-07 (D6.a, D14): silencioso, fuera de todo QS
  lineas_vacias: true
  campo: TIP_DOCUMENTO
  valores: ["1", "2"]

quality_scores:            # IN-09: RQS 1.0 sin error sev. 1; 0.0 con alguno (ASSUMPTION escala)
  - {nombre: RQS, anulan_niveles: ["1"]}

metricas:                  # metrics[].file del HOCON (IN-09)
  - {id: AverageRQS, expr: 'average("qs.RQS")'}
  - {id: TotalRegistros, expr: 'count(*)'}

duplicados:                # IN-06 (D9)
  habilitado: true
  clave: [TIP_DOCUMENTO, NUM_DOCUMENTO]
  modo: EXTN
  campo_fecha: FECHA_ACTUALIZACION_CNS     # ASSUMPTION F-14 (desempate: mayor eventId)
  umbral: null                             # null → se omite la clave (default Integer.MAX_VALUE, F-15)

codigos_especiales:        # 14 caracteres; ASSUMPTION (F-09 / F-11): provisionales
  nombre_archivo: SISBEN_ERR_024
  header: SISBEN_ERR_025
  estructura: SISBEN_ERR_026
  interno: SISBEN_ERR_027

diagnostico_archivo:       # F-11: sin expresión NO se emite marcador → se emiten explícitas
  fileName: 'errorlevelNotIn("1")'
  header: 'errorlevelNotIn("1")'

ambiente:                  # claves de ambiente que el skill VERIFICA pero no escribe
  default_output_structure: true    # ASSUMPTION F-04 (SparkValidator)
  historic_attributes: false
  lambda: batch

catalogos:                 # IN-08 / F-12: columnas, archivo y delimitador = ASSUMPTION
  - tabla: SISBEN_HOME_ID_CLASIFICATION_NH
    archivo: SISBEN_HOME_ID_CLASIFICATION_NH.csv
    delimitador: ";"
    columnas: [id_hogar, descripcion]
    keys: [id_hogar]
    filas_sinteticas: [["1","HOGAR 1"],["2","HOGAR 2"],["3","HOGAR 3"],["4","HOGAR 4"],["5","HOGAR 5"],["6","HOGAR 6"],["7","HOGAR 7"],["8","HOGAR 8"],["9","HOGAR 9"],["10","HOGAR 10"],["11","HOGAR 11"],["12","HOGAR 12"],["13","HOGAR 13"],["14","HOGAR 14"],["15","HOGAR 15"]]
  - tabla: 102_DANE_DIVIPOLA_STATES_CODES_NH
    archivo: 102_DANE_DIVIPOLA_STATES_CODES_NH.csv
    delimitador: ";"
    columnas: [cod_dpto, nom_dpto]
    keys: [cod_dpto]
    supuestos: [F-13]
    filas_sinteticas: [["05","ANTIOQUIA"],["11","BOGOTA"]]
  - tabla: 2_DANE_DIVIPOLA_CITIES_CODES_NH
    archivo: 2_DANE_DIVIPOLA_CITIES_CODES_NH.csv
    delimitador: ";"
    columnas: [cod_mpio, nom_mpio, cod_dpto]
    keys: [cod_mpio]
    supuestos: [F-13]
    filas_sinteticas: [["05001","MEDELLIN","05"],["11001","BOGOTA","11"]]
  - tabla: 201_SISBEN_ZONES_NH
    archivo: 201_SISBEN_ZONES_NH.csv
    delimitador: ";"
    columnas: [cod_clase, descripcion]
    keys: [cod_clase]
    filas_sinteticas: [["1","ZONA 1"],["2","ZONA 2"],["3","ZONA 3"]]
  - tabla: 202_SISBEN_PROCESS_ID_TYPE_HO
    archivo: 202_SISBEN_PROCESS_ID_TYPE_HO.csv
    delimitador: ";"
    columnas: [cod_sisben, cod_experian, descripcion]
    keys: [cod_sisben]
    filas_sinteticas: [["1","10","RC"],["2","7","TI"],["3","1","CC"],["4","4","CE"],["5","8","DNI"],["6","5","PAS"],["7","","SALVOCONDUCTO PENDIENTE"],["8","9","PEP"],["PPT","11","PPT"]]
  - tabla: SISBEN_GROUP_SUBGROUP_NH
    archivo: SISBEN_GROUP_SUBGROUP_NH.csv
    delimitador: ";"
    columnas: [grupo, descripcion]
    keys: [grupo]
    filas_sinteticas: [["A","GRUPO A"],["B","GRUPO B"],["C","GRUPO C"],["D","GRUPO D"]]
  - tabla: 203_SISBEN_RECORD_STATUS_AND_MARK_NH
    archivo: 203_SISBEN_RECORD_STATUS_AND_MARK_NH.csv
    delimitador: ";"
    columnas: [codigo, tipo, descripcion]
    keys: [codigo]
    filas_sinteticas: [["0","AMBOS","COD 0"],["1","MARCA","COD 1"],["10","AMBOS","COD 10"],["40","ESTADO","COD 40"],["41","ESTADO","COD 41"],["42","ESTADO","COD 42"],["43","ESTADO","COD 43"],["60","ESTADO","COD 60"],["61","ESTADO","COD 61"],["70","ESTADO","COD 70"],["90","ESTADO","COD 90"],["91","ESTADO","COD 91"]]

handoff_acceptance:        # contrato con la etapa Acceptance (solo informativo aquí)
  umbral_rqs: 0.90
  record_acceptance: 'errorlevelNotIn("1") and errorcodeNotIn("OxygenDuplicate")'

fixture:                   # VAL-TPL-11 · SINTÉTICO
  nombre_archivo: SISBEN_EXPERIAN_202406.20240630120000-0500.txt
  fecha_referencia: "2024-06-30"
  registro_base: ["FICHA-SINT-0001","1","05","ANTIOQUIA","05001","MEDELLIN","1","1","900000001","PRUEBA","SINTETICO","ANA","MARIA","3","1000000001","A","3","15/05/2024","20/05/2024","0","10","2024-06-01 00:00:00"]
  casos:
    - {id: BASE, descripcion: "registro válido", cambios: {}, esperado: {codigos: []}}
    - {id: MENOR_RC, descripcion: "menor con registro civil: se filtra", cambios: {TIP_DOCUMENTO: "1", NUM_DOCUMENTO: "1000000002"}, esperado: {filtrado: true}}
    - {id: MENOR_TI, descripcion: "menor con tarjeta de identidad: se filtra", cambios: {TIP_DOCUMENTO: "2", NUM_DOCUMENTO: "1000000003"}, esperado: {filtrado: true}}
