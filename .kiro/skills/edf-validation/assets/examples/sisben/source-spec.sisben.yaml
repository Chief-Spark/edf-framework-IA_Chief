    - {id: DPTO_NO_CORRESPONDE, descripcion: "nombre de departamento no corresponde", cambios: {NOM_DPTO: "BOGOTA", NUM_DOCUMENTO: "1000000005"}, esperado: {codigos: [SISBEN_ERR_004]}}
    - {id: MPIO_NO_CORRESPONDE, descripcion: "nombre de municipio no corresponde", cambios: {NOM_MPIO: "BOGOTA", NUM_DOCUMENTO: "1000000006"}, esperado: {codigos: [SISBEN_ERR_006]}}
