# Esquema del source-spec de Curation (JSON Schema draft 2020-12 escrito en YAML).
# El generador Python (scripts/render_templates.py) valida el source-spec contra este archivo antes de generar.
# La sección x-placeholders declara TODOS los huecos {{nombre}} que usan las plantillas y de qué
# parte del source-spec sale cada uno (origen). Un hueco no declarado aquí es un error (test).

$schema: "https://json-schema.org/draft/2020-12/schema"
title: Source-spec de Curation EDF/Oxygen
type: object
required: [schema_version, meta, fuente, paquetes, processor, archivo, parametros, campos_entrada,
           codigos_error, homologacion_tipo_documento, reglas_documento, catalogos, campos_curados,
           rutas_destino, fixture]

$defs:
  estado:
    enum: [cerrado, propuesta_de_frontera, inferido, supuesto, abierto]
  regla_documento:
    type: object
    required: [quitar_ceros_izquierda, solo_digitos, conservar_original, padding]
    properties:
      quitar_ceros_izquierda: {type: boolean}
      solo_digitos: {type: boolean}
      conservar_original: {type: boolean}
      padding: {type: [integer, "null"], minimum: 1}
    additionalProperties: false
  identificador_campo:
    type: string
    pattern: "^[a-z][A-Za-z0-9]*$"

properties:
  schema_version: {const: "1.0"}
  meta:
    type: object
    required: [version_skill, etapa, framework, compilacion]
    properties:
      version_skill: {type: string}
      etapa: {const: curation}
      framework: {type: string}
      version_motor_objetivo: {type: string}
      compilacion: {enum: [no_certificada, certificada]}
  fuente:
    type: object
    required: [Fuente, fuente, datasource, subscriber, output_event_type]
    properties:
      Fuente: {type: string, pattern: "^[A-Z][A-Z0-9]*$"}
      fuente: {type: string, pattern: "^[a-z][a-z0-9]*$"}
      descripcion: {type: string}
      datasource: {type: string}
      subscriber: {type: string}
      output_event_type: {type: integer}
      output_event_type_estado: {$ref: "#/$defs/estado"}
  paquetes:
    type: object
    required: [fuente, compartido]
    properties:
      fuente: {type: string, pattern: "^[a-z][a-z0-9_.]*[a-z0-9]$"}
      compartido: {type: string, pattern: "^[a-z][a-z0-9_.]*[a-z0-9]$"}
      compartido_estado: {$ref: "#/$defs/estado"}
  processor:
    type: object
    required: [nombre_clase]
    properties:
      nombre_clase: {type: string, pattern: "^[A-Z][A-Za-z0-9]*CurationProcessor$"}
  archivo:
    type: object
    required: [convencion, file_pattern, regex_derivacion, tipo_por_prefijo, ejemplos_sinteticos]
    properties:
      convencion: {type: string}
      estado: {$ref: "#/$defs/estado"}
      file_pattern: {type: string, pattern: "^\\.\\*"}
      regex_derivacion: {type: string}
      tipo_por_prefijo:
        type: object
        additionalProperties: {enum: [REGULAR, RT, EP]}
      ejemplos_sinteticos: {type: array, minItems: 1, items: {type: string}}
      contraejemplos_sinteticos: {type: array, items: {type: string}}
  parametros:
    type: object
    required: [zona_horaria_fechas, formatos_fecha, conservar_enie, niveles_no_almacenar,
               niveles_anular, campo_advertencias]
    properties:
      zona_horaria_fechas: {type: string}
      # ADR-G4 (2026-10-21, AC-CUR-10). Opcionales con defecto para que las copias de la spec sigan validando.
      # Zona en que la etapa anterior (Validation, D3) calcula asOfDate. Solo se usa para el fixture
      # sintético y para advertir si difiere de zona_horaria_fechas (C-CUR-04). Por defecto America/Bogota.
      zona_asofdate_etapa_anterior: {type: string, minLength: 1, default: America/Bogota}
      # Origen de zona_horaria_fechas, que el MANIFEST.json muestra. Por defecto supuesto.
      zona_horaria_fechas_origen: {enum: [requisito, supuesto], default: supuesto}
      formatos_fecha:
        type: array
        minItems: 1
        # "uuuu-MM-dd" (ISO, solo fecha) se agregó por F-FW-10 (E2E sisben-e2e, PA-006).
        items: {enum: ["dd/MM/uuuu", "uuuu-MM-dd HH:mm:ss", "uuuu-MM-dd"]}
      conservar_enie: {type: boolean}
      # RF-CUR-10. Política para los campos con un error de Validation (por nivel de severidad):
      #   niveles_no_almacenar: el campo NO se publica (la clave se omite del evento curado);
      #   niveles_anular: el campo se publica nulo;
      #   un nivel que no está en ninguna lista: el campo se publica ESTANDARIZADO y, si no se puede
      #   transformar, nulo con advertencia. Para publicar estandarizado los campos con severidad 3, deje "3"
      #   fuera de las dos listas (p. ej. niveles_no_almacenar: []).
      niveles_no_almacenar: {type: array, items: {type: string}}
      niveles_anular: {type: array, items: {type: string}}
      campo_advertencias: {$ref: "#/$defs/identificador_campo"}
  campos_entrada:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: "^[A-Z][A-Z0-9_]*$"}
  codigos_error:
    type: object
    additionalProperties: {type: string}
  homologacion_tipo_documento:
    type: object
    required: [campo_origen, catalogo, tabla, pendientes]
    properties:
      campo_origen: {type: string}
      estado: {$ref: "#/$defs/estado"}
      catalogo:
        type: object
        required: [tabla, columna_clave, columna_valor]
      tabla:
        type: object
        minProperties: 1
        additionalProperties: {type: string, pattern: "^[0-9]+$"}
      pendientes: {type: array, items: {type: string}}
  reglas_documento:
    type: object
    required: [campo_tipo, por_defecto, por_tipo]
    properties:
      campo_tipo: {type: string}
      estado: {$ref: "#/$defs/estado"}
      por_defecto: {$ref: "#/$defs/regla_documento"}
      por_tipo: {type: object, additionalProperties: {$ref: "#/$defs/regla_documento"}}
  catalogos:
    type: array
    items:
      type: object
      required: [tabla, archivo, delimitador, columnas, claves, uso_curation, registrar_en_curation]
      properties:
        tabla: {type: string}
        archivo: {type: string}
        delimitador: {type: string, minLength: 1, maxLength: 1}
        columnas: {type: array, minItems: 1, items: {type: string}}
        claves: {type: array, minItems: 1, items: {type: string}}
        uso_curation: {enum: [homologar, enriquecer, solo_validation]}
        registrar_en_curation: {type: boolean}
  campos_curados:
    type: array
    minItems: 1
    items:
      type: object
      required: [destino, origen, transformacion, tipo_salida, estado]
      properties:
        destino: {$ref: "#/$defs/identificador_campo"}
        origen: {type: string}
        tipo_salida: {enum: [texto, entero, largo, decimal, booleano]}
        estado: {$ref: "#/$defs/estado"}
        catalogo:
          type: object
          required: [tabla, columna]
        transformacion:
          type: object
          required: [tipo]
          properties:
            tipo:
              enum: [texto, original, nombre, padding_izquierda, fecha_epoch, homologacion,
                     documento, desde_archivo, copia_de, constante, concatenacion]
            longitud: {type: integer, minimum: 1}
            atributo: {enum: [fecha_corte, tipo_archivo]}
            campo: {type: string}
            valor: {type: [string, "null"]}
            # concatenacion (1.7.0): une los valores curados no vacíos de campos ANTERIORES, en este orden, con
            # el separador (por defecto un espacio). No lleva origen. Todos vacíos: nulo sin advertencia.
            campos:
              type: array
              minItems: 1
              items: {$ref: "#/$defs/identificador_campo"}
            separador: {type: string, minLength: 1}
  campos_abiertos:
    type: array
    items:
      type: object
      required: [destino, motivo]
  # Opcional (F-FW-11, decisión D14). Si se declara, el processor sobrescribe subscriberRelation con los campos
  # curados indicados unidos por el separador; si falta alguno, conserva el del evento aceptado. Sin este bloque,
  # subscriberRelation se copia del evento aceptado (D3). Las demás claves del bloque son documentales.
  extension_subscriber_relation:
    type: object
    required: [campos, separador]
    properties:
      estado: {$ref: "#/$defs/estado"}
      consumido_por_generador: {type: boolean}
      campos:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/identificador_campo"}
      separador: {type: string, minLength: 1}
  rutas_destino:
    type: object
    required: [raiz_fuente, raiz_tests, raiz_compartido, raiz_tests_compartido, hocon, lookups_conf,
               domain_dictionary, test_resources]
    additionalProperties: {type: string}
  fixture:
    type: object
    required: [entrada, lookups_dir, sintetico]
    properties:
      sintetico: {const: true}

# ------------------------------------------------------------------ huecos de las plantillas
# origen: ruta en el source-spec (punto = anidado) o "derivado: <de qué>".
x-placeholders:
  version_skill: {origen: meta.version_skill}
  Fuente: {origen: fuente.Fuente}
  fuente: {origen: fuente.fuente}
  output_event_type: {origen: fuente.output_event_type}
  paquete_fuente: {origen: paquetes.fuente}
  paquete_compartido: {origen: paquetes.compartido}
  processor_clase: {origen: processor.nombre_clase}
  processor_fqcn: {origen: "derivado: paquetes.fuente + .processor. + processor.nombre_clase"}
  file_pattern_hocon: {origen: "derivado: archivo.file_pattern con escape HOCON"}
  regex_derivacion_scala: {origen: archivo.regex_derivacion}
  tipo_por_prefijo_scala: {origen: "derivado: archivo.tipo_por_prefijo"}
  archivo_base: {origen: "derivado: archivo.ejemplos_sinteticos[0]"}
  zona_fechas: {origen: parametros.zona_horaria_fechas}
  formatos_fecha_scala: {origen: "derivado: parametros.formatos_fecha"}
  conservar_enie: {origen: parametros.conservar_enie}
  niveles_no_almacenar_scala: {origen: "derivado: parametros.niveles_no_almacenar"}
  niveles_anular_scala: {origen: "derivado: parametros.niveles_anular"}
  campo_advertencias: {origen: parametros.campo_advertencias}
  campos_entrada_scala: {origen: "derivado: campos_entrada"}
  codigos_error_scala: {origen: "derivado: codigos_error"}
  tabla_homologacion: {origen: homologacion_tipo_documento.catalogo.tabla}
  columna_clave_homologacion: {origen: homologacion_tipo_documento.catalogo.columna_clave}
  columna_valor_homologacion: {origen: homologacion_tipo_documento.catalogo.columna_valor}
  homologacion_scala: {origen: "derivado: homologacion_tipo_documento.tabla"}
  claves_homologacion_scala: {origen: "derivado: claves de homologacion_tipo_documento.tabla"}
  pendientes_scala: {origen: "derivado: homologacion_tipo_documento.pendientes"}
  campo_tipo_documento: {origen: reglas_documento.campo_tipo}
  regla_documento_defecto_scala: {origen: "derivado: reglas_documento.por_defecto"}
  reglas_documento_scala: {origen: "derivado: reglas_documento.por_tipo"}
  mapeos_scala: {origen: "derivado: campos_curados (Capa B)"}
  claves_publicadas_scala: {origen: "derivado: campos_curados.destino + parametros.campo_advertencias"}
  campos_record_scala: {origen: "derivado: campos_curados (tipo Scala por tipo_salida)"}
  campos_to_map_scala: {origen: "derivado: campos_curados"}
  campos_from_map_scala: {origen: "derivado: campos_curados"}
  campos_abiertos_comentario: {origen: "derivado: campos_abiertos"}
  supuestos_comentario: {origen: "derivado: campos_curados.estado + estados de secciones"}
  lookups_hocon_entradas: {origen: "derivado: catalogos con registrar_en_curation = true"}
  domain_dictionary_entradas: {origen: "derivado: campos_curados + parametros.campo_advertencias"}
  eventos_jsonl: {origen: "derivado: fixture.entrada (eventos TaggedValidatedEvent sintéticos)"}
  casos_spec_scala: {origen: "derivado: fixture.entrada + salida de la implementación de referencia"}
  evento_base_json_scala: {origen: "derivado: fixture.entrada (base_registro)"}
  subscriber_relation_override_scala: {origen: "derivado: extension_subscriber_relation (comentario si no se declara)"}
  subscriber_relation_helper_scala: {origen: "derivado: extension_subscriber_relation (comentario si no se declara)"}
  casos_relacion_scala: {origen: "derivado: extension_subscriber_relation + fixture.entrada (comentario si no se declara)"}
  ruta_hocon: {origen: rutas_destino.hocon}
  ruta_lookups_conf: {origen: rutas_destino.lookups_conf}
  ruta_domain_dictionary: {origen: rutas_destino.domain_dictionary}
