# ACC-TPL-01 · Bloque de ingesta de SISBEN · generado por edf-acceptance-stage 0.1.0
# Destino: env/application-conf/innersource/acceptance-common-application-inner.conf
# REGLA ADITIVA: copie el elemento { ... } dentro de la lista existente oxygen.stage.acceptance.configs
# del archivo inner. No toque el *-common-application.conf base ni otros elementos de la lista.
# Convención de nombre: [RT_|EP_]SISBEN_EXPERIAN_AAAAMM.AAAAMMDDHHMMSS±ZZZZ.txt (estado: propuesta_de_frontera)
oxygen {
  stage {
    acceptance {
      configs = [
        {
          # Debe coincidir con la ruta sin extensión (E3) y con lineage.fileName (E10).
          filePattern = ".*(RT_|EP_)?SISBEN_EXPERIAN_\\d{6}\\.\\d{14}[+-]\\d{4}\\.txt"
          fileActions {
            # E8 · sintaxis nueva: registra el reasonCode de las condiciones que se cumplen.
            reject = "anyOf(RQS_BAJO_UMBRAL_SISBEN)"
            # E9 · sintaxis antigua: misma escala que el rechazo (0.90).
            accept = "average(\"qs.RQS\") >= 0.90"
          }
          # E10 · un error de evaluación ACEPTA el registro: ver los casos de ACC-TPL-05.
          recordAcceptance = "errorlevelNotIn(\"1\") and errorcodeNotIn(\"OxygenDuplicate\")"
          # E4 · registra códigos de razón también en el rechazo automático por marcadores.
          customReasonForAutomaticRejectionEnabled = true
        }
      ]
    }
  }
}
