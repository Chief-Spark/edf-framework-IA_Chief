# EJEMPLO DE FORMA, NO ES FUENTE. Este archivo enseña la estructura y el nivel de detalle del insumo.
# Sus valores NO se copian a ninguna ingesta, tampoco a SISBEN: pueden diferir de la HU y la spec vigentes
# (00-framework-edf.md §6). Los valores salen siempre de expedientes/<id>/fuentes/ (HU y spec).
# Especificación de fuente para el skill edf-acceptance — caso piloto SISBEN V4.
# Valida contra assets/schema/source-spec.schema.yaml.
# DATOS SINTÉTICOS: todos los nombres de archivo, documentos, fechas e ids del bloque `fixture`
# son ficticios (prefijo SINT). Ningún valor proviene de un archivo real de la fuente.
# Estados: cerrado | propuesta_de_frontera | inferido | abierto (ver references/inventario-plantillas.md).

schema_version: "0.1.0"
version_skill: "0.1.0"
etapa: acceptance
Fuente: SISBEN
fuente: sisben

identidad:                       # contexto; Acceptance no lo usa en expresiones
  data_source: DNP
  subscriber: "999722"
  event_type: 30                 # inferido
  zona_horaria: America/Bogota

rutas_destino:                   # repositorio: fork de Colombia de oxygen-acceptance (no este skill)
  hocon: env/application-conf/innersource/acceptance-common-application-inner.conf
  raiz_tests: src/test/scala/com/experian/edf/oxygen/acceptance/source/sisben/
  recursos_tests: src/test/resources/sisben/
  paquete_tests: com.experian.edf.oxygen.acceptance.source.sisben

# IN-01 · Convención de nombre (D8). Debe coincidir con la ruta sin extensión Y con lineage.fileName (ACC-R03).
archivo:
  convencion: "[RT_|EP_]SISBEN_EXPERIAN_AAAAMM.AAAAMMDDHHMMSS±ZZZZ.txt"
  filePattern: '.*(RT_|EP_)?SISBEN_EXPERIAN_\d{6}\.\d{14}[+-]\d{4}\.txt'
  estado: propuesta_de_frontera
  claves_de_prueba:
    - {clave: ruta_validada_sin_extension, valor: "/home/app/validation/validated/SISBEN_EXPERIAN_202401.20240131120000-0500.txt.900001", debe_coincidir: true}
    - {clave: ruta_marcador_sin_extension, valor: "/home/app/validation/validated/EP_SISBEN_EXPERIAN_202401.20240131140000-0500.txt.errorInHeader.900003", debe_coincidir: true}
    - {clave: lineage_fileName, valor: "RT_SISBEN_EXPERIAN_202401.20240131130000+0000.txt", debe_coincidir: true}
    - {clave: ruta_otra_fuente, valor: "/home/app/validation/validated/RUNT_EXPERIAN_202401.20240131120000-0500.txt.900009", debe_coincidir: false}

# IN-02 · Regla de calidad del archivo (D7). Una sola escala (0..1) en todas las expresiones.
calidad:
  quality_score: RQS
  agregacion: average
  umbral: "0.90"
  estado: cerrado

# IN-03 / ACC-TPL-02 · Condiciones con nombre (globales: nombre y reasonCode únicos entre ingestas).
condiciones:
  - nombre: RQS_BAJO_UMBRAL_SISBEN
    expresion: 'average("qs.RQS") < 0.90'
    reasonCode: SISBFA00001
    isLogged: true
    estado: inferido             # código cerrado (D7); severidad sin definir (ACC-PT03)

# ACC-TPL-01 · Decisión de archivo. reject en sintaxis nueva (registra reasonCode); accept en sintaxis antigua.
fileActions:
  reject: anyOf(RQS_BAJO_UMBRAL_SISBEN)
  accept: 'average("qs.RQS") >= 0.90'

# IN-04 · Regla de registro (RF-ACC-06).
registro:
  niveles_que_rechazan: ["1"]
  codigos_que_rechazan: [OxygenDuplicate]
  recordAcceptance: 'errorlevelNotIn("1") and errorcodeNotIn("OxygenDuplicate")'
  estado: cerrado

# IN-06 · Rechazo automático por marcadores (RF-ACC-02).
rechazo_automatico:
  customReasonForAutomaticRejectionEnabled: true
  aceptar_cuerpo_vacio: false    # accept NO contiene isEmptyBodyFile => errorInEmptyFileBody se rechaza
  estado: cerrado

# IN-07 · Intervención manual: no se configura (RF-ACC-05). Valores nulos a propósito.
intervencion_manual:
  habilitada: false
  manualReject: null
  manualAccept: null
  estado: cerrado

# IN-05 · Diagnóstico heredado de Validation (lo define el skill de Validation; aquí solo se consume).
diagnostico_validation:
  quality_scores: [RQS]
  niveles: ["1", "3", ""]        # "" = nivel de la marca OxygenDuplicate del motor
  codigos_sev1: [SISBEN_ERR_001, SISBEN_ERR_002, SISBEN_ERR_003, SISBEN_ERR_004, SISBEN_ERR_005,
                 SISBEN_ERR_006, SISBEN_ERR_007, SISBEN_ERR_008, SISBEN_ERR_009, SISBEN_ERR_010,
                 SISBEN_ERR_012, SISBEN_ERR_014, SISBEN_ERR_015, SISBEN_ERR_016, SISBEN_ERR_017,
                 SISBEN_ERR_018, SISBEN_ERR_021, SISBEN_ERR_022, SISBEN_ERR_023]
  codigos_sev3: [SISBEN_INC_011, SISBEN_INC_013, SISBEN_INC_019, SISBEN_INC_020]
  codigos_motor: [OxygenDuplicate]
  marcadores_de_archivo: [errorInFileName, errorInHeader, errorInFooter, errorInEmptyFileBody]
  estado: cerrado

# ACC-TPL-03 · Tabla de severidades. Deshabilitada: reject no usa hasErrorlevelIn. Valores provisionales.
severidades:
  habilitado: false
  tableName: SISBEN_ACC_REASON_SEVERITY_NH          # ASSUMPTION S-ACC-02
  archivo: lookups/sisben/SISBEN_ACC_REASON_SEVERITY_NH.csv   # ASSUMPTION S-ACC-02
  fileFormat: csv                                   # ASSUMPTION S-ACC-02
  delimiter: ","                                    # ASSUMPTION S-ACC-02 (default de LookupFileReadInfo sin verificar)
  mapFromColumn: reasonCode
  mapToColumn: severity
  filas:
    - {reasonCode: SISBFA00001, severidad: 1}       # ASSUMPTION S-ACC-02 (ACC-PT03 abierto)
  estado: abierto

# IN-08 / ACC-TPL-04 · contextualOverride (D2). ABIERTO: el skill nunca lo genera con valores por defecto.
contextual_override:
  decision_humana: false
  decision_ref: null
  inferDelete: {enabled: null, lookBackPeriod: null, deletePredicates: null}
  explicitDelete: {enabled: null, lookBackPeriod: null, deletePredicates: null}
  estado: abierto

# Expresiones propuestas (acceptance_patrones.yaml#expresiones_propuestas_sisben), con la corrección de nombre.
# Clave genérica desde 1.9.5 (HF-21); el nombre anterior expresiones_propuestas_sisben se acepta como alias deprecado.
expresiones_propuestas:
  - regla: Registro bueno = sin severidad 1 y no duplicado
    expresion: 'recordAcceptance = "errorlevelNotIn(\"1\") and errorcodeNotIn(\"OxygenDuplicate\")"'
    evidencia: documentado
  - regla: Aceptación del archivo por umbral
    expresion: 'accept = "average(\"qs.RQS\") >= 0.90"'
    evidencia: documentado
  - regla: Código de razón del rechazo
    expresion: 'reject = "anyOf(RQS_BAJO_UMBRAL_SISBEN)"'
    detalle: >-
      Condición RQS_BAJO_UMBRAL_SISBEN con expresión average("qs.RQS") < 0.90 y reasonCode SISBFA00001 en
      oxygen.stage.acceptance.fileConditions[]. El patrón la llama RQS_BAJO_UMBRAL; se usa el nombre con
      sufijo de fuente del inventario (IN-03) porque el nombre es global.
    evidencia: verificado          # clave HOCON verificada en el parser del framework (ACC-PT01 cerrado)
  - regla: Umbral parametrizado
    detalle: Una sola escala (0.90). El "< 90" de HU-004 es un error de escala y se descarta.
    evidencia: cerrado

# AC-27 / ADR-G2 · Supuestos propios del skill (S-ACC-01..05), con su impacto. Los mismos IDs y el mismo
# impacto que la tabla "Supuestos propios de este skill" de references/decisiones-y-abiertos.md (lo comprueba
# supuestosDeLaSpecIgualesALosDelDocumento). El jar los lista con --audit y en el reporte de generación.
supuestos:
  - id: S-ACC-01
    supuesto: >-
      severidades.habilitado = false: reject no usa hasErrorlevelIn, así que la severidad de SISBFA00001 no
      es necesaria
    impacto: >-
      No se generan ACC-TPL-03 (CSV y lookup.conf) ni lookupMapping. Si reject llega a usar
      hasErrorlevelIn/NotIn, hay que habilitar la tabla (verifySpec lo exige, ACC-TPL-03) y cerrar ACC-PT03
    donde: spec (severidades.habilitado)
  - id: S-ACC-02
    supuesto: "Si se habilita: tabla SISBEN_ACC_REASON_SEVERITY_NH, CSV con delimitador ',', SISBFA00001 -> 1"
    impacto: >-
      Hoy ninguno: la rama está deshabilitada y ACC-TPL-03 se omite. Si se habilita sin confirmar,
      lookupMapping, el CSV y su lookup.conf salen con nombre de tabla, formato y delimitador sin verificar
      (F-12/F-13) y con una severidad provisional (ACC-PT03): hasErrorlevelIn/NotIn clasificaría el rechazo
      del reasonCode con esa severidad, o lo omitiría si la tabla no se carga
    donde: spec (severidades, ASSUMPTION S-ACC-02)
  - id: S-ACC-03
    supuesto: average de un QS ausente en todos los eventos es null => condición false => archivo pendiente
    impacto: >-
      Un archivo sin el QS declarado (contrato con Validation roto) no se rechaza ni se acepta: queda
      pendiente y no sale de validated/. El archivo del fixture sin QS y el simulador esperan "pendiente";
      falta confirmarlo contra Spark (N4)
    donde: simulador, archivo del fixture sin QS
  - id: S-ACC-04
    supuesto: JsonUtils en com.experian.edf.oxygen.utils para el Spec
    impacto: >-
      Si el paquete es otro, el Spec Scala (ACC-TPL-05) no compila. No afecta el HOCON ni la decisión del
      motor; la compilación ya no está certificada (F-01)
    donde: ACC-TPL-05 (ASSUMPTION S-ACC-04)
  - id: S-ACC-05
    supuesto: >-
      Fixture JSON Lines con campos de TaggedValidatedEvent; payload/minFrequency omitidos (deserialización
      tolerante)
    impacto: >-
      Si JsonUtils.fromJson no tolera la falta de payload/minFrequency, el Spec no puede leer los
      directorios del fixture y sus casos de registro y de archivo fallan al cargar los eventos. No afecta el
      HOCON ni la decisión en producción
    donde: ACC-TPL-06

