# ── Modo Colombia (bureau.colombia_innersource; SKILL.md «Modo Colombia») ──
# La aplicación de Pinning es COMPARTIDA: lee todas las fuentes bajo
# curatedDir/*/* (PinningIOUtils.scala:23-31) y cada clave de
# oxygen.stage.pinning vale para todas. En modo Colombia NO se escribe el
# bloque oxygen.stage.pinning de abajo: se entrega solo esta lista de
# verificación, con el valor vigente que el equipo confirma en el conf
# compartido. Si la ingesta necesita otro valor en una clave compartida, es
# un bloqueo que se reporta, no una clave que se escribe.
#
#   VERIFICAR oxygen.stage.pinning.paths.identifyingAttributesFile = lista compartida de Colombia
#             (identifying-attributes-new.json)
#             Insumo: debe traer standardizedIdType, standardizedIdNumber y
#             standardizedIdName; contenido [PM] (RG-025). No se regenera.
#   VERIFICAR oxygen.stage.pinning.identityMatcher = matcher compartido de Colombia
#             (ColombiaIdentityMatcher / IdentityImpl, steering 11 §6 #7)
#             Insumo: ColombiaIdentityMatcher (spec §11; HU R-24), sin bandera
#             de fuente (regla 2). FQCN y comportamiento [PM] (RG-025).
#   VERIFICAR oxygen.stage.pinning.reusePin = valor vigente del conf compartido.
#             NO SE ESCRIBE (HF-57). Es global: SparkPinner.scala:223 lo lee
#             una vez y :409 decide para toda la corrida. false renumera los
#             PIN de TODAS las fuentes (:979-985); solo con true la persona
#             existente recibe su PIN (:888-905). «Ingesta nueva → reusePIN =
#             false» en una spec = la ingesta no tiene generación previa
#             propia, no un valor de la clave global. Cambiar la clave es N4:
#             se documenta y se escala (steering 06 §3).
#             Valor de la fuente (dato, no se genera): reusePIN = false
#             (spec-sisben.md §1, §11; hu-sisben.md §3, R-24): ingesta nueva,
#             sin PIN previos propios (PA-009, opción a).
#             Si el valor vigente es false: se escala al PO y a Ingesta 3, sin
#             cambiar nada desde la ingesta (RG-002).
#             PA-010 (abierta, no bloqueante): la próxima versión de HU y spec
#             aclara el sentido de «reusePIN = false» y la ruta Pinned propia
#             (spec §14) frente al pinnedDir único de la aplicación.
#   VERIFICAR oxygen.stage.pinning.paths.domainDictionaryFile, clusterSplitter,
#             nearNeighborBlockSize, pinningVleRange, groupSSR = valores
#             vigentes del conf compartido
#             clusterSplitter: nombre de clave [PM] (constante del código;
#             clave en oxygen-global, RG-025).
#             Insumo: domainDictionaryFile presente (si falta, solo un warn:
#             SparkPinner.scala:192-198); nearNeighborBlockSize vigente sin
#             descartar bloques de SISBEN (~28 M registros por archivo, spec
#             §1; logica-pinning.md §9, fail-silent).
#   VERIFICAR (fork, RG-025) oxygen.stage.pinning.paths.pinnedReferenceDir
#             (SparkPinner.scala:409) e INPUT_REF_DIR (PinningIOUtils.scala:24-25)
#             del conf de Colombia. INPUT_REF_DIR: nombre de clave [PM]
#             (constante del código; clave en oxygen-global, RG-025).
#   VERIFICAR (fork, RG-025) oxygen.stage.curation.paths.curatedDir contiene
#             la salida curada de SISBEN (PinningIOUtils.scala:27); si no,
#             SISBEN no se pinea y no da error. Criterio de cierre de RG-025
#             (INT-052).
#   VERIFICAR (fork, RG-025) integración estática con HBase
#             (SparkPinner.scala:224, :410). Criterio de cierre de RG-025
#             (INT-052).
#   VERIFICAR (fork, RG-025) si el archivo destino es un
#             *-common-application.conf: tocarlo es N4 y se escala (steering 06
#             §3). Criterio de cierre de RG-025 (INT-052).
#
# COLAPSO SILENCIOSO (HF-58): nunca dejes, como «arranque», ISIdentityMatcher
# (o RIIdentityMatcher) ni la lista de ejemplo identifying-attributes.json
# (nationalId, firstName, cellPhone…) con eventos de Colombia (standardizedId*).
# Mecanismo [P] (la construcción de Identity está en oxygen-core):
# Esos slots no existen en el evento: todos valen "" (IdentityMatcher.scala:46-49),
# todas las identidades quedan iguales y se agrupan por identityId en UNA sola
# antes de compararse (SparkPinner.scala:1756-1770). La llave de vecinos "" se
# filtra con groupSSR = true (:676) y los bloques >= 700 se descartan (:719-723).
# Resultado: un solo PIN para todas las personas, sin error.
