# ── Modo Colombia (bureau.colombia_innersource; SKILL.md «Modo Colombia») ──
# Este archivo NO tiene claves: es la lista de verificación de la ingesta
# SISBEN contra el conf compartido de Colombia. La aplicación de
# Pinning es COMPARTIDA: lee todas las fuentes bajo curatedDir/*/*
# (PinningIOUtils.scala:23-31) y cada clave de oxygen.stage.pinning vale para
# todas. Cada VERIFICAR nombra la ruta HOCON que lee el motor; cuando la copia
# del motor solo trae la constante (oxygen-global), el nombre de la clave es
# [PM] y se confirma en el fork. Si la ingesta necesita otro valor en una
# clave compartida, es un bloqueo que se reporta, no una clave que se escribe.
# Generación reproducible: scripts/render_bloque_colombia.py (HF-66).
#
#   VERIFICAR oxygen.stage.pinning.paths.identifyingAttributesFile = lista
#             compartida de Colombia (identifying-attributes-new.json); solo
#             se usa .head (SparkPinner.scala:222, :315). Debe traer las claves
#             del evento curado: standardizedIdType, standardizedIdNumber y, opcional, standardizedIdName. No se regenera.
#   VERIFICAR oxygen.stage.pinning.identityMatcher = matcher compartido de
#             Colombia (Class.forName, SparkPinner.scala:220, :657). Insumo:
#             ColombiaIdentityMatcher (steering 11 §6 #7).
#   VERIFICAR oxygen.stage.pinning.reusePin = valor vigente del conf compartido.
#             NO SE ESCRIBE (HF-57). Es global: SparkPinner.scala:223 lo lee
#             una vez y :409 decide para toda la corrida. false renumera los
#             PIN de TODAS las fuentes (:979-985); solo con true la persona
#             existente recibe su PIN (:888-905). «Ingesta nueva → reusePIN =
#             false» en una spec = la ingesta no tiene generación previa
#             propia, no un valor de la clave global. Cambiar la clave es N4:
#             se documenta y se escala (steering 06 §3).
#             Valor de la fuente (dato, no se genera): reusePIN = false (spec-sisben.md §1, §11; hu-sisben.md §3, R-24): ingesta nueva, sin PIN previos propios
#   VERIFICAR oxygen.stage.pinning.paths.domainDictionaryFile = presente (si
#             falta, solo un warn y sigue con "": SparkPinner.scala:192-198).
#   VERIFICAR oxygen.stage.pinning.nearNeighborBlockSize = valor vigente; los
#             bloques >= este valor se descartan sin error (:719-723).
#   VERIFICAR oxygen.stage.pinning.pinningVleRange = valor vigente (:982).
#   VERIFICAR oxygen.stage.pinning.groupSSR = valor vigente (:665-676).
#   VERIFICAR oxygen.stage.pinning.paths.pinnedReferenceDir = presente
#             (SparkPinner.scala:409; el default lo define siempre).
#   VERIFICAR oxygen.stage.curation.paths.curatedDir = contiene la salida
#             curada de la ingesta (PinningIOUtils.scala:27, curatedDir/*/*); si
#             no, la ingesta no se pinea y no da error.
#   VERIFICAR integración estática con HBase (SparkPinner.scala:224, :410)
#             = valor vigente de la feature; nombre de la clave [PM]
#             (ENABLE_HF_BATCH_STATIC_PIN_INTERGRATION, constante de oxygen-global).
#   VERIFICAR clusterSplitter = valor vigente; nombre de la clave [PM]: la
#             copia solo trae la constante CLUSTER_SPLITTER (SparkPinner.scala:221)
#             y ningún .conf la nombra (AUD-P1).
#   VERIFICAR INPUT_REF_DIR = valor vigente; nombre de la clave [PM]: es la
#             constante que lee PinningIOUtils.scala:21, :24-25, no una clave
#             HOCON de la copia.
#   VERIFICAR *-common-application.conf: si el archivo destino del cambio es
#             un conf común, tocarlo es N4 y se escala (steering 06 §3).
#
# COLAPSO SILENCIOSO (HF-58): nunca dejes, como «arranque», ISIdentityMatcher
