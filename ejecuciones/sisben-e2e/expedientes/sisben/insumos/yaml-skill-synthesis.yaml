# ═════════════════════════════════════════════════════════════
# Instrucción de generación — GDD (ART-061)
# ═════════════════════════════════════════════════════════════
instruccion_generacion_gdd:
  archivo: "propuestas/synthesis/domaindictionary.json (nombre de la HU §6); destino de integración: colombia-domain-dictionary-inner.json del fork, el mismo de ART-032 (steering 07 §6)"
  seccion: "fields[]"
  contenido_a_escribir:
    regla: >
      JSON sin comentarios con raíz {"domain": "sisben", "version": 2, "fields": [...]}. "version": 2 (edf-synthesis
      SKILL.md paso 3; lector DomainDictionaryV2, DomainDictionaryInternal.scala:96-97). "domain" = id de la ingesta
      (spec §1 :18); solo rotula la propuesta: al integrar se fusionan solo las entradas de fields[], como ART-032.
      Una entrada por campo, en el orden de spec §10.1, con exactamente las claves name y description, ambas
      copiadas literal de la entrada de ART-032 con el mismo name (así ART-061 y ART-032 son la misma entrada y la
      integración no puede duplicarla). Sin handler (LFP = ausencia de la clave), sin dataType, sin synthesizer, sin
      periodicity, section, enabled ni complexTypeDefinition. Sin los campos que inyecta el motor. Al integrar: si un
      name ya existe en colombia-domain-dictionary-inner.json (porque ya se fusionó ART-032 o porque lo usa otra
      fuente), no se agrega otra entrada ni se toca la existente (modo_colombia_compartido.nombres_compartidos).
    campos_a_generar:
      - {name: "idFichaOrigen"}
      - {name: "idHogar"}
      - {name: "codDepartamentoSisben"}
      - {name: "nomDepartamento"}
      - {name: "codMunicipioSisben"}
      - {name: "nomMunicipio"}
      - {name: "idClase"}
      - {name: "idPersonaOrden"}
      - {name: "idNacional"}
      - {name: "primerApellido"}
      - {name: "segundoApellido"}
      - {name: "primerNombre"}
      - {name: "segundoNombre"}
      - {name: "tipoDocumento"}
      - {name: "tipoDocumentoSisben"}
      - {name: "numeroDocumento"}
      - {name: "numeroDocumentoOriginal"}
      - {name: "grupoSisben"}
      - {name: "nivelSisben"}
      - {name: "fechaDigitacion"}
      - {name: "fechaActualizacionPersona"}
      - {name: "idMarca"}
      - {name: "idEstado"}
      - {name: "fechaActualizacionCns"}
      - {name: "fechaCorte"}
      - {name: "tipoArchivo"}
      - {name: "standardizedIdType"}
      - {name: "standardizedIdNumber"}
      - {name: "standardizedIdName"}
      - {name: "currentPartyType"}
      - {name: "currentPartyIdNumber"}
      - {name: "subscriberBlockStatus"}
      - {name: "subscriberBlockReason"}
      - {name: "advertenciasCuracion"}
    razon_de_lista_vacia: "no aplica: la lista tiene las 34 entradas"
    estado: "[C] para las 34 entradas (spec §10.1, §12; HU R-25, §6). Ninguna depende de un supuesto abierto"
  verificacion_esperada: "python3 tools/verificar-artefactos-etapa.py synthesis --gdd propuestas/synthesis/domaindictionary.json debe salir sin hallazgos (sin version, nombres repetidos, campos inyectados, handler distinto de EUC/LAP ni claves que la versión 2 ignora); python3 tools/verificar-claves.py --dir insumos coherente"

# ═════════════════════════════════════════════════════════════
# Claves de oxygen.stage.consistencyCheck (ART-062): ninguna se escribe
# ═════════════════════════════════════════════════════════════
claves_configuracion_synthesis:
  regla_del_bloque: >
    ART-062 es un bloque de verificación: no escribe ninguna clave activa de oxygen.stage.consistencyCheck. Cada clave
    va como comentario con su valor esperado en el conf compartido de Colombia y su verificación (VD-SYN-02). Razones:
    la corrida es una sola para todas las fuentes de Colombia (modo_colombia_compartido) y la HU §6 (:345) solo pide
    domaindictionary.json para Synthesis. Nunca se escribe oxygen.stage.synthesis.* (la clave real es consistencyCheck).
  estado_regla: "[C] por el motor y la HU §6 · [P] la forma del archivo compartido del fork (VD-SYN-02)"
  claves:
    - clave: "oxygen.stage.consistencyCheck.eventTypeList"
      valor_a_escribir: null
      se_escribe: false
      dato_de_la_ingesta: "event type 30 (spec §1 :22; HU §3 :38), compartido con otras fuentes de Colombia (HU §3)"
      regla: "No filtra eventos: solo se consulta con checkFileTagEnabled = true (SparkConsistencyChecker.scala:46, :87, :119-131). SISBEN no necesita el fileTag de Synthesis (R-26 es de State Calculation, PA-001). No se escribe [\"30\"] porque reemplazaría la lista de Colombia, ni [\"sisben\"], que es el valor de ejemplo del fixture del repo"
      estado: "[C]"
      fuente: "spec §1, §12; PA-001; SparkConsistencyChecker.scala:46-131; edf-synthesis references/convenciones-oxygen-synthesis.md §2"
    - clave: "oxygen.stage.consistencyCheck.dateType"
      valor_a_escribir: null
      se_escribe: false
      regla: "Obligatoria en el conf compartido (dateType.get, SparkConsistencyChecker.scala:47: sin ella la etapa no arranca). Solo se usa con checkFileTagEnabled (HCUtil.scala:76-90, :125-128): no agrupa por periodo; el periodo sale de getPeriod del evento (HCUtil.scala:109-122). La spec no la fija"
      estado: "[C] que no se escribe · [PM] que exista en el conf de Colombia (VD-SYN-02)"
      fuente: "SparkConsistencyChecker.scala:47; HCUtil.scala:76-128; spec §12"
    - clave: "oxygen.stage.consistencyCheck.checkFileTagEnabled"
      valor_a_escribir: null
      se_escribe: false
      regla: "SISBEN usa el comportamiento por defecto de Synthesis (spec §12) y el corte vigente lo resuelve State Calculation (PA-001). Si el conf de Colombia la tiene en true, los eventos de SISBEN con fileTag reciben voidIndicator (HCUtil.scala:76-88): verificar el efecto con PA-002"
      estado: "[C] que no se escribe · [PM] su valor en Colombia (VD-SYN-02)"
      fuente: "spec §12; PA-001; HCUtil.scala:76-88, :125-128"
    - clave: "oxygen.stage.consistencyCheck.paths.domainDictionaryFile"
      valor_a_escribir: null
      se_escribe: false
      valor_esperado: "[\"colombia-domain-dictionary-inner.json\"] o el nombre que tenga en el fork el GDD de Colombia donde se integran ART-032 y ART-061"
      regla: "Una sola entrada por corrida (head, SparkConsistencyChecker.scala:241); Curation también la exige (SparkCurator.scala:63-64)"
      estado: "[C] que no se escribe · [PM] su valor exacto en el fork (VD-SYN-02)"
      fuente: "steering 07 §6; SparkConsistencyChecker.scala:195, :241; SparkCurator.scala:63-64"
    - clave: "oxygen.stage.consistencyCheck.paths.dictionaryFile"
      valor_a_escribir: null
      se_escribe: false
      regla: "SISBEN no declara reglas CONS-* (spec §12; steering 07 §5.6): no se agrega nada al diccionario de consistencia de Colombia ni se cambia su ruta (dictionaryFile(0), SparkConsistencyChecker.scala:242)"
      estado: "[C]"
      fuente: "spec §12; steering 07 §5.6"
    - clave: "oxygen.stage.consistencyCheck.paths.customRulesFile"
      valor_a_escribir: null
      se_escribe: false
      regla: "Nunca null (customRulesFile.head, SparkConsistencyChecker.scala:245; AUD-S1). SISBEN no tiene reglas custom: queda el valor de Colombia"
      estado: "[C] que no se escribe · [PM] que el conf de Colombia lo tenga no nulo (VD-SYN-02)"
      fuente: "SparkConsistencyChecker.scala:196, :245; edf-synthesis SKILL.md paso 4"
    - clave: "oxygen.stage.consistencyCheck.synthesisOutputAsTSV"
      valor_a_escribir: null
      se_escribe: false
      regla: "Ninguna fuente de la ingesta pide salida TSV; la salida de SISBEN es la ruta Sintetizados de spec §14 (sus rutas son de solo lectura)"
      estado: "[C]"
      fuente: "spec §14; SynthesisIOUtils.scala:131, :415"
    - clave: "oxygen.stage.consistencyCheck.relationshipMigrationProcessorClassName"
      valor_a_escribir: null
      se_escribe: false
      regla: "SISBEN no tiene processors propios de Synthesis (spec §12) ni caso de migración de relaciones; queda el valor de Colombia (null o \"\" = sin migración, SparkConsistencyChecker.scala:250-253)"
      estado: "[C]"
      fuente: "spec §12; SparkConsistencyChecker.scala:250-253"
  pendientes_de_configuracion:
    - {id: "VD-SYN-02", descripcion: "En el conf compartido de Colombia: dateType presente; customRulesFile no nulo; domainDictionaryFile apunta al GDD donde se integran ART-032/ART-061; valor de checkFileTagEnabled y, si es true, efecto del voidIndicator en SISBEN", estado: "[PM]"}

# ═════════════════════════════════════════════════════════════
# Verificaciones diferidas (fork o pipeline). Ninguna es de RG-025
# ═════════════════════════════════════════════════════════════
verificaciones_diferidas:
  - id: "VD-SYN-01"
    descripcion: "En colombia-domain-dictionary-inner.json del fork: cuáles de los 34 nombres ya existen (candidatos en modo_colombia_compartido.nombres_compartidos) y con qué handler, synthesizer y enabled"
    si_falla: "Si un nombre de SISBEN ya existe con handler EUC o LAP, con synthesizer o con enabled = false, ese campo no tendrá LFP para SISBEN (contra spec §12 / HU R-25) o no llegará al sintético: se detiene la integración y se pregunta al PO (bloqueante para la certificación de synthesis). Cambiar la entrada existente afectaría a otras fuentes: N3, no se propone sin su justificación"
    estado: "[PM]"
  - id: "VD-SYN-02"
    descripcion: "Claves del conf compartido de Colombia (claves_configuracion_synthesis.pendientes_de_configuracion)"
    estado: "[PM]"
  - id: "VD-SYN-03"
    descripcion: "Que el conf de Synthesis de Colombia sea un único *-inner.conf compartido por todas las fuentes (modo_colombia_compartido.estado [P])"
    si_falla: "Si existiera un bloque por ingesta, ART-062 tendría que escribir las claves obligatorias (dateType, paths.domainDictionaryFile, paths.dictionaryFile, paths.customRulesFile) con sus valores de Colombia: se vuelve a edf-analisis"
    estado: "[PM]"
  - id: "VD-SYN-04"
    descripcion: "Periodo de los eventos de SISBEN en Synthesis: minFrequency lo pone Validation (FileMetadata.minFrequency, SparkValidator.scala:771, :844) y SISBENFileMetadata (ART-011, propuestas/validation/.../validator/SISBENFileMetadata.scala:16-37) no lo sobrescribe, así que vale el de la clase base de oxygen-domain (fuera del repo). Con asOfDate = fec_actualizacion_cns (HU R-07) se decide si dos cortes de una persona caen en el mismo periodo (efecto residual de C-CUR-05) o, con unidad Unique, en periodos separados (HCUtil.scala:109-122). La spec declara frecuencia Mensual (§1 :24)"
    estado: "[PM]"
  - id: "VD-SYN-05"
    descripcion: "Escenario HU §5.5 en el pipeline: dos eventos del mismo PIN, cortes 202512 y 202601, con un valor distinto y con un campo nulo en 202601 (p. ej. fechaDigitacion): el sintético vigente lleva los valores de 202601 y el campo nulo sin valor"
    estado: "[PM]"

# ═════════════════════════════════════════════════════════════
# Preguntas propuestas (las registra edf-orquestador con su ID)
# ═════════════════════════════════════════════════════════════
preguntas_propuestas:
  - id_propuesto: "PROP-SYN-1"
    pregunta: "Para la próxima versión de HU y spec: si dos cortes de la misma persona caen en el mismo periodo de Synthesis y el más reciente trae un campo nulo (p. ej. idMarca con FORMATO_INVALIDO, Fec_digitacion vacía), ¿debe quedar nulo (R-25 al pie de la letra) o vale conservar el valor del corte anterior del mismo periodo, que es lo que hace el motor con LFP?"
    etapa_afectada: "synthesis"
    bloqueante: false
    por_que_no_bloquea: "Con la spec 1.0.2 ningún artefacto cambia: no hay handler que lo resuelva y la spec §12 excluye un SynthesisProcessor. Si la respuesta pide que el nulo gane, es una versión nueva de la spec. Que el caso ocurra depende de VD-SYN-04"
    que_dice_cada_fuente: "HU R-25: «gana el valor del evento más reciente»; HU §5.6: «fechaEncuesta queda nula»; spec §12: LFP por defecto. Motor: EventSynthesizer.scala:106-107, :139-141; ConsistencyCheckOps.scala:118, :176-181"
riesgo_propuesto:
  - descripcion: "El GDD y el conf de Synthesis son únicos para Colombia: un nombre de SISBEN que ya exista con otro handler, o una clave compartida escrita desde el bloque de SISBEN, cambia la síntesis de otras fuentes o la de SISBEN en silencio"
    nivel: "medio"
    etapa_afectada: "synthesis"
    mitigacion: "ART-061 solo agrega entradas nuevas sin duplicar; ART-062 no escribe claves; VD-SYN-01..03 en el fork antes de certificar"

riesgo_del_insumo:
  nivel: "N2 (medio)"
  motivo: "Configuración compartida de Z1 (GDD de Colombia, aditivo) (06 §2.1). Sube a N3 si VD-SYN-01 encuentra un nombre de SISBEN con otro handler y se propone tocar la entrada existente"

resumen_de_cierre:
  claves_si_generables: "GDD: las 34 entradas de spec §10.1 sin handler (LFP), sin dataType ni synthesizer [C]. HOCON: ninguna clave activa; bloque de verificación con eventTypeList, dateType, checkFileTagEnabled, paths.domainDictionaryFile, paths.dictionaryFile, paths.customRulesFile, synthesisOutputAsTSV y relationshipMigrationProcessorClassName como comentarios [C]"
  bloqueo_principal: "Ninguno para el insumo. La generación espera la aprobación de pinning; la certificación, RG-025 y VD-SYN-01..05. C-CUR-05 y C-CUR-06 cerrados con el motor; RG-010 resuelto por spec §12"
  # Sin estado de aprobación (HF-32): vive solo en estado-ingesta.json.
