# yaml-skill-synthesis.yaml — insumo de edf-synthesis para la ingesta sisben (ART-060), producido por edf-analisis
# (Modo 2, tipo T3). Estructura: .kiro/skills/edf-analisis/assets/templates/_cabecera-yaml-skill.yaml.tpl +
# yaml-skill-synthesis.yaml.tpl (framework 1.9.10). Modo Colombia de edf-synthesis (SKILL.md «Modo Colombia», HF-68).
# El ejemplo assets/examples/sisben/yaml-skill-synthesis.yaml es solo forma: ningún valor se copió de él (su
# eventTypeList ["sisben"], su dateType y sus handlers EUC/LAP propuestos no aplican; LEEME.md).
# Sin estado ni aprobador (HF-32). Versión 3 · 2026-11-25.
#
# Fuentes de la ingesta (únicas): fuentes/hu-sisben.md 1.0.2 (§3, R-07, R-19, R-25, R-26, §5.5, §5.6, §6 fila Synthesis) y
# fuentes/spec-sisben.md 1.0.2 (§1, §10.1, §10.4, §11, §12, §13). La spec no trae un anexo con el contenido de este insumo.
# Claves publicadas: insumos/source-spec-curation.yaml v2 (ART-030, sha256 506e8b9a…). Entradas del domain dictionary de
# Curation: propuestas/curation/fragmentos/colombia-domain-dictionary-inner.sisben.json (ART-032, sha256 d1ee06e3…).
# Evidencia del motor: copia de solo lectura Motor-Oxigen/ (no hay fork de Colombia en esta corrida).
#
# Marcadores (steering 05 §3): [C] confirmado (fuente de la ingesta o lectura directa del motor, con cita) · [P] propuesto
# / inferencia del analista con evidencia · [A:<ID>] abierto · [PM] pendiente-manual (se verifica en el fork o en el
# pipeline) · [S] superado.
#
# Decisiones que usa: INT-065 (aprobador SIM-DEV-01) sobre la auditoría auditorias/synthesis.md (AJUSTES):
#   riesgo N3 con plan de reversión y prueba de no afectación; VD-SYN-01..06 en RG-028 (alto); RG-010 mitigado, no
#   cerrado; RG-026 con su redacción vigente; PA-011 ampliada; minFrequency como verificación diferida (VD-SYN-04), sin
#   revisar ART-011.
# Cambios respecto de la versión 2 (sha256 1097a0fa…; re-auditoría APROBADO, ajustes de INT-070): AUD-S-12 (hash_antes y
#   base de la prueba estática = GDD de Colombia sin ninguna entrada de SISBEN; la reversión retira las 34; efecto sobre
#   Curation [PM]), AUD-S-13 (nunca "handler": null en el JSON), AUD-S-14 (nombre HOCON de datasetFormat [P]; orchestration
#   y datasetFormat del conf por defecto de la plataforma = N4), AUD-S-16 (cita de VD-SYN-04: SparkValidator.scala:1110, :1136).
# Cambios de la versión 2 respecto de la versión 1 (sha256 881db379…):
#   - AUD-S-01: riesgo_del_insumo N3 (alto), con plan_de_reversion y prueba_de_no_afectacion (estática y dinámica [PM]).
#   - AUD-S-02: VD-SYN-06 (reglas CONS, custom y relationshipMigrationProcessor de Colombia sobre los eventos de SISBEN).
#   - AUD-S-03: VD-SYN-02 y claves_configuracion_synthesis con todas las lecturas .get sin defecto.
#   - AUD-S-04: eventTypeList guarda tipos de archivo (fileTag); el fileTag de SISBEN es REGULAR; escalamiento N3.
#   - AUD-S-05: Synthesis lee la ÚLTIMA carpeta *-pin-hc de pinnedDir, no todas.
#   - AUD-S-06: «un dataType inválido rompe el GDD» pasa a [P]; la decisión de omitirlo sigue [C].
#   - AUD-S-07: VD-SYN-05 en tres casos; el caso (c) se anota en PA-002.
#   - AUD-S-09: framework 1.9.10; pinning aprobada (APR-027); ART-050 v3.
#   - AUD-S-10: description nueva en ART-061; ART-061 reemplaza las entradas de ART-032 al integrar (un solo juego).
#   - AUD-S-11: verificación con --modo colombia; prohibido escribir claves para que el verificador pase.
#   - Plantilla 1.9.10: sección modo_colombia (reemplaza modo_colombia_compartido de la v1); campos_a_generar como
#     {name, description, handler}; eventTypeList sin pre-llenar. preguntas_propuestas/riesgo_propuesto de la v1 ya están
#     registradas (PA-011, RG-026, RG-028): pasan a referencias_expediente.
# Ningún valor de este insumo depende de los hechos de RG-025 (matcher de Colombia). PA-002 no afecta a Synthesis
# (PA-001: «Synthesis no cambia»; spec §12); solo recibe el caso VD-SYN-05 (c) como antecedente.

documento:
  tipo: "intermediario-skill"
  etapa_pipeline: "Synthesis/Consistency"
  ingesta: "sisben"
  version: "3.0.0"
  fecha: "2026-11-25"
  # Sin estado ni aprobador (HF-32): viven solo en estado-ingesta.json, que registra edf-orquestador con el hash de este archivo.

procedencia:
  fuente_analisis:
    ruta: ".kiro/skills/edf-analisis/references/logica-synthesis.md"
    version_fuente: "framework 1.9.10 (§4.1, §5.1, §5.1.1, §6.2, §6.3, §12), contrastada con el motor donde la reference no alcanza (dataType, periodicity, eventTypeList, nulos en LFP)"
  fuentes_ingesta:
    hu: "ejecuciones/sisben-e2e/expedientes/sisben/fuentes/hu-sisben.md 1.0.2 (§3, R-07, R-19, R-25, R-26, §5.5, §5.6, §6)"
    spec: "ejecuciones/sisben-e2e/expedientes/sisben/fuentes/spec-sisben.md 1.0.2 (§1, §10.1, §10.4, §11, §12, §13)"
    mapeo_campos: "ejecuciones/sisben-e2e/expedientes/sisben/analisis/mapeo-campos.md (columna Field Handler: «Sin handler propio: LFP por defecto» [C])"
    source_spec_curation: "ejecuciones/sisben-e2e/expedientes/sisben/insumos/source-spec-curation.yaml (v2; 33 campos_curados[].destino + parametros.campo_advertencias = advertenciasCuracion)"
    contrato_curation_pinning: "ejecuciones/sisben-e2e/expedientes/sisben/insumos/contrato-curation-pinning.md (no aporta claves a Synthesis; se cita por la cadena de nombres)"
    domain_dictionary_curation: "ejecuciones/sisben-e2e/expedientes/sisben/propuestas/curation/fragmentos/colombia-domain-dictionary-inner.sisben.json (ART-032, aprobado; 34 entradas {name, description})"
    auditoria: "ejecuciones/sisben-e2e/auditorias/synthesis.md (AJUSTES; AUD-S-01..11) y decisiones INT-065"
  repositorio_base:
    nombre: "oxygen-synthesis (copia Motor-Oxigen/oxygen-synthesis/) · GDD y consistency-application de Colombia en bureau.colombia_innersource (no disponible)"
    naturaleza: "Z2 — solo lectura"
  skill_destino: "edf-synthesis"

alcance:
  genera:
    - "ART-061 · propuestas/synthesis/domaindictionary.json: entradas del GDD de SISBEN en modo Colombia, versión 2, 34 entradas {name, description} sin handler (LFP por defecto), sin dataType, synthesizer, periodicity, section ni enabled (spec §12; HU R-25; HU §6 :345) [C]. Al integrar en el GDD compartido de Colombia reemplaza las entradas de ART-032: queda un solo juego (instruccion_generacion_gdd)"
    - "ART-062 · propuestas/synthesis/consistency-application-block.sisben.conf: lista de verificación del modo Colombia, solo comentarios VERIFICAR <ruta HOCON completa> con el valor esperado en el conf compartido; ninguna clave activa (edf-synthesis SKILL.md «Modo Colombia» punto 2; plantilla del bloque, sección «Modo Colombia») [C]"
    - "Verificación de que las reglas compartidas de Colombia no cambian la síntesis de SISBEN (edf-synthesis SKILL.md «Modo Colombia» punto 3): VD-SYN-06 [PM] (RG-028)"
  no_genera:
    - "SynthesisProcessor ni ConsistencyCheckProcessor propios: spec §12 :325 [C]"
    - "Handlers EUC o LAP para cualquier campo de SISBEN: spec §12 :324 [C]. LFP es la ausencia de la clave handler, nunca el texto \"LFP\" (DomainDictionaryV2.java:48) [C]"
    - "Reglas CONS-* en el diccionario de consistencia de Colombia: la spec no declara ninguna (spec §12; steering 07 §5.6) [C]"
    - "custom-rules propias: sin caso de negocio en la HU ni en la spec [C]"
    - "Campos que inyecta el motor (inferredAsDeleted, shouldDelete, fileTag, subscriberRelationStartDate, subscriberRelationEndDate, firstEventDate): DomainDictionaryInternal.scala:65-70, :101-104 [C]"
    - "Ninguna clave de oxygen.stage.consistencyCheck: modo Colombia (modo_colombia) y la HU §6 :345 solo pide domaindictionary.json para Synthesis [C]"
    - "Mecanismo de R-26 / corte vigente: es de State Calculation (PA-001 resuelta; PA-002 abierta). Synthesis no filtra por corte (spec §12) [C]"
  precondiciones_bloqueantes:
    - id: "habilitacion-synthesis"
      descripcion: "pinning está aprobada (APR-027; ART-050 v3 y ART-053 aprobados) con transicion_habilitada: false. edf-synthesis genera solo con la transición pinning → synthesis habilitada y este insumo aprobado (edf-synthesis SKILL.md Paso 0)"
      efecto: "este insumo puede registrarse y aprobarse; la generación de ART-061/ART-062 espera la transición"
    - id: "RG-025"
      descripcion: "Verificación diferida del matcher de Colombia; bloquea la certificación (no la corrida) de Pinning, Synthesis y State Calculation"
      efecto: "ninguna instrucción de este insumo depende de sus hechos: los nombres del GDD salen de spec §10.1 y el handler de spec §12. Qué eventos comparten PIN (y HC) sí depende del matcher: queda en la certificación [C]"
    - id: "RG-028"
      descripcion: "Verificación diferida de Synthesis de Colombia (VD-SYN-01..06 de este insumo), riesgo alto ya registrado"
      efecto: "bloquea la integración al fork y la certificación de Synthesis y State Calculation; no bloquea la aprobación del insumo ni la generación. Se cierra con VD-SYN-01..06, la mitad dinámica de la prueba de no afectación y un solo juego de entradas del GDD integrado"
    - id: "C-CUR-05 / C-CUR-06"
      descripcion: "Supuestos de Curation que condicionaban la aprobación de este insumo (APR de curation_flow: «yaml-skill-synthesis.yaml no se aprueba sin resolverlos»)"
      efecto: "resueltos en resolucion_supuestos_curation; no cambian ART-030 ni el código de ART-031/032 (la description de ART-032 la reemplaza ART-061 al integrar, AUD-S-10)"

marcado_heredado:
  nota: "Todo valor con marcador distinto de [C] en logica-synthesis.md se transcribe con su marcador original. Ningún [A:*] se resuelve en este YAML. Los pendientes #9 y #10 de logica-synthesis.md §13 (mapeo campo→handler de SISBEN y revalidación de LFP) quedan [S] superados para esta ingesta por spec §12 y HU R-25. OQ-TR-3 (semántica de los handlers, steering 07 §5.6) queda cubierto para SISBEN: la spec define el que usa («LFP, valor del evento más reciente») y el motor lo confirma (EventSynthesizer.scala:134-141)."

trazabilidad:
  citas_formato: "archivo §sección | archivo:línea | ruta/archivo::símbolo"
  ultima_verificacion_referencias: "2026-11-25"

# ═════════════════════════════════════════════════════════════
# Modo Colombia (plantilla 1.9.10; edf-synthesis SKILL.md «Modo Colombia», HF-68)
# ═════════════════════════════════════════════════════════════
modo_colombia:
  aplica: true
  regla: "Ninguna clave de oxygen.stage.consistencyCheck se escribe. ART-062 es la lista VERIFICAR; ART-061 son las entradas del GDD de SISBEN que se integran en el GDD compartido de Colombia sin duplicar names ni modificar entradas de otras fuentes. Si SISBEN necesitara otro valor en una clave compartida, es un bloqueo que se reporta (N3), no una clave que se escribe"
  estado: "[C]"
  fuente: "expediente: ART-061 y ART-062 registrados en modo Colombia (orquestador, prompt 00 paso 2); spec §11 (matcher y aplicación de Pinning compartidos de Colombia) y §13 («configuración estándar de Colombia, sin cambios»); motor (hechos)"
  hechos:
    - "Una corrida lee UN solo GDD (domainDictionaryFile.head), UN diccionario de consistencia (dictionaryFile(0)) y UN customRulesFile.head (SparkConsistencyChecker.scala:194-196, :241-245) [C]"
    - "Lee la ÚLTIMA carpeta *-pin-hc de pinnedDir; si hay más de una, deja un error en el log y toma la última (SynthesisIOUtils.scala:146-160, :163-171). Procesa todos los eventos de ese HC (ConsistencyCheckOps.performChecks), sin filtrar por eventType ni por fuente [C]. Una ruta Pinned propia de SISBEN no se leería (PA-010 (2))"
    - "eventTypeList no filtra eventos: guarda tipos de archivo (listFileTypes), se consulta al Process Management por cada valor y solo con checkFileTagEnabled = true (SparkConsistencyChecker.scala:46, :86-104, :119-131) [C]"
    - "El HC de Colombia junta los eventos de todas las fuentes por PIN porque Pinning es compartido (PinningIOUtils.scala:23-31; PA-009; ART-050 v3 modo Colombia) [C]"
    - "El GDD de Colombia es un solo archivo, colombia-domain-dictionary-inner.json, que se extiende de forma aditiva (steering 07 §6; steering 02 «Domain dictionary / GDD»); Curation también lee consistencyCheck.paths.domainDictionaryFile (SparkCurator.scala:63-64) [C]"
    - "Un campo que no está en el GDD no pasa al evento sintético: synthesize recorre solo los campos del diccionario sobre un mapa nuevo por periodo (EventSynthesizer.scala:105-110) [C]. Por eso las 34 claves de SISBEN van al GDD (también las de identidad, que alimentan NAMES e IDENTIFICATIONS, spec §13 :339)"
    - "Las reglas compartidas (CONS-* de dictionaryFile(0), custom de customRulesFile.head, relationshipMigrationProcessor) se evalúan sobre todos los eventos del HC, también los de SISBEN (ConsistencyCheckOps.scala:150-173, :240-271; SparkConsistencyChecker.scala:241-253) [C]. Su efecto sobre SISBEN es VD-SYN-06 [PM]"
  conf_compartido_unico: "[P] que el conf de Synthesis de Colombia sea un único *-inner.conf para todas las fuentes (no hay fork) · [PM] su contenido (VD-SYN-02, VD-SYN-03). orchestration y datasetFormat vienen del conf por defecto de la plataforma (oxygen-config-default-local.conf:104-119 en la copia del motor), no del inner de Colombia: tocarlos es N4 (*-common-application / base inmutable, 06 §2.2); si faltan o no sirven a SISBEN se documenta y se escala, nunca se escriben (AUD-S-14)"
  nombres_compartidos:
    descripcion: "El handler es por nombre de campo, no por fuente. Si el GDD de Colombia ya tiene una entrada con un nombre de SISBEN (candidatos: standardizedIdType, standardizedIdNumber, standardizedIdName, que también publica MURIC, curation-muric.md:75-76; currentPartyType, currentPartyIdNumber, subscriberBlockStatus, subscriberBlockReason), esa entrada gobierna también a SISBEN; modificarla afectaría a la otra fuente (RG-026)"
    regla: "No se agrega una segunda entrada con el mismo name ni se modifica la existente (steering 07 §6 «Aditivo»). Un name repetido haría que synthesize procese el campo dos veces y el resultado dependería del orden (EventSynthesizer.scala:110-141; DomainDictionaryInternal.scala:47 fieldsMap)"
    estado: "[C] la regla · [PM] qué nombres existen ya en el fork y con qué handler (VD-SYN-01)"

decision_nomenclatura_handlers:
  version_adoptada: "A"                             # logica-synthesis.md §5.1.1 — no cambiar sin decisión registrada
  definiciones:
    LFP: "Latest For Period"
    LAP: "Latest Across Period"
    EUC: "Earliest Until Corrected"
  estado: "[C]"
  fuente: "logica-synthesis.md §5.1.1; DomainDictionaryFieldHandler.java:10-12 (mismas siglas y descripciones en el motor)"

# ═════════════════════════════════════════════════════════════
# RG-010 — la spec manda (mitigado; se cierra con el insumo de State Calculation, INT-065)
# ═════════════════════════════════════════════════════════════
rg_010:
  decision: "SISBEN pasa por Synthesis; todos sus campos con el comportamiento por defecto del motor (LFP); sin processors propios"
  estado: "[C]"
  fuente: "spec-sisben.md §12 (:323-325); hu-sisben.md R-25 (:94), §5.5 (:311-313), §6 fila Synthesis (:345)"
  estado_del_riesgo: "mitigado por este insumo (cita siempre la spec); sigue abierto hasta que se apruebe el insumo de State Calculation (INT-065 (4))"
  descartado:
    - cita: "edf-analisis/references/fuentes/curation-pinning-sisben.md §6 (:256) y §8 (:421); también :463, :477, :494"
      dice: "«Use EDF, but no synthesis for this. Periodicity will be Unique»"
      por_que_no_aplica: "no es fuente de la ingesta (HU §3: «Únicamente esta HU y spec-sisben.md»); evidencia de nivel 3; steering 03 §9 #11 la da por resuelta para SISBEN con spec §12. La spec declara frecuencia «Mensual» (§1 :24; HU §3 :39)"
      estado: "[S]"
  nota_periodicidad: "Dos conceptos distintos: (1) la clave periodicity de cada campo del GDD, que se omite (resolucion_supuestos_curation.periodicity); (2) la periodicidad del evento (Unique, mensual…), que no fija Synthesis sino minFrequency del evento, que pone Validation: VD-SYN-04 (RG-028) y PA-011 (3)"

# ═════════════════════════════════════════════════════════════
# Supuestos de Curation que se cierran aquí
# ═════════════════════════════════════════════════════════════
resolucion_supuestos_curation:

  C-CUR-05:
    supuesto: "Curation escribe los nulos como null (salvo standardizedId*, que se omiten si son nulas: omitir_si_nulas, RG-019); «confirmar con Synthesis» que LFP no los propaga como valor (edf-curation/references/decisiones-y-abiertos.md:47; auditorias/curation.md, AUD-C-15)"
    respuesta: "Confirmado: LFP no escribe un nulo en el evento sintético. Una clave nula y una clave ausente son equivalentes para Synthesis"
    estado: "[C]"
    evidencia:
      - "EventSynthesizer.scala:134-137 (IncrementalEventSynthesizer.synthesize, rama LFP sin synthesizer): value = curatedRecordJson.get(name) si la clave existe; si no, null"
      - "EventSynthesizer.scala:139-141: solo se hace put del campo si value != null"
      - "EventSynthesizer.scala:105-107 y ConsistencyCheckOps.scala:125: cada periodo empieza con un mapa vacío; el valor de un periodo anterior no se arrastra"
      - "SISBENCuratedEvent.scala:145 (ART-031): Gson con serializeNulls, y Curator.scala:157 lo convierte a Map: la clave llega con null. Si Pinning la quitara al escribir el HC, el resultado en Synthesis es el mismo"
    consecuencia_para_sisben:
      - "Entre periodos se cumplen HU R-25 y §5.6: el sintético del periodo más reciente lleva los valores de su evento, y un campo nulo queda sin valor, no con el del corte anterior [C]"
      - "Curation no tiene que cambiar: escribir null u omitir la clave da lo mismo en Synthesis [C]"
    efecto_residual:
      descripcion: "Dentro de un MISMO periodo y la misma relación (subscriber + subscriberRelation), los eventos se procesan en orden (asOfDate, receivedDate) sobre el mismo sintético parcial (ConsistencyCheckOps.scala:115, :118, :176-181). Un null del evento posterior no borra el valor no nulo de un evento anterior del mismo periodo"
      cuando_ocurre: "Con periodo mensual y asOfDate = fec_actualizacion_cns (HU R-07), dos cortes de una persona cuyo registro no cambió caen en el mismo periodo; es el caso normal. El nulo que no gana solo aparece si un campo pasa a nulo sin que cambie fec_actualizacion_cns (p. ej. FORMATO_INVALIDO o NO_HOMOLOGABLE en un solo corte) (auditorias/synthesis.md §4.4)"
      estado: "[C] el comportamiento del motor · [PM] la periodicidad efectiva (VD-SYN-04) y el escenario (VD-SYN-05)"
      tratamiento: "PA-011 (no bloqueante), ampliada en referencias_expediente. No cambia ningún artefacto de esta versión: la única forma de que un null «gane» sería un SynthesisProcessor, que spec §12 excluye"

  C-CUR-06:
    supuesto: "dataType del domain dictionary (enum Datatype de oxygen-global, fuera del repo; STRING por defecto): «lo fija Synthesis» por campo si la skill lo usa (decisiones-y-abiertos.md:48; ART-032 _generado_por)"
    respuesta: "No se fija: dataType se omite en los 34 campos (queda STRING por defecto)"
    estado: "[C]"
    evidencia:
      - "DomainDictionaryV2.java:46-56: claves de campo name, handler (LFP), periodicity (true), complexTypeDefinition, dataType (Datatype.STRING), synthesizer, description, section (\"default\"), enabled (true) [C]"
      - "DomainDictionaryV2.java:29-37: dataType pasa a DictionaryFieldInternal.fieldType; section no se usa; enabled=false saca el campo del diccionario [C]"
      - "fieldType solo se lee en ASTUtil.scala:547-561 (getFieldTypeFromDomainDictionary), desde los parsers del DSL de consistencia (Trigger, Reference, Check). SISBEN no tiene reglas propias (spec §12; steering 07 §5.6) [C]"
      - "IncrementalEventSynthesizer copia el valor tal como llega, sin mirar el tipo (EventSynthesizer.scala:110-141) [C]"
      - "Curation recibe el tipo del diccionario (Curator.scala:154) pero no lo usa en curateTaggedEvent (Curator.scala:152-187) [C]"
    razon_adicional: "Un valor inválido de dataType haría fallar la lectura del GDD compartido: el enum Datatype y la configuración de JacksonUtil están fuera del repo, así que es inferencia (edf-synthesis SKILL.md paso 3). La decisión no depende de esta razón [P] (AUD-S-06)"
    consecuencia_para_sisben: "El tipo de salida de spec §10.1 lo da el evento curado (ART-031) y lo conserva Synthesis. El tipo que lee State Calculation es el de su propia configuración (FoundationField.dataType, FoundationField.java:35), que decide el insumo de State Calculation [C]. Si las entradas actuales del GDD de Colombia llevan dataType por convención, omitirlo sigue siendo seguro (STRING); se anota en VD-SYN-01 [PM]"

  periodicity:
    decision: "Se omite en los 34 campos (true por defecto, DomainDictionaryV2.java:49)"
    estado: "[C]"
    evidencia: "Ninguna fuente pide false (spec §12 «comportamiento por defecto»). periodicity solo aparece en su declaración y su lectura (DomainDictionaryV1.java:47, DomainDictionaryV2.java:49, DomainDictionaryInternal.scala:31, :120-123): no la consulta ningún otro código de oxygen-synthesis (grep)"

# ═════════════════════════════════════════════════════════════
# CORE — Mapeo de campos SISBEN → handler (LFP/LAP/EUC) en el GDD
# ═════════════════════════════════════════════════════════════
mapeo_campos_handler:
  nota_general: >
    Lista completa del evento curado de SISBEN: las 34 claves de spec-sisben.md §10.1 (:244-280), que la spec declara
    «lista completa» (:282) y con nombres definitivos que Synthesis cita literalmente (:243). Las 34 están literales en
    source-spec-curation.yaml (33 campos_curados[].destino + parametros.campo_advertencias) y en ART-032. Todas usan el
    comportamiento por defecto del motor, LFP, por fuente de la ingesta y no por inferencia: spec §12 (:324) «El
    domaindictionary.json no declara handlers para los campos de SISBEN: todos usan el comportamiento por defecto del
    motor (LFP, valor del evento más reciente)» y HU R-25 (:94). En el GDD, LFP es la ausencia de la clave handler.
    Ningún campo lleva synthesizer (spec §12 :325), dataType ni periodicity (resolucion_supuestos_curation).
  campos_con_mapeo_confirmado:
    # Cada entrada: nombre_en_gdd = campo curado literal; handler_propuesto LFP = sin clave handler en el JSON.
