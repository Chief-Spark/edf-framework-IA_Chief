# ═════════════════════════════════════════════════════════════
# Instrucción de generación — GDD (ART-061)
# ═════════════════════════════════════════════════════════════
instruccion_generacion_gdd:
  archivo: "propuestas/synthesis/domaindictionary.json (nombre de la HU §6); destino de integración: el GDD compartido de Colombia (colombia-domain-dictionary-inner.json, steering 07 §6), el mismo de ART-032"
  seccion: "fields[]"
  contenido_a_escribir:
    regla: >
      JSON sin comentarios con raíz {"domain": "sisben", "version": 2, "fields": [...]}. "version": 2 (edf-synthesis
      SKILL.md paso 3 y «Modo Colombia» punto 1; lector DomainDictionaryV2, DomainDictionaryInternal.scala:96-97).
      "domain" = id de la ingesta (spec §1 :18); solo rotula la propuesta: al integrar se fusionan solo las entradas de
      fields[]. Una entrada por campo, en el orden de spec §10.1, con exactamente name y description: name literal (los
      34 nombres de ART-032 y de campos_curados[].destino, sin cambiar ninguno); description = el texto fijo de
      campos_a_generar (AUD-S-10; inerte para el motor). handler null en todas = LFP = sin la clave handler en el JSON.
      Sin dataType, synthesizer, periodicity, section, enabled ni complexTypeDefinition. Sin los campos que inyecta el
      motor.
    regla_handler_null: >
      Nunca "handler": null en el JSON: handler: null de campos_a_generar significa LFP y se traduce en OMITIR la clave.
      Un null literal rompe la lectura del GDD compartido (DomainDictionaryV2.java:32 hace getHandler().identifier()) [P]
      (AUD-S-13). Prueba asociada: el verificador --modo colombia (una transcripción literal con "handler": null da 34
      hallazgos). Criterio de aprobación de ART-061: --modo colombia --gdd sin hallazgos y ninguna clave handler en el JSON.
    integracion: >
      ART-061 REEMPLAZA las entradas de ART-032 al integrar: en el GDD compartido queda un solo juego de entradas de
      SISBEN (34 names, cada uno una vez), con la description de ART-061; las de ART-032 no se fusionan aparte (criterio
      de cierre de RG-028). Un name que ya existía en el GDD de Colombia antes de SISBEN (de otra fuente) no se agrega ni
      se modifica: su entrada gobierna también a SISBEN y se informa en VD-SYN-01. La corrección del texto de ART-032 para
      su próxima versión queda anotada (auditorias/synthesis.md AUD-S-10); ART-032 no se reabre.
    campos_a_generar:
      - {name: "idFichaOrigen", description: "Campo curado SISBEN (spec §10.1); LFP por defecto, sin dataType (spec §12)", handler: null}
      - {name: "idHogar", description: "Campo curado SISBEN (spec §10.1); LFP por defecto, sin dataType (spec §12)", handler: null}
