# ═════════════════════════════════════════════════════════════
# Claves de oxygen.stage.consistencyCheck (ART-062): modo Colombia, ninguna se escribe
# ═════════════════════════════════════════════════════════════
claves_configuracion_synthesis:
  regla_del_bloque: >
    ART-062 es la lista de verificación del modo Colombia: solo comentarios, con una línea «VERIFICAR <ruta HOCON
    completa> = <valor esperado>» por cada clave de esta lista (las 11 que exige el verificador --modo colombia, más synthesisOutputAsTSV como comentario informativo), sin
    ninguna línea activa. Nunca oxygen.stage.synthesis.*. Si una verificación falla, es un bloqueo que se reporta, no una
    clave que se escribe.
  estado_regla: "[C] (edf-synthesis SKILL.md «Modo Colombia»; HU §6 :345) · [PM] los valores del conf de Colombia (VD-SYN-02)"
  claves:
    - clave: "oxygen.stage.consistencyCheck.eventTypeList"
      valor_a_escribir: ""
      se_escribe: false
      dato_de_la_ingesta: "El fileTag de SISBEN es «REGULAR» (ART-011 SISBENSpec.scala:174 fileTagPorPrefijo \"\" -> \"REGULAR\"; SISBENFileMetadata.scala:35-37), un valor genérico. No es el event type 30"
      regla: "Guarda TIPOS DE ARCHIVO (fileTag), no el event type: listFileTypes (SparkConsistencyChecker.scala:46) se consulta al Process Management y el mapa de fechas se indexa por fileTag (:86-104; HCUtil.scala:76-87); solo con checkFileTagEnabled = true. No filtra eventos. VERIFICAR = lista de Colombia, sin reemplazarla ni agregarle nada. Si checkFileTagEnabled = true y otra fuente de Colombia usa el fileTag REGULAR, la fecha más reciente de una cruza la de la otra (voidIndicator en las dos direcciones): se escala (N3) (AUD-S-04)"
      estado: "[C] que no se escribe · [PM] el valor de Colombia y el uso de REGULAR por otra fuente (VD-SYN-02)"
      fuente: "SparkConsistencyChecker.scala:46, :86-104, :119-131; HCUtil.scala:76-87; CreditFileMetadata.scala:51-53; edf-synthesis SKILL.md paso 4"
    - clave: "oxygen.stage.consistencyCheck.dateType"
      valor_a_escribir: ""
      se_escribe: false
      regla: "Obligatoria aunque checkFileTagEnabled sea false (dateType.get, SparkConsistencyChecker.scala:47: sin ella la etapa no arranca). Solo alimenta el voidIndicator (HCUtil.scala:76-87, :125-130); no agrupa por periodo (el periodo sale de getPeriod, HCUtil.scala:109-124). VERIFICAR = presente"
      estado: "[C] que no se escribe · [PM] que exista (VD-SYN-02)"
      fuente: "SparkConsistencyChecker.scala:47; HCUtil.scala:76-130"
    - clave: "oxygen.stage.consistencyCheck.checkFileTagEnabled"
      valor_a_escribir: ""
      se_escribe: false
      regla: "SISBEN usa el comportamiento por defecto (spec §12) y el corte vigente lo resuelve State Calculation (PA-001). VERIFICAR = valor vigente; con true, los eventos de SISBEN con fileTag REGULAR reciben voidIndicator (HCUtil.scala:76-88): revisar con PA-002 y la regla de eventTypeList"
      estado: "[C] que no se escribe · [PM] su valor (VD-SYN-02)"
      fuente: "spec §12; PA-001; SparkConsistencyChecker.scala:48; HCUtil.scala:76-88"
    - clave: "oxygen.stage.consistencyCheck.historicAttributeArgs"
      valor_a_escribir: ""
      se_escribe: false
      regla: "VERIFICAR = presente si checkFileTagEnabled = true (historicAttributeArgs.get, SparkConsistencyChecker.scala:122)"
      estado: "[C] que no se escribe · [PM] (VD-SYN-02)"
      fuente: "SparkConsistencyChecker.scala:119-131"
    - clave: "oxygen.stage.consistencyCheck.fieldHandlerHashFunction"
      valor_a_escribir: ""
      se_escribe: false
      regla: "VERIFICAR = presente (fieldHandlerHashFunction.get, SparkConsistencyChecker.scala:202; el nombre HOCON exacto se confirma en el fork)"
      estado: "[C] que no se escribe · [PM] (VD-SYN-02)"
      fuente: "SparkConsistencyChecker.scala:202"
    - clave: "oxygen.stage.consistencyCheck.orchestration"
      valor_a_escribir: ""
      se_escribe: false
      regla: "VERIFICAR = presente, con source y target (orchestration.get, SparkConsistencyChecker.scala:68-69). Viene del conf por defecto de la plataforma: tocarlo es N4 (modo_colombia.conf_compartido_unico)"
      estado: "[C] que no se escribe · [PM] (VD-SYN-02)"
      fuente: "SparkConsistencyChecker.scala:66-70"
    - clave: "oxygen.stage.consistencyCheck.datasetFormat"
