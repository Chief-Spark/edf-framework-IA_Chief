# ═════════════════════════════════════════════════════════════
# Verificaciones diferidas (fork o pipeline): todas en RG-028. Ninguna es de RG-025
# ═════════════════════════════════════════════════════════════
verificaciones_diferidas:
  riesgo: "RG-028 (alto): bloquea la integración al fork y la certificación de Synthesis y State Calculation"
  lista:
    - id: "VD-SYN-01"
      descripcion: "En el GDD compartido de Colombia: cuáles de los 34 nombres ya existían antes de SISBEN (candidatos en modo_colombia.nombres_compartidos) y con qué handler, synthesizer, enabled y dataType"
      si_falla: "Si un nombre de SISBEN ya existe con handler EUC o LAP, con synthesizer o con enabled = false, ese campo no tendrá LFP para SISBEN (contra spec §12 / HU R-25) o no llegará al sintético: se detiene la integración y se pregunta al PO (bloqueante para la certificación). No se modifica la entrada existente (N3, afectaría a otra fuente)"
      estado: "[PM]"
    - id: "VD-SYN-02"
      descripcion: "Lecturas del conf compartido (claves_configuracion_synthesis.pendientes_de_configuracion)"
      estado: "[PM]"
    - id: "VD-SYN-03"
      descripcion: "Que el conf de Synthesis de Colombia sea un único *-inner.conf compartido por todas las fuentes (modo_colombia.conf_compartido_unico [P])"
      si_falla: "Si existiera una aplicación propia de SISBEN, el modo pasa a propio: ART-062 escribiría las claves obligatorias con sus valores; se vuelve a edf-analisis"
      estado: "[PM]"
    - id: "VD-SYN-04"
      descripcion: "Periodicidad efectiva de los eventos de SISBEN: minFrequency lo pone Validation (fileMetadata.minFrequency, SparkValidator.scala:1110, :1136) y SISBENFileMetadata (ART-011) no lo sobrescribe, así que vale el de domain.internal.FileMetadata de oxygen-domain (fuera del repo). La copia homóloga de oxygen-synthesis tiene Frequency.onceEveryMonth (consistencycheck/domain/FileMetadata.scala:37): mensual es lo probable, pero es inferencia [P]. Con mensual, dos cortes con la misma fec_actualizacion_cns comparten periodo; con Unique, un periodo por evento (HCUtil.scala:109-124). No se revisa ART-011 (INT-065 (5))"
      estado: "[PM]"
    - id: "VD-SYN-05"
      descripcion: "Escenario HU §5.5 / §5.6 en el pipeline. La síntesis parcial se agrupa por subscriber + subscriberRelation (= <standardizedIdType>_<standardizedIdNumber>, spec §10.1 :284), no por PIN (ConsistencyCheckOps.scala:125, :177-181). Tres casos"
      casos:
        - id: "a"
          caso: "Misma SR, misma fec_actualizacion_cns en 202512 y 202601: mismo periodo, se acumula sobre el mismo sintético; gana 202601 en todo valor no nulo y un campo que pasa a nulo en 202601 conserva el de 202512 (PA-011)"
        - id: "b"
          caso: "Misma SR, distinta fec_actualizacion_cns: periodos separados, mapa nuevo; el sintético vigente lleva solo los valores de 202601 y el campo nulo queda sin valor. Si 202601 trae una fec_actualizacion_cns ANTERIOR a la de 202512, no gana (orden por asOfDate, ConsistencyCheckOps.scala:115, :118; PA-011 (2))"
        - id: "c"
          caso: "Misma persona con SR distinta entre cortes (p. ej. cambia el tipo de documento): el mismo PIN queda con dos sintéticos y el de 202512 sigue con sus valores. Se resuelve en State Calculation: antecedente anotado en PA-002"
      estado: "[PM]"
    - id: "VD-SYN-06"
      descripcion: "Reglas compartidas de Colombia aplicadas a todos los eventos del HC (ConsistencyCheckOps.scala:150-173, :240-271; SparkConsistencyChecker.scala:241-253): listar las reglas CONS-* de dictionaryFile(0) y las custom de customRulesFile.head cuya triggerCondition puede ser verdadera para un evento de SISBEN (sin filtro por dataSource DNP / subscriber 999722, o sobre campos que SISBEN publica, también los compartidos standardizedId*, currentParty*, subscriberBlock*; una clave null «existe» para el DSL, ASTUtil.scala:534-539), y confirmar que el relationshipMigrationProcessor no actúa sobre subscriber 999722"
      si_falla: "Si alguna regla excluye campos (excludeField) o el evento (shouldFilterEventOnError) de SISBEN, o el processor migra relaciones de SISBEN: se para la certificación y se pregunta al PO (N3). No se modifica la regla desde la ingesta"
      estado: "[PM]"

# ═════════════════════════════════════════════════════════════
# Riesgo del insumo: N3 (AUD-S-01; INT-065 (1))
# ═════════════════════════════════════════════════════════════
riesgo_del_insumo:
  nivel: "N3 (alto)"
  motivo: "Se clasifica por el criterio más alto (06 §2.1): etapa afectada 5 → N3 y alcance varias ingestas (GDD y conf únicos para Colombia, RG-026) → N3; plan-de-ruta.md:25 y edf-orquestador/references/04-contratos-por-skill.md (etapa 5) fijan N3. La zona (Z1, configuración compartida) sola sería N2"
  analisis_de_impacto_en_otras_ingestas:
    - "ART-061 solo agrega entradas nuevas al GDD compartido; un name existente de otra fuente no se toca (VD-SYN-01). Sin cambio de handler en ninguna entrada existente, la síntesis de otras fuentes no cambia: synthesize recorre los campos del GDD y un campo que el evento de otra fuente no trae da null y no se escribe (EventSynthesizer.scala:134-141) [C]"
    - "ART-062 no escribe claves: el conf compartido no cambia [C]"
    - "Lo que sí puede afectar a SISBEN desde Colombia (reglas compartidas, nombres compartidos, fileTag REGULAR) está en VD-SYN-01, -02 y -06 [PM]"
  plan_de_reversion:
    - "hash_antes = sha256 del GDD compartido de Colombia SIN ninguna entrada de SISBEN (ni de ART-032 ni de ART-061), y lista de los names que ya existían de otras fuentes. Si ART-032 ya estaba integrado, hash_antes se calcula sobre el GDD con sus 34 entradas retiradas (AUD-S-12)"
    - "Integración: queda un solo juego de entradas de SISBEN, el de ART-061; un name que ya existía de otra fuente no se agrega ni se toca. Si ART-032 ya estaba integrado, en esas 34 entradas solo puede cambiar la description; se registra la lista por nombre y el sha256 resultante (hash_despues)"
    - "Reversión: retirar las 34 entradas de SISBEN listadas por nombre, vengan de ART-032 o de ART-061; nunca retirar una entrada que ya existía de otra fuente (aunque coincida con un name de SISBEN). Comprobar que el sha256 vuelve a hash_antes"
    - "Efecto sobre Curation: ART-032 y ART-061 comparten el archivo (Curation lee consistencyCheck.paths.domainDictionaryFile, SparkCurator.scala:63-64), así que la reversión también retira las entradas que aportó Curation. Que Curation no necesite esas entradas para curar SISBEN queda [PM] (criterio de RG-028)"
    - "ART-062 no requiere reversión (no escribe claves)"
    - "Si ya se generaron sintéticos con el GDD integrado, la reversión exige reprocesar Synthesis (y lo que dependa de ella): es N3 y requiere su propia aprobación"
  prueba_de_no_afectacion:
    estatica_obligatoria:
      - "diff entre el GDD base (sin ninguna entrada de SISBEN, el de hash_antes) y el resultante: solo agrega las entradas de SISBEN (ninguna entrada de otra fuente cambia ni se borra). Si ART-032 ya estaba integrado, contra él solo cambia la description de sus 34 entradas"
      - "ningún handler existente cambia"
      - "el GDD resultante es JSON válido con version 2"
      - "python3 tools/verificar-artefactos-etapa.py synthesis --modo colombia --gdd <GDD> sin hallazgos (sin names repetidos)"
      - "ART-062 sin claves activas fuera de comentarios (--modo colombia --hocon sin hallazgos)"
    dinamica_diferida: "[PM] síntesis de otra fuente de Colombia igual antes y después de integrar ART-061 (mismos sintéticos para el mismo HC); criterio de cierre de RG-028"
  aprobacion: "N3: Desarrollador con justificación escrita (06 §3)"

# ═════════════════════════════════════════════════════════════
# Referencias del expediente (ya registradas por el Orquestador)
# ═════════════════════════════════════════════════════════════
referencias_expediente:
  - id: "PA-011"
    origen: "PROP-SYN-1 de la versión 1 (INT-056); no bloqueante, etapa synthesis"
    ampliacion_propuesta:
      - "(1) Si dos cortes de la misma persona caen en el mismo periodo y el más reciente trae un campo nulo, ¿debe ganar el nulo? (la pregunta registrada). Con periodo mensual y asOfDate = fec_actualizacion_cns es el caso normal para un registro sin cambios; el nulo que no gana aparece solo si el campo pasa a nulo sin que cambie fec_actualizacion_cns"
      - "(2) El motor no ordena por corte sino por (asOfDate, receivedDate) (ConsistencyCheckOps.scala:115, :118): un corte 202601 con fec_actualizacion_cns anterior a la de 202512 no gana, contra HU §5.5 en ese caso raro (AUD-S-08)"
      - "(3) La spec debe declarar la periodicidad del evento (Unique o mensual): hoy la frecuencia «Mensual» de spec §1 describe la llegada del archivo y minFrequency no se fija en Validation (VD-SYN-04)"
  - id: "RG-026"
    redaccion_vigente: "El GDD, el diccionario de consistencia y las reglas custom son únicos para Colombia. Una entrada existente gobierna también a SISBEN, y modificarla afectaría a la otra fuente. Las reglas compartidas se aplican a los eventos de SISBEN (verificación en RG-028)"
    en_este_insumo: "modo_colombia.nombres_compartidos; VD-SYN-01, VD-SYN-06"
  - id: "RG-028"
    en_este_insumo: "verificaciones_diferidas VD-SYN-01..06"
  - id: "RG-010"
    en_este_insumo: "rg_010 (mitigado)"
  - id: "PA-002"
    antecedente: "VD-SYN-05 (c): misma persona con SR distinta entre cortes deja dos sintéticos para un PIN; también (fechaCorte nunca es nula, spec §10.1) el sintético vigente lleva siempre el último corte procesado del periodo"

resumen_de_cierre:
  claves_si_generables: "GDD (ART-061): las 34 entradas de spec §10.1 como {name, description}, handler null (LFP), sin dataType ni synthesizer, version 2 [C]; reemplazan las de ART-032 al integrar. HOCON (ART-062): ninguna clave activa; lista VERIFICAR de las 11 claves que exige --modo colombia (eventTypeList, dateType, checkFileTagEnabled, historicAttributeArgs, fieldHandlerHashFunction, orchestration, datasetFormat, paths.domainDictionaryFile, paths.dictionaryFile, paths.customRulesFile, relationshipMigrationProcessorClassName) y synthesisOutputAsTSV informativa [C]"
  bloqueo_principal: "Ninguno para el insumo. La generación espera la transición pinning → synthesis; la integración al fork y la certificación, RG-025 y RG-028 (VD-SYN-01..06). C-CUR-05 y C-CUR-06 cerrados con el motor; RG-010 mitigado por spec §12. Riesgo N3"
  # Sin estado de aprobación (HF-32): vive solo en estado-ingesta.json.
