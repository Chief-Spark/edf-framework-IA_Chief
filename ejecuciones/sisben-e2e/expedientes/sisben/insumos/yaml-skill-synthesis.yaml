      - {name: "idClase", description: "Campo curado SISBEN (spec §10.1); LFP por defecto, sin dataType (spec §12)", handler: null}
      - {name: "idPersonaOrden", description: "Campo curado SISBEN (spec §10.1); LFP por defecto, sin dataType (spec §12)", handler: null}
      - {name: "idNacional", description: "Campo curado SISBEN (spec §10.1); LFP por defecto, sin dataType (spec §12)", handler: null}
      - {name: "primerApellido", description: "Campo curado SISBEN (spec §10.1); LFP por defecto, sin dataType (spec §12)", handler: null}
      - {name: "segundoApellido", description: "Campo curado SISBEN (spec §10.1); LFP por defecto, sin dataType (spec §12)", handler: null}
