# FIXTURE SINTÉTICO de Curation · ingesta `sisben` (insumo de `edf-analisis`, ART-030). Ningún dato corresponde a una
# persona real: nombres inventados, documentos con prefijo 1000000 y códigos DIVIPOLA públicos del DANE.
# Eventos TaggedValidatedEvent ya ACEPTADOS (salida de Acceptance). validatedRecordJson lleva el valor CRUDO de cada campo
# (Validation aprobada, AUD-V-05: SISBENValidatedEvent.comoMapa con Campos.crudo). El generador combina base_registro con
# el `registro` de cada evento.
# Casos: HU §5.3 (escenarios de Curation), spec §10.1, §10.2, §10.4; riesgos RG-005 y RG-007.

# Registro base: el registro_base del fixture de Validation (Anexo A), sintético.
base_registro:
  ID_FICHA_ORIGEN: "0900000101"
  ID_HOGAR: "1"
  COD_DPTO: "05"
  NOM_DPTO: "ANTIOQUIA"
  COD_MPIO: "05001"
  NOM_MPIO: "MEDELLIN"
  ID_CLASE: "1"
  ID_PERSONA_ORDEN: "1"
  ID_NACIONAL: "9300000101"
  PRI_APELLIDO: "PRUEBAUNO"
  SEG_APELLIDO: "APELLIDOUNO"
  PRI_NOMBRE: "NOMBREUNO"
  SEG_NOMBRE: "SEGUNDOUNO"
  TIP_DOCUMENTO: "3"
  NUM_DOCUMENTO: "1000000101"
  ID_GRUPO: "A"
  ID_NIVEL: "1"
