  FECHA_ACTUALIZACION_PERSONA: "20/12/2025"
  ID_MARCA: "0"
  ID_ESTADO: "0"
  FECHA_ACTUALIZACION_CNS: "10/01/2026"

eventos:
  - id: cur-0001
    caso: "Base válida. HU §5.3 «Homologación» (3 -> standardizedIdType 1, tipoDocumentoSisben 3), «Fechas a epoch» (10/01/2026 -> 1768021200000), «Fecha de corte y tipo de archivo» (fechaCorte 1769835600000, tipoArchivo REGULAR); subscriberRelation 1_1000000101 (spec §10.1); idFichaOrigen conserva el cero inicial"
    archivo: SISBEN_EXPERIAN_202601.20260205093000-0500.txt
    registro: {}
    errores: []

  - id: cur-0002
    caso: "HU §5.3 «Estandarización de nombres»: García-López -> GARCIA LOPEZ, josé -> JOSE (spec §10.2)"
    archivo: SISBEN_EXPERIAN_202601.20260205093000-0500.txt
    registro: {PRI_APELLIDO: "García-López", PRI_NOMBRE: "josé", NUM_DOCUMENTO: "1000000102"}
    errores: []

  - id: cur-0003
    caso: "HU §5.3 «Nombre completo estandarizado»: ANA, seg_nombre vacío, PEÑA, RUIZ -> standardizedIdName ANA PEÑA RUIZ (conserva Ñ)"
    archivo: SISBEN_EXPERIAN_202601.20260205093000-0500.txt
    registro: {PRI_NOMBRE: "ANA", SEG_NOMBRE: "", PRI_APELLIDO: "PEÑA", SEG_APELLIDO: "RUIZ", NUM_DOCUMENTO: "1000000103"}
    errores: []

  - id: cur-0004
    caso: "HU §5.3 «Número de documento estandarizado»: ' 0001000000101' -> standardizedIdNumber 1000000101. La HU espera numeroDocumentoOriginal ' 0001000000101' (con el espacio); la transformación `original` del framework recorta espacios (ver cabecera del source-spec)"
    archivo: SISBEN_EXPERIAN_202601.20260205093000-0500.txt
    registro: {NUM_DOCUMENTO: " 0001000000101"}
    errores: []

  - id: cur-0005
    caso: "HU §5.3 «Nombre que queda vacío al estandarizar»: pri_apellido '!!!' -> primerApellido nulo y primerApellido:NO_NORMALIZABLE; el registro sigue (spec §10.2 regla 5)"
    archivo: SISBEN_EXPERIAN_202601.20260205093000-0500.txt
    registro: {PRI_APELLIDO: "!!!", NUM_DOCUMENTO: "1000000105"}
    errores: []

  - id: cur-0006
