# Insumo de la etapa Acceptance (`edf-acceptance`) · ingesta `sisben` · producido por `edf-analisis` (Modo 2, tipo T2).
# Versión 2 · 2026-11-25 · Estado: PROPUESTO (pendiente de aprobación registrada por `edf-orquestador`).
# Versión 1 auditada con AJUSTES (auditorias/acceptance.md); esta versión aplica AUD-A-01 a AUD-A-07 y el cierre de PA-006
# (INT-024). Validation aprobada con evidencia diferida (APR-008, RG-015).
# Esquema: .kiro/skills/edf-acceptance/assets/schema/source-spec.schema.yaml (framework 1.9.5: `expresiones_propuestas`,
# `severidades` mínimo, `fixture.umbrales_alternativos`). El ejemplo SISBEN de la skill es solo forma: ningún valor de
# negocio se copió de él (edf-analisis SKILL.md Modo 2 paso 1; edf-acceptance SKILL.md Paso 1).
#
# Fuentes: fuentes/hu-sisben.md 1.0.2 (R-02, R-19 a R-22, §5.2, §6 fila Acceptance) y fuentes/spec-sisben.md 1.0.2 (§1, §2,
# §5, §6, §7 RQ-01 a RQ-05, §8, §10.3, Anexo A `handoff_acceptance`). La spec NO trae un anexo con el contenido de este
# insumo: no hay líneas «que se aparten del anexo». El contrato de entrada (IN-05) sale de insumos/source-spec-validation.yaml
# v2 y de la propuesta de Validation aprobada (propuestas/validation/).
#
# Marcadores (steering 05): [C] confirmado por la fuente o por el código del motor · [P] decisión del Desarrollador
# registrada · [PM] propuesta del modelo / convención del framework.
#   [C]  umbral 0.90 y FQS = average("qs.RQS") (HU R-21, R-22; spec RQ-02, RQ-03); regla de registro (spec RQ-04, Anexo A
#        handoff_acceptance; HU §6); marcadores rechazan el archivo (spec RQ-05); errorInEmptyFileBody lo emite el motor de
#        Validation con el cuerpo vacío (SparkValidator.scala:615-627); sin intervención manual (HU R-22); sin
#        contextualOverride (PA-001 resuelta; HU §2, spec §10.3); identidad (spec §1); filePattern (spec §2).
#   [P]  PA-006 RESUELTA por el Desarrollador (INT-024):
#        (a) condición RQS_BAJO_UMBRAL_SISBEN y reasonCode SISBFA00001 como convención; comprobación [PM] en el fork de que
#            no existen ya en el fileConditions[] global (RG-017);
#        (b) aceptar_cuerpo_vacio: false: se rechaza el archivo sin registros (solo header, o todas las filas filtradas),
#            deducido de HU R-22, spec RQ-03 y §10.3 (la carga completa no se reemplaza por un archivo vacío);
#        (c) customReasonForAutomaticRejectionEnabled: false, default del motor (SparkAcceptor.scala:166).
#   [PM] rutas_destino (convención de la skill: SKILL.md:95, archivo inner aditivo).
# Supuestos de la skill (S-ACC-01, -03, -04, -05): bloque `supuestos`, de edf-acceptance/references/decisiones-y-abiertos.md.
# Relación con Validation (expediente): PA-003 (sin marca de tiempo: no llega a validated/), PA-004 y RG-013 (en duplicados
# puede ganar un registro con sev. 1: el fixture 900005 lo documenta con la regla real), PA-005 (contador de menores).
# Ninguna cambia este insumo.
# Escenario «Umbral parametrizable» de HU §5.2: fixture.umbrales_alternativos (umbral 0.95, solo prueba; la configuración
# desplegable sigue con 0.90).
# DATOS SINTÉTICOS: todo nombre, documento, fecha e id del bloque `fixture` es inventado (eventId con prefijo SINT-).

schema_version: "0.1.0"
version_skill: "0.1.0"
etapa: acceptance
Fuente: SISBEN
fuente: sisben

identidad:                       # [C] spec §1
  data_source: DNP
  subscriber: "999722"
  event_type: 30
  zona_horaria: America/Bogota

rutas_destino:                   # [PM] convención de la skill (fork de Colombia de oxygen-acceptance; SKILL.md:95)
  hocon: env/application-conf/innersource/acceptance-common-application-inner.conf
  raiz_tests: src/test/scala/com/experian/edf/oxygen/acceptance/source/sisben/
  recursos_tests: src/test/resources/sisben/
  paquete_tests: com.experian.edf.oxygen.acceptance.source.sisben

# IN-01 · [C] spec §2 (filePattern HOCON, compara la ruta completa). Sin prefijos RT_/EP_ (spec §2, HU §2).
archivo:
  convencion: "SISBEN_EXPERIAN_AAAAMM.yyyyMMddHHmmss±ZZZZ.txt (extensión txt o TXT)"
  filePattern: '.*SISBEN_EXPERIAN_\d{6}\.\d{14}[+-]\d{4}\.(txt|TXT)'
  estado: cerrado
  claves_de_prueba:
    - {clave: ruta_validada_sin_extension, valor: "/home/app/validation/validated/SISBEN_EXPERIAN_202601.20260205093000-0500.txt.900001", debe_coincidir: true}
    - {clave: ruta_marcador_sin_extension, valor: "/home/app/validation/validated/SISBEN_EXPERIAN_202601.20260205093000-0500.txt.errorInHeader.900007", debe_coincidir: true}
    - {clave: lineage_fileName, valor: "SISBEN_EXPERIAN_202601.20260205093000-0500.txt", debe_coincidir: true}
    - {clave: lineage_fileName_mayusculas, valor: "SISBEN_EXPERIAN_202601.20260205093000-0500.TXT", debe_coincidir: true}
    - {clave: otra_fuente, valor: "/home/app/validation/validated/RUNT_EXPERIAN_202601.20260205093000-0500.txt.900010", debe_coincidir: false}
    - {clave: ruta_marcador_prefijo_rt, valor: "/home/app/validation/validated/RT_SISBEN_EXPERIAN_202601.20260205093000-0500.txt.errorInFileName.900010", debe_coincidir: true}   # HU R-02: el marcador debe encontrar config para rechazarse
    - {clave: sin_marca_de_tiempo, valor: "SISBEN_EXPERIAN_202601.txt", debe_coincidir: false}   # PA-003

# IN-02 · [C] HU R-21, R-22; spec RQ-02, RQ-03. Umbral parametrizable (spec RQ-03); cambiarlo es N3 (edf-acceptance SKILL.md:49).
calidad:
  quality_score: RQS
  agregacion: average
  umbral: "0.90"
  estado: cerrado

# IN-03 · [P] PA-006 (a), INT-024: nombre y reasonCode por convención; [PM] comprobar en el fork que no existen ya en el
# fileConditions[] global (RG-017). Expresión [C] (spec RQ-03).
condiciones:
  - nombre: RQS_BAJO_UMBRAL_SISBEN
    expresion: 'average("qs.RQS") < 0.90'
    reasonCode: SISBFA00001
    isLogged: true
    estado: cerrado

# ACC-TPL-01 · [C] spec RQ-03: se acepta con FQS >= 0.90; si no, se rechaza completo.
fileActions:
  reject: anyOf(RQS_BAJO_UMBRAL_SISBEN)
  accept: 'average("qs.RQS") >= 0.90'

# IN-04 · [C] spec RQ-04; Anexo A handoff_acceptance.record_acceptance; HU §6 fila Acceptance.
registro:
  niveles_que_rechazan: ["1"]
  codigos_que_rechazan: [OxygenDuplicate]
  recordAcceptance: 'errorlevelNotIn("1") and errorcodeNotIn("OxygenDuplicate")'
  estado: cerrado

# IN-06 · [C] spec RQ-05 (un marcador rechaza el archivo, rechazo automático E4, que no depende del FQS).
# [P] PA-006 (b) y (c), INT-024: archivo sin registros se rechaza (HU R-22, spec RQ-03, §10.3); customReason = false, default
# del motor (SparkAcceptor.scala:166): con false el motor no evalúa reject sobre los eventos marcador.
rechazo_automatico:
  customReasonForAutomaticRejectionEnabled: false
  aceptar_cuerpo_vacio: false
  estado: cerrado

# IN-07 · [C] HU R-22 y spec RQ-03: decisión binaria (aceptado o rechazado completo); sin revisión manual.
intervencion_manual:
  habilitada: false
  manualReject: null
  manualAccept: null
  estado: cerrado

# IN-05 · Contrato de entrada desde Validation: insumos/source-spec-validation.yaml v2 (spec §3, §4, §6, §7, §8).
diagnostico_validation:
  quality_scores: [RQS]                       # spec RQ-01
  niveles: ["1", "3", ""]                     # spec §8; "" = nivel de OxygenDuplicate (spec §6)
  codigos_sev1: [SISBEN_ERR_003, SISBEN_ERR_004, SISBEN_ERR_005, SISBEN_ERR_006, SISBEN_ERR_007, SISBEN_ERR_010,
                 SISBEN_ERR_012, SISBEN_ERR_014, SISBEN_ERR_015, SISBEN_ERR_016, SISBEN_ERR_017, SISBEN_ERR_021,
                 SISBEN_ERR_022, SISBEN_ERR_023, SISBEN_ERR_024, SISBEN_ERR_025, SISBEN_ERR_026, SISBEN_ERR_027,
                 SISBEN_ERR_028, SISBEN_ERR_029]
  codigos_sev3: [SISBEN_INC_001, SISBEN_INC_002, SISBEN_INC_008, SISBEN_INC_009, SISBEN_INC_011, SISBEN_INC_013,
                 SISBEN_INC_018, SISBEN_INC_019, SISBEN_INC_020]
  codigos_motor: [OxygenDuplicate]            # spec §6, §8
  marcadores_de_archivo: [errorInFileName, errorInHeader, errorInEmptyFileBody]   # spec RQ-05; sin footer (spec §2); errorInEmptyFileBody [C] SparkValidator.scala:626
  estado: cerrado

# ACC-TPL-03 · Deshabilitada: reject no usa hasErrorlevelIn (supuesto S-ACC-01). Framework 1.9.5: sin relleno.
severidades:
  habilitado: false
  estado: cerrado

# IN-08 · [C] no se configura: PA-001 resuelta (inferDelete descartado sin versión nueva de HU/spec); HU §2 y spec §10.3
# (sin archivos RT ni EP). R-26 se cumple en State Calculation (PA-002).
contextual_override:
  decision_humana: false
  decision_ref: null
  inferDelete: {enabled: null, lookBackPeriod: null, deletePredicates: null}
  explicitDelete: {enabled: null, lookBackPeriod: null, deletePredicates: null}
  estado: cerrado

expresiones_propuestas:
  - regla: Registro aceptado = sin severidad 1 y sin marca de duplicado
    expresion: 'recordAcceptance = "errorlevelNotIn(\"1\") and errorcodeNotIn(\"OxygenDuplicate\")"'
    evidencia: "[C] spec §7 RQ-04; Anexo A handoff_acceptance; HU §6"
  - regla: Archivo aceptado si FQS >= 0.90
    expresion: 'accept = "average(\"qs.RQS\") >= 0.90"'
    evidencia: "[C] spec §7 RQ-02, RQ-03; HU R-21, R-22"
  - regla: Rechazo del archivo con código de razón
    expresion: 'reject = "anyOf(RQS_BAJO_UMBRAL_SISBEN)"'
    detalle: Condición RQS_BAJO_UMBRAL_SISBEN con average("qs.RQS") < 0.90 en oxygen.stage.acceptance.fileConditions[]
    evidencia: "[C] expresión (spec RQ-03); [P] nombre y reasonCode (PA-006 a, INT-024)"
  - regla: Marcadores de archivo rechazan el archivo
    detalle: >-
      errorInFileName (SISBEN_ERR_024), errorInHeader (SISBEN_ERR_025) y errorInEmptyFileBody se rechazan por rechazo
      automático (E4), sin depender del FQS; con customReasonForAutomaticRejectionEnabled = false no se evalúa reject ni
      se registra reasonCode
    evidencia: "[C] spec §7 RQ-05; §2 RA-01 a RA-05; [P] PA-006 (b, c)"

# Supuestos propios de la skill (edf-acceptance/references/decisiones-y-abiertos.md), con su impacto. S-ACC-02 no aplica:
# severidades ya no lleva valores (1.9.5).
supuestos:
  - id: S-ACC-01
    supuesto: >-
      severidades.habilitado = false: reject no usa hasErrorlevelIn, así que la severidad de SISBFA00001 no
      es necesaria
    impacto: >-
      No se generan ACC-TPL-03 (CSV y lookup.conf) ni lookupMapping. Si reject llega a usar
      hasErrorlevelIn/NotIn, hay que habilitar la tabla (verifySpec lo exige, ACC-TPL-03) y cerrar ACC-PT03
    donde: spec (severidades.habilitado)
  - id: S-ACC-03
    supuesto: average de un QS ausente en todos los eventos es null => condición false => archivo pendiente
    impacto: >-
      Un archivo sin RQS (contrato con Validation roto) no se rechaza ni se acepta: queda pendiente y no sale
      de validated/. El fixture 900009 y el simulador esperan "pendiente"; falta confirmarlo contra Spark (N4)
    donde: simulador, fixture 900009
  - id: S-ACC-04
    supuesto: JsonUtils en com.experian.edf.oxygen.utils para el Spec
    impacto: >-
      Si el paquete es otro, el Spec Scala (ACC-TPL-05) no compila. No afecta el HOCON ni la decisión del
      motor; la compilación ya no está certificada (F-01)
    donde: ACC-TPL-05 (ASSUMPTION S-ACC-04)
  - id: S-ACC-05
    supuesto: >-
      Fixture JSON Lines con campos de TaggedValidatedEvent; payload/minFrequency omitidos (deserialización
      tolerante)
    impacto: >-
      Si JsonUtils.fromJson no tolera la falta de payload/minFrequency, el Spec no puede leer los directorios
      del fixture y sus casos de registro y de archivo fallan al cargar los eventos. No afecta el HOCON ni la
      decisión en producción
    donde: ACC-TPL-06

