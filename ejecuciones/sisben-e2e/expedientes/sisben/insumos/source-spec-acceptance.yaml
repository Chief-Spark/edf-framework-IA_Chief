# Insumo de la etapa Acceptance (`edf-acceptance`) · ingesta `sisben` · producido por `edf-analisis` (Modo 2, tipo T2).
# Versión 1 · 2026-11-24 · Estado: PROPUESTO (pendiente de aprobación registrada por `edf-orquestador`).
# BORRADOR: la etapa `validation` no está aprobada (su propuesta está en re-auditoría); `edf-acceptance` no genera hasta que
# Validation esté aprobada con transición habilitada y este insumo figure como aprobado (edf-acceptance SKILL.md, Paso 0).
# Esquema: .kiro/skills/edf-acceptance/assets/schema/source-spec.schema.yaml. El ejemplo SISBEN de la skill es solo forma:
# ningún valor se copió de él (edf-analisis SKILL.md Modo 2 paso 1; edf-acceptance SKILL.md Paso 1).
#
# Fuentes: fuentes/hu-sisben.md 1.0.2 (R-20 a R-22, §5.2, §6 fila Acceptance) y fuentes/spec-sisben.md 1.0.2 (§1, §2, §6, §7
# RQ-01 a RQ-05, §8, Anexo A `handoff_acceptance`). La spec NO trae un anexo con el contenido de este insumo: no hay líneas
# «que se aparten del anexo»; los valores [C] salen de las secciones citadas, y el contrato de entrada (IN-05) de
# insumos/source-spec-validation.yaml v2.
#
# Marcadores (steering 05): [C] confirmado por la fuente · [PM] propuesta del modelo / convención del framework, sin fuente
# de la ingesta · [A:PA-006] depende de la pregunta abierta propuesta PA-006 (no se convierte en instrucción de generación).
#   [C]  umbral 0.90 y FQS = average("qs.RQS") (HU R-21, R-22; spec RQ-02, RQ-03); regla de registro (spec RQ-04, Anexo A
#        handoff_acceptance; HU §6); marcadores rechazan el archivo (spec RQ-05); sin intervención manual (HU R-22: aceptado o
#        rechazado completo); sin contextualOverride (PA-001 resuelta: inferDelete descartado sin versión nueva de HU/spec;
#        HU §2, spec §10.3); identidad (spec §1); filePattern (spec §2).
#   [A:PA-006] (a) nombre de la condición RQS_BAJO_UMBRAL_SISBEN y reasonCode SISBFA00001 (valores que propone la skill,
#        edf-acceptance/references/inventario-plantillas.md:18; ni la HU ni la spec los declaran); (b) aceptar_cuerpo_vacio:
#        false (las fuentes no dicen qué pasa con un archivo sin registros); (c) customReasonForAutomaticRejectionEnabled: true.
#   [PM] rutas_destino (convención de la skill: SKILL.md:95, archivo inner aditivo); marcador errorInEmptyFileBody en IN-05
#        (lo emite el motor: edf-validation/scripts/prevalidar_archivo.py:352); campos de `severidades` (rama deshabilitada,
#        supuesto S-ACC-02 de la skill).
# Supuestos de la skill (S-ACC-01..05): bloque `supuestos`, copiados de edf-acceptance/references/decisiones-y-abiertos.md:58-62.
# Relación con Validation (expediente): PA-003 (sin marca de tiempo: no llega a validated/, no lo ve Acceptance), PA-004 y
# RG-013 (en duplicados puede ganar un registro con sev. 1: el fixture 900005 documenta que ninguno de los dos se acepta),
# PA-005 (contador de menores; Acceptance no lo cambia). Ninguna cambia este insumo.
# No representable en el fixture: el escenario «Umbral parametrizable» de HU §5.2 (umbral 0.95) exige otro valor de
# calidad.umbral; el generador exige una sola escala por spec. Queda para AcceptanceExpressionsSpec (HU §6) [PM].
# DATOS SINTÉTICOS: todo nombre, documento, fecha e id del bloque `fixture` es inventado (eventId con prefijo SINT-).

