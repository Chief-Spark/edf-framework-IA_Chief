# yaml-skill-statecalc.yaml — insumo de edf-statecalc para la ingesta sisben (ART-070), producido por edf-analisis
# (Modo 2, tipo T3/T4). Estructura: .kiro/skills/edf-analisis/assets/templates/_cabecera-yaml-skill.yaml.tpl +
# yaml-skill-statecalc.yaml.tpl (framework 1.9.11, plantilla con modo_colombia). El ejemplo assets/examples/sisben/yaml-skill-statecalc.yaml
# es solo forma: ningún valor se copió de él (sus 25 campos del Levantamiento, su personIdType/personIdNumber CALCULATED, su
# grain [personIdType, personIdNumber] y su nombre de sección no salen de la HU ni de la spec vigentes; LEEME.md).
# Sin estado ni aprobador (HF-32). Versión 3 · 2026-11-25. State Calculation es riesgo N4: aprueba el PO o el Aprobador
# designado (steering 06 §2.2; spec §13).
#
# Fuentes de la ingesta (únicas): fuentes/hu-sisben.md 1.0.2 (§1, §2, §3, R-02, R-06, R-07, R-25, R-26, R-28, §5.5, §5.6, §6
# fila State Calculation) y fuentes/spec-sisben.md 1.0.2 (§1, §2, §6, §10.1, §10.3, §10.4, §12, §13, §14). La spec no trae
# un anexo con el contenido de este insumo. Claves publicadas: insumos/source-spec-curation.yaml v2 (ART-030). Claves que
# llegan a State Calculation: las del GDD de Synthesis (insumos/yaml-skill-synthesis.yaml v3, ART-060; ART-061: 34 entradas
# LFP, incluida fechaCorte). Evidencia del motor: copia de solo lectura Motor-Oxigen/oxygen-statecalculation/ y
# Motor-Oxigen/oxygen-synthesis/ (no hay fork de Colombia: oxygen-core / oxygen-global / bureau.colombia_innersource no
# están en el workspace).
#
# Marcadores (steering 05 §3): [C] confirmado (fuente de la ingesta, decisión registrada o lectura directa del motor, con
# cita) · [P] propuesto / inferencia del analista con evidencia · [A:<ID>] abierto · [PM] pendiente-manual (se verifica en el
# fork o en el pipeline) · [S] superado.
#
# Cambios de la versión 3 (re-auditoría auditorias/statecalc.md §7, AJUSTES menores; framework 1.9.11, commit 8db046a):
#   - AUD-SC-14: bloque modo_colombia de la plantilla 1.9.11 (aplica true [P]; filtro por fuente; nombre sin «#»; nombres
#     existentes y modo delta como verificación del fork, PA-013 (6) y (5)). Cabecera con framework 1.9.11.
#   - AUD-SC-17: los 4 campos de ART-071 son candidatos sujetos a PA-013 (6): mismo nombre y dataType → se reutiliza;
#     otro dataType o significado → bloqueo N4 que se escala (references/modo-colombia.md §2.1).
#   - AUD-SC-16: «attachHistorcData» se cita como lo que es: la grafía real de la clave de conf (statecalc-application-
#     local.conf:67; oxygen-config-default.conf:666), que activa el feature STATECALC_ATTACH_HISTORIC_DATA
#     (StateCalcAddOns.scala:40-48).
#   - AUD-SC-18: SC-9 pasa a [C] (exigido por RG-031 antes de certificar).
#   - AUD-SC-19: RG-032 (evidencia diferida de synthesis) en precondiciones y riesgos; habilitacion-synthesis actualizada.
#
# Cambios de la versión 2 respecto de la 1 (auditorias/statecalc.md: AJUSTES; decisiones del PO simulado SIM-PO-01 en INT-075,
# APR-030 rechazo de ART-070, BIT-0177..0184):
#   - PA-002: dirección (c1-a) decidida por el PO (sin cerrar la pregunta): filtro por fuente en el where con los campos base
#     (dataSource DNP, subscriber 999722) y corte vigente marcado por el enricher; supuesto «vigente = mayor periodo
#     aceptado» con control operativo de re-entrega (BKL-003); CQ-006 como entrega manual de Ingesta 3 (BKL-001); seis
#     condiciones de cierre (propuesta_pa_002.condiciones_de_cierre). AUD-SC-01, -02, -05, -07.
#   - PA-012 resuelta por el PO: sección «sisben», un objeto por PIN sin groupBy, MOST_RECENT_VALUE sobre los registros del
#     corte vigente (RG-031), null o ausente = sin sección, también para un atributo. AUD-SC-03, -04.
#   - PA-013 ampliada (puntos 5-7, AUD-SC-02, -06) y PA-014 abierta (negocio); las dos bloqueantes.
#   - RG-007 aceptado por el PO (SC-8 e ítem de aprobación); RG-011 abierto con la llave [P] de spec §6 (BKL-002); RG-003
#     abierto; RG-028 citado como bloqueo de certificación (AUD-SC-08, -10).
#   - Escenarios SC-7 (asOfDate decreciente y re-entrega) y SC-8 (RG-007) (AUD-SC-01, -08, -09).
#   - ART-071: los 4 campos de nivel A, generables solo si el PO aprueba el insumo limitado a ART-071 (AUD-SC-11); en esta
#     corrida no (APR-030). ART-072 y ART-073 con generar false y su razón.
#   - La sección completa propuesta sale de instruccion_generacion_calculation y pasa a propuesta_pa_002 (AUD-SC-13).
#   - Citas precisadas (AUD-SC-12): alias por getSCContext (SparkStateCalculator.scala:166-171, :168; compute :66-67 no lo
#     usa run, :215 comentado); notas de :192 y :205-206 corregidas (DERIVED antes que todo CALCULATED; el periodo sale de
#     getPeriod/minFrequency, no de dateType, HF-69/RG-028) (AUD-SC-09). Identificadores PA-012/PA-013/PA-014, RG-029/030/031.

documento:
  tipo: "intermediario-skill"
  etapa_pipeline: "State Calculation"
  ingesta: "sisben"
  version: "3.0.0"
  fecha: "2026-11-25"
  # Sin estado ni aprobador (HF-32): viven solo en estado-ingesta.json, que registra edf-orquestador con el hash de este archivo.

procedencia:
  fuente_analisis:
    ruta: ".kiro/skills/edf-analisis/references/logica-statecalc.md"
    version_fuente: "1.0.0 (§4.1, §5.1-§5.6, §6, §7, §9.1, §9.2), contrastada con el motor donde la reference no alcanza (alias, filtro isVisible, numberOfPeriods, null o [] de una sección vacía, recentBy de MOST_RECENT_VALUE, merge de Foundation, modo delta)"
  fuentes_ingesta:
    hu: "ejecuciones/sisben-e2e/expedientes/sisben/fuentes/hu-sisben.md 1.0.2 (§1, §2, §3, R-02, R-06, R-07, R-25, R-26, R-28, §5.5, §5.6, §6)"
    spec: "ejecuciones/sisben-e2e/expedientes/sisben/fuentes/spec-sisben.md 1.0.2 (§1, §2, §6, §10.1, §10.3, §10.4, §12, §13, §14)"
    mapeo_campos: "ejecuciones/sisben-e2e/expedientes/sisben/analisis/mapeo-campos.md (ART-002; filas 3, 5, 16, 17, 18, 22 y fechaCorte; no mapea al XPM, 04 §4.4)"
    source_spec_curation: "ejecuciones/sisben-e2e/expedientes/sisben/insumos/source-spec-curation.yaml (v2, ART-030; campos_curados[].destino)"
