# Criterios de aceptación (HU §5.6, §6) y ART-073
# ═════════════════════════════════════════════════════════════

criterios_aceptacion:
  nota: "State Calculation no admite evidencia diferida: estos escenarios se prueban en el pipeline (DAG state-generation) con datos sintéticos y se registran en Zephyr (HU §6). La aprobación es del PO (N4)"
  escenarios:
    - id: "SC-1 Sección generada"
      dado: "un PIN con un evento SISBEN del corte vigente"
      entonces: "el XPM tiene la sección con grupoSisben, nivelSisben, fechaEncuesta, fechaModificacion, codDepartamentoSisben y codMunicipioSisben con los valores curados de ese corte (codDepartamentoSisben y codMunicipioSisben conservan el cero inicial; fechas en epoch ms)"
      fuente: "HU §5.6; spec §13"
    - id: "SC-2 Persona que ya no aparece"
      dado: "un PIN con eventos SISBEN de 202512 y ninguno de 202601, corriendo con 202601 como corte vigente"
      entonces: "el XPM de 202601 no tiene sección #sisben para ese PIN ([A:PA-012] (c): null o ausente)"
      fuente: "HU R-26, §5.6"
    - id: "SC-3 Fecha de encuesta ausente"
      dado: "un evento del corte vigente sin Fec_digitacion"
      entonces: "fechaEncuesta nula y la sección se genera igual"
      fuente: "HU §5.6"
    - id: "SC-4 / ART-073 CA1 Consulta en Data Provisioning"
      dado: "la salida de State Calculation cargada al XPM (statecalc/calculated, spec §14; XpmEventDAO)"
      entonces: "la sección #sisben está disponible en la consulta online y batch de Data Provisioning"
      fuente: "HU §5.6, §1"
    - id: "SC-5 Sin sección para otras fuentes (derivado de R-26 y del motor)"
      dado: "un PIN de Colombia sin eventos SISBEN"
      entonces: "no tiene sección #sisben con datos (comprueba el filtro por fuente)"
      fuente: "HU R-26; motivo_no_generar"
      estado: "[P]"
    - id: "SC-6 Igualdad de asOfDate entre cortes (límite de c1)"
      dado: "un PIN presente en 202512 y 202601 con la misma fec_actualizacion_cns"
      entonces: "la sección sale con fechaCorte de 202601 (gana el receivedDate mayor, ConsistencyCheckOps.scala:115-118)"
      fuente: "HU §5.5; propuesta_pa_002.opcion_c1_filtro_en_el_enricher.limites"
      estado: "[P]"

certificacion_4_dimensiones:
  regla: "Steering 07 §5.7: completitud de mandatorios ≥90%, validez de tipo 100%, unicidad 0% de duplicados por la llave de identidad de la spec (standardizedIdType + standardizedIdNumber, spec §11), consistencia ≥90%, antes de producción"
  estado: "[A:sin-clasificar] — no figura en la DoD (HU §6) y no hay motor que la calcule (logica-statecalc.md §2). No se genera ninguna clave. RG-011: el PO decide antes de producción"

# ═════════════════════════════════════════════════════════════
# Preguntas y riesgos que se proponen (los registra edf-orquestador)
# ═════════════════════════════════════════════════════════════

preguntas_propuestas:
  - id_propuesto: "PA-012"
    pregunta: "¿Qué forma tiene la sección #sisben en el XPM? (a) ¿la clave de la sección es literalmente «sisben» o «#sisben»? (b) Si un PIN tiene más de un documento SISBEN en el corte vigente, ¿un solo objeto (el más reciente, sin groupBy) o una lista por subscriberRelation (groupBy [subscriberRelation])? (c) ¿«no tiene sección» (HU §5.6) se cumple con la sección en null, que es lo que produce el motor?"
    patron: "6 · Dimensión ausente (la spec §13 da los atributos, no el nombre de la clave ni la cardinalidad)"
    etapa_afectada: "state_calculation"
    bloqueante: true
    motivo: "Cambia la forma del XPM visible al cliente (N4) y el contenido de ART-072; en la duda, bloqueante (deteccion-ambiguedades.md §4)"
    fuentes: "HU R-26, §5.6; spec §13; QueryFunctions.scala:61; CalculationStateCalculator.scala:123-163"
    dirigida_a: "PO (N4)"
  - id_propuesto: "PA-013"
    pregunta: "En el fork de Colombia: (1) ¿oxygen.stage.stateCalculation.aliasEnabled es true? (2) ¿qué App y qué enricher corren State Calculation de Colombia, ya marcan las fuentes con un flag (isSisben u otro) y cómo reciben un valor por corrida como el corte vigente? (3) ¿qué domain y qué nombres declaran los JSON de Foundation y Calculation de Colombia (fechaCorte, fechaDigitacion, fechaActualizacionCns, nivelSisben…, con su dataType) y usan where/CALCULATED con Nashorn (versión de Java)? (4) ¿una sección null se guarda y se ve en Data Provisioning como sección ausente?"
    patron: "1 · Dato no confirmado (hechos fuera del workspace)"
    etapa_afectada: "state_calculation"
    bloqueante: true
    motivo: "ART-071 (alias) y ART-072 (where, flag, forma) dependen de estos hechos: no admiten verificación diferida (edf-orquestador references/03 §3e #1)"
    fuentes: "SparkStateCalculator.scala:66-67; FoundationStateCalculator.scala:103-105; StateCalcApp.scala:15; steering 07 §5.7; migrate.md:12-16"
    dirigida_a: "Desarrollador con Ingesta 3 (fork); cierre N4 con el PO por ser State Calculation"

riesgos_nuevos:
  - id_propuesto: "R-SC-1"
    descripcion: "Con (c1), un PIN presente en el corte vigente se excluye por error si su evento vigente queda en el mismo periodo de Synthesis que uno anterior con asOfDate mayor: LFP deja el fechaCorte anterior (ConsistencyCheckOps.scala:115-118)"
    nivel: "medio"
    etapa_afectada: "state_calculation"
    mitigacion: "Verificar el dateType de Synthesis (VD-SYN de RG-026) y probar SC-6; si el periodo es por corte, el caso no ocurre"
  - id_propuesto: "R-SC-2"
    descripcion: "Residual de PA-011 en #sisben: dentro de un mismo periodo, si el corte vigente trae Fec_digitacion vacía y un corte anterior del mismo periodo la traía, LFP conserva el valor anterior y fechaEncuesta no sale nula, contra HU §5.6 «Fecha de encuesta ausente»"
    nivel: "medio"
    etapa_afectada: "state_calculation"
    mitigacion: "Se señala al PO al decidir PA-011; probar SC-3 con un PIN que tenga dos cortes en el mismo periodo"

