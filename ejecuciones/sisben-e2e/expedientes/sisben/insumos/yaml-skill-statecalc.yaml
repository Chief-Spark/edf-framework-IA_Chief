    yaml_skill_synthesis: "ejecuciones/sisben-e2e/expedientes/sisben/insumos/yaml-skill-synthesis.yaml (v3, ART-060; el evento sintetizado solo lleva los campos del GDD, EventSynthesizer.scala:110-116)"
    decisiones: "ejecuciones/sisben-e2e/registro-interacciones.md INT-075 (PO simulado SIM-PO-01); estado-ingesta.json APR-030, PA-002, PA-012..014, RG-003, RG-007, RG-011, RG-028..031, BKL-001..003"
