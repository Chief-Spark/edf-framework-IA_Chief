alcance:
  genera:
    - "ART-071 · propuestas/statecalc/statecalc-foundation-local.json: fields[] con los 4 campos de nivel A (instruccion_generacion_foundation.campos_a_generar), DERIVED, sin `value`, sin alias, sin campos base y sin Nashorn [C]. Solo se genera si el PO aprueba este insumo LIMITADO a ART-071 y lo deja escrito en RG-003; en esta corrida no (APR-030: ART-070 rechazado, solo prevalidado). Aunque se generara, no se integra al fork sin PA-013 (6) (nombres ya declarados en la Foundation compartida; ContextUtils.scala:15-19) (AUD-SC-11)"
  no_genera:
    - "ART-072 · CalculationSection «sisben»: generar false. Depende de PA-002 (condiciones de cierre), PA-013, PA-014, [A:OQ-TR-2] (where Nashorn) y de BKL-001 (enricher). Sin el filtro, MOST_RECENT_VALUE toma el registro Foundation más reciente del PIN de CUALQUIER fuente de Colombia (MostRecentValue.scala:20-24; FoundationStateCalculator.scala:37-51) y la sección sale con nulos o con datos de otra fuente, y para PIN que ya no están en el corte: dato erróneo visible al cliente (N4)"
    - "ART-073 · CA1 (Data Provisioning consulta «sisben»): generar false. Es una prueba de pipeline sobre el XPM; N4 no admite evidencia diferida (edf-orquestador references/03 §3b) y no hay ART-072 que probar. Criterios en criterios_aceptacion"
    - "Código Scala de ningún tipo: el enricher del corte vigente y la lectura previa del sintetizado en la App o el motor de Colombia son una entrega manual de Ingesta 3 en el fork (CQ-006 decidido por el PO, BKL-001); tampoco un CustomOnSectionProcessor ni un CalculationType pluggable (edf-statecalc SKILL.md «Qué este skill nunca hace»)"
    - "Campos CALCULATED: dependen de Nashorn [A:OQ-TR-2] (steering 07 §5.7: «No generar configuración que dependa de Nashorn sin resolverlo»). Una configuración solo DERIVED no compila JavaScript (FoundationStateCalculator.scala:30; CalculationStateCalculator.scala:50-52)"
    - "Scoring (risk, trust, completeness): fuera de alcance (HU §2; spec §13 «Sin scoring») [C]"
    - "NAMES, BEST NAME, IDENTIFICATIONS y BEST IDENTIFICATIONS: SISBEN las alimenta «con la configuración estándar de Colombia, sin cambios» (spec §13) [C]; no se genera nada para ellas"
    - "Clave de quality threshold o motor de calidad de 4 dimensiones: no existe en el motor (logica-statecalc.md §2); ver certificacion_4_dimensiones (RG-011, BKL-002)"
  precondiciones_bloqueantes:
    - id: "PA-002"
      descripcion: "Mecanismo del corte vigente (R-26, HU §5.6 «Persona que ya no aparece»). Abierta y bloqueante; el PO fijó la dirección (c1-a) en INT-075 sin cerrarla"
      efecto: "Bloquea ART-072, la inclusión de fechaCorte en ART-071 y la aprobación de este insumo (RG-003). Se cierra con las seis condiciones de propuesta_pa_002.condiciones_de_cierre"
    - id: "PA-013"
      descripcion: "Hechos del fork de los que dependen ART-071 (alias, nombres compartidos) y ART-072 (App, enricher, Nashorn, modo delta, features que tocan el XPM, XPM compartido, writer de nulos). Abierta y bloqueante"
      efecto: "No admite verificación diferida porque los artefactos dependen de ellos (edf-orquestador references/03 §3e #1); la evidencia diferida §3b no aplica a N4"
    - id: "PA-014"
      descripcion: "Preguntas de negocio para la próxima versión de HU y spec: re-entrega del mismo periodo y definición de «vigente», «#sisben» literal en Data Provisioning, dos documentos vigentes en un PIN, fechaEncuesta futura. Abierta y bloqueante para la certificación"
      efecto: "Mientras siga abierta rigen los supuestos del PO (vigente = mayor periodo aceptado; «sisben»; un objeto; RG-007 aceptado) con el control operativo de BKL-003"
    - id: "OQ-TR-2"
      descripcion: "Uso de Nashorn (steering 07 §5.7, 06 §6 fila 3). El where de la sección es Nashorn (QueryFunctions.scala:75-82). migrate.md:12-16 prueba JDK 11 para el motor InnerSource, no el runtime del fork ni la aceptación de Experian (auditoría, defecto 4)"
      efecto: "Mientras siga abierta, ningún where ni CALCULATED entra a una instrucción de generación (condición 5 de PA-002)"
    - id: "CQ-006 / BKL-001"
      descripcion: "State Calculation de SISBEN requiere lógica propia en el enricher (steering 07 §5.7). El PO la puso en el alcance como entrega manual de Ingesta 3 en el fork, sin regla de corte (INT-075)"
      efecto: "La generación de ART-072 espera la entrega y su aprobación del PO en N4 (condición 4 de PA-002); la entrega no está en la DoD de la HU §6"
    - id: "RG-003"
      descripcion: "R-26 sin mecanismo cerrado (crítico)"
      efecto: "No aprobar ART-070 sin PA-002 cerrada (condiciones 1-6), PA-013 y PA-014 (mitigación de RG-003)"
    - id: "RG-007"
      descripcion: "Una Fec_digitacion futura con formato válido llega a «sisben» como fechaEncuesta futura (spec §10.4 regla 1, §13). Aceptado por el PO según las fuentes"
      efecto: "Ítem explícito de la aprobación del PO de la etapa: el PO confirma RG-007; SC-8 antes de certificar; PA-014 (4)"
    - id: "RG-011 / BKL-002"
      descripcion: "Certificación de 4 dimensiones (steering 07 §5.7) sin motor y fuera de la DoD (HU §6)"
      efecto: "No bloquea la propuesta; bloquea el paso a producción (certificacion_4_dimensiones)"
    - id: "RG-025 / RG-028 / RG-032"
      descripcion: "Verificaciones diferidas del matcher de Colombia (RG-025) y de Synthesis de Colombia, VD-SYN-01..06 (RG-028), y evidencia diferida de synthesis (RG-032, alto: synthesis aprobada sin ejecución de pipeline, APR-032): las tres bloquean la certificación de State Calculation"
      efecto: "Aun con PA-002 cerrada, la etapa no se certifica sin cerrarlas. La evidencia de Synthesis (paso de Synthesis de state-generation sobre el HC de Colombia, escenario HU §5.5 con dos cortes) es previa a la de esta etapa, que no admite evidencia diferida (references/03 §3b)"
    - id: "habilitacion-synthesis"
      descripcion: "edf-statecalc solo genera con synthesis aprobada y transicion_habilitada (edf-statecalc SKILL.md Paso 0 #2). Synthesis está aprobada con evidencia diferida (APR-032, RG-032) y con transicion_habilitada false"
      efecto: "Este insumo se audita y queda prevalidado; la generación espera la habilitación de la transición synthesis → state_calculation y la aprobación del insumo por el PO"
    - id: "evidencia"
      descripcion: "State Calculation no admite evidencia diferida (references/03 §3b)"
      efecto: "La etapa figura en el cierre como «bloqueada, no aprobada» (APR-030); con los artefactos aprobados quedaría pendiente_evidencia hasta la corrida del DAG state-generation y la prueba CA1"

marcado_heredado:
  nota: "Todo valor con marcador distinto de [C] en logica-statecalc.md se transcribe con su marcador original. Ningún [A:*] se resuelve en este YAML: las decisiones del PO (INT-075) se citan como [C] decisión registrada y sus supuestos como tales. La regla dura de groupBy plano (logica-statecalc.md §5.4) se respeta: la sección no usa groupBy (PA-012 b). El pendiente #2 de logica-statecalc.md §12 (sin motor de 4 dimensiones) sigue [A:sin-clasificar] y se cruza con RG-011."

trazabilidad:
  citas_formato: "archivo §sección | archivo:línea | ruta/archivo::símbolo"
  ultima_verificacion_referencias: "2026-11-25"

# ═════════════════════════════════════════════════════════════
# Modo Colombia (plantilla 1.9.11; edf-statecalc references/modo-colombia.md, HF-77)
# ═════════════════════════════════════════════════════════════

modo_colombia:
  aplica: true                                      # [P]: Pinning y Synthesis del expediente van en modo Colombia (spec §11-§13); se confirma con PA-013 (6) y (7)
  regla: >
    ART-071 son entradas fields[] para integrar en el foundation compartido de Colombia, no un archivo que lo reemplace: el
    domain de un archivo adicional se ignora y un name repetido gana para todas las fuentes (ContextUtils.scala:15-19;
    FoundationStateCalculator.scala:52-59). Ningún name ni alias que ya exista: si el campo ya existe y lee la misma clave
    curada con el mismo dataType, se reutiliza y no se declara; si existe con otro dataType u otro significado, es un
    bloqueo N4 que se escala (references/modo-colombia.md §2.1). ART-072 son secciones calculations[] para el calculation
    compartido, cada una con un where que filtra por fuente ([A:OQ-TR-2]) y un name válido como identificador JavaScript,
    sin «#» (QueryFunctions.scala:75-82; CalculationStateCalculator.scala:50-52): «sisben» (PA-012 a). Ningún name de
    sección que ya exista en el calculation compartido.
  filtro_fuente: "return field.dataSource == \"DNP\" && field.subscriber == \"999722\" (campos base inyectados, FoundationStateCalculator.scala:47-48; spec §1), más field.isSisbenCorteVigente == true del enricher (BKL-001). [C] decisión del PO (PA-002 c1-a, INT-075) · [A:OQ-TR-2] (Nashorn) · [A:PA-002]"
  nombres_existentes_verificados: "no — foundation y calculation compartidos de Colombia no disponibles en el workspace; PA-013 (6). Hasta verificarlos, los 4 campos de ART-071 son candidatos y la sección «sisben» no se genera"
  modo_delta: "[PM] PA-013 (5): deltaMode, deltaModeAccountLevel y doesComputeXpm del conf de Colombia (SparkStateCalculator.scala:187-189). En modo delta un PIN sin eventos nuevos conserva su XPM anterior (getAndSaveUnchangedV2, :246-271) y ningún filtro lo alcanza: (c1-a) requiere modo completo (condición 2 de PA-002)"
  estado: "[P] aplica · [C] regla (motor y modo-colombia.md) · [A:OQ-TR-2] / [A:PA-002] filtro · [PM] PA-013 (5) y (6)"

# ═════════════════════════════════════════════════════════════
# Decisión de formato
# ═════════════════════════════════════════════════════════════

decision_formato:
  descripcion: >
    Spec §13 define «sisben» como 6 atributos que salen 1 a 1 de campos curados, sin transformación propia y sin scoring:
    passthrough. Se traduce al DTO real (CalculationSection.java) como UNA sección de type MOST_RECENT_VALUE sin groupBy
    (un objeto por PIN, PA-012 b) con los 6 atributos en select. MOST_RECENT_VALUE elige, entre los registros que deja el
    where (los del corte vigente de SISBEN), el de mayor asOfPeriod (MostRecentValue.scala:16-29, recentBy = asOfPeriod por
    defecto, :29); con dos documentos vigentes en un PIN gana el más reciente (supuesto del PO, RG-031). select proyecta con
    el nombre literal y no renombra (QueryFunctions.scala:28-29): el nombre del atributo XPM es el nombre del campo en el
    registro Foundation, por eso fechaEncuesta y fechaModificacion necesitan que el registro Foundation los tenga con ese
    nombre (alias, mapeo_campos).
  estado: "[C] passthrough (spec §13) · [C] decisión del PO: un objeto sin groupBy, MOST_RECENT_VALUE (PA-012 b, INT-075) · [P] type del motor"
  fuente: "logica-statecalc.md §5.2-5.3; spec §13; PA-012; MostRecentValue.scala:14-29; QueryFunctions.scala:22-29"

# ═════════════════════════════════════════════════════════════
# CORE — Mapeo spec §13 («sisben») → campo curado → Foundation
# ═════════════════════════════════════════════════════════════

mapeo_campos:
  nota_general: >
    Spec §13 da para cada atributo XPM su campo curado y su tipo, y spec §10.1 declara que los nombres curados son
    definitivos («Pinning, Synthesis y State Calculation los citan literalmente»). Un campo DERIVED de Foundation lee
    curatedRecordJson.get(name) del evento sintetizado (FoundationFunctions.scala:24-35): el `name` del campo Foundation
    TIENE que ser el nombre curado; `value` no se usa en DERIVED. El nombre Foundation no se infiere: lo fija el motor. El
    evento sintetizado solo lleva los campos del GDD (EventSynthesizer.scala:110-116): los 7 nombres de abajo están entre
    las 34 entradas de ART-061. Clasificación PII: los 7 son públicos (spec §10.1; HU R-28) [C]. Las Foundation de varios
    archivos se fusionan en una lista; cuenta el domain del primero y un nombre duplicado se calcula dos veces y gana el
    último put para todas las fuentes (ContextUtils.scala:15-19; FoundationStateCalculator.scala:52-59): PA-013 (6).
    nivel_confianza A = cadena completa (origen curado [C] + nombre Foundation [C] + nombre XPM [C] + sin hecho abierto).
  campos:
    - campo_xpm_destino: "grupoSisben"
      campo_curado_sisben_origen: "grupoSisben"
      nombre_en_foundation: "grupoSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "STRING"                            # default del DTO: se omite en el JSON
      transformacion: "Ninguna (texto de 1 carácter A-D; toDataType STRING hace toString.trim, CalculationUtils.scala:14-39)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila grupoSisben, §10.1 fila Grupo; HU R-12, §5.6 «Sección generada»; source-spec-curation.yaml destino grupoSisben; FoundationFunctions.scala:24-35"

    - campo_xpm_destino: "nivelSisben"
      campo_curado_sisben_origen: "nivelSisben"
      nombre_en_foundation: "nivelSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "INTEGER"
      transformacion: "Ninguna en esta etapa: el curado ya es entero (spec §10.1); INTEGER = Try(value.toDouble.toInt) (CalculationUtils.scala:34)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila nivelSisben («entero»), §10.1 fila Nivel; HU R-12; source-spec-curation.yaml destino nivelSisben (tipo_salida entero)"

    - campo_xpm_destino: "codDepartamentoSisben"
      campo_curado_sisben_origen: "codDepartamentoSisben"
      nombre_en_foundation: "codDepartamentoSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "STRING"                            # NO INTEGER: perdería el cero inicial («05»)
      transformacion: "Ninguna (texto de 2 dígitos, conserva el cero inicial; HU R-04)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila codDepartamentoSisben («texto (2)»), §10.1 fila Cod_dpto; HU R-04; source-spec-curation.yaml destino codDepartamentoSisben"

    - campo_xpm_destino: "codMunicipioSisben"
      campo_curado_sisben_origen: "codMunicipioSisben"
      nombre_en_foundation: "codMunicipioSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "STRING"                            # NO INTEGER: perdería el cero inicial («05001»)
      transformacion: "Ninguna (texto de 5 dígitos DDMMM; HU R-04)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila codMunicipioSisben («texto (5)»), §10.1 fila Cod_mpio; HU R-04; source-spec-curation.yaml destino codMunicipioSisben"

    - campo_xpm_destino: "fechaEncuesta"
      campo_curado_sisben_origen: "fechaDigitacion"
      nombre_en_foundation: "fechaDigitacion, con alias fechaEncuesta [A:PA-013]"
      tipo_foundation: "DERIVED + aliases [\"fechaEncuesta\"] (propuesto)"
      valor_calculated: ""
      dataType: "LONG"
      transformacion: >
        Passthrough del epoch ms UTC del inicio del día en Bogotá que publica Curation; nulo si Fec_digitacion vino vacía o
        inválida (spec §10.1). Con nulo, DERIVED no escribe la clave ni el alias (FoundationStateCalculator.scala:52-59,
        :103-105) y select devuelve null para el atributo (QueryFunctions.scala:28-29; CalculationUtils.scala:44-46): «fechaEncuesta
        queda nula y la sección se genera igual» (HU §5.6) [C]; un atributo nulo cuenta como ausente (PA-012 c) y cómo lo
        escribe el writer queda en PA-013 (4). Una Fec_digitacion futura con formato válido llega como fecha futura (spec
        §10.4 regla 1): RG-007 aceptado por el PO, SC-8, PA-014 (4). Residual de PA-011 dentro de un mismo periodo: RG-030.
      nivel_confianza: "B"
      estado: "[A:PA-013]"
      nota: >
        Cadena de origen completa en las fuentes, pero el nombre XPM difiere del curado y select no renombra
        (QueryFunctions.scala:28-29). Dos maneras de que el registro Foundation tenga `fechaEncuesta`: (1) alias, que el
        motor escribe solo si computeAliasInFoundation = aliasEnabled del conf de State Calculation (FoundationStateCalculator.scala:103-105);
        la ruta viva es getSCContext (SparkStateCalculator.scala:166-171, :168), que usa run (:217, :220); compute (:66-67)
        no lo usa (:215 comentado). Los conf del repo traen true (resources/local/statecalc-application-local.conf:27,34;
        aws/conf/statecalc-application.conf:20,28); el valor de Colombia es un hecho del fork, PA-013 (1). (2) CALCULATED
        «return field.fechaDigitacion» con el DERIVED fechaDigitacion en fields[]: el orden no importa porque todos los
        DERIVED se calculan antes que cualquier CALCULATED (FoundationStateCalculator.scala:52-69), pero depende de Nashorn
        [A:OQ-TR-2]. Se prefiere (1). Renombrar con aggregates[].name cambiaría la semántica de passthrough (spec §13). Sin
        el hecho verificado no se genera.
      fuente: "spec §13 fila fechaEncuesta («epoch ms (nulo si no viene)»), §10.1 fila Fec_digitacion, §10.4; HU R-05, R-06, §5.6 «Fecha de encuesta ausente»; source-spec-curation.yaml destino fechaDigitacion (largo)"

    - campo_xpm_destino: "fechaModificacion"
      campo_curado_sisben_origen: "fechaActualizacionCns"
      nombre_en_foundation: "fechaActualizacionCns, con alias fechaModificacion [A:PA-013]"
      tipo_foundation: "DERIVED + aliases [\"fechaModificacion\"] (propuesto)"
      valor_calculated: ""
      dataType: "LONG"
      transformacion: >
        Passthrough del epoch ms de fec_actualizacion_cns (la As-Of-Date, HU R-07): obligatoria con sev. 1, así que nunca es
        nula en un evento aceptado (spec §3 fila 22). LONG = Try(value.toDouble.toLong) (CalculationUtils.scala:35); un epoch
        ms (< 2^53) no pierde precisión. No es lo mismo que asOfPeriod, el periodo del evento sintetizado: ese periodo sale de
        getPeriod / minFrequency de la clase base, no de dateType (HF-69; periodicidad efectiva en RG-028); por eso se toma
        el campo curado y no el campo base.
      nivel_confianza: "B"
      estado: "[A:PA-013]"
      nota: "Mismo mecanismo y misma dependencia que fechaEncuesta (alias con aliasEnabled del fork, PA-013 (1); CALCULATED con Nashorn [A:OQ-TR-2])"
      fuente: "spec §13 fila fechaModificacion («epoch ms»), §3 fila 22 y guard-rails, §10.1 fila fec_actualizacion_cns; HU R-07; source-spec-curation.yaml destino fechaActualizacionCns (largo)"

    - campo_xpm_destino: "(ninguno: soporte del filtro del corte vigente, no es atributo de «sisben»)"
      campo_curado_sisben_origen: "fechaCorte"
      nombre_en_foundation: "fechaCorte"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "LONG"
      transformacion: "Epoch ms del último día del periodo AAAAMM del nombre del archivo (spec §10.1; HU §5.3 «Fecha de corte y tipo de archivo»). El enricher solo ve los campos declarados en Foundation (FoundationStateCalculator.scala:43-59, :75), por eso (c1-a) lo necesita en fields[]"
      nivel_confianza: "B"
      estado: "[A:PA-002]"
      nota: "Dirección (c1-a) decidida por el PO, pero PA-002 sigue abierta: se declara cuando se cumplan sus condiciones de cierre. No va a select: spec §13 no lo lista como atributo"
      fuente: "spec §10.1 fila (nombre del archivo) fechaCorte, §10.3; HU R-26; PA-002 (INT-075); source-spec-curation.yaml destino fechaCorte"

  pendientes_del_mapeo:
    - id: 1
      descripcion: "fechaEncuesta y fechaModificacion: verificar en el fork aliasEnabled del conf de State Calculation de Colombia (PA-013 punto 1). Con true, pasan a nivel A como DERIVED con alias; con false, la alternativa CALCULATED espera [A:OQ-TR-2]"
      estado: "[A:PA-013]"
    - id: 2
      descripcion: "fechaCorte: se declara cuando PA-002 se cierre con (c1-a)"
      estado: "[A:PA-002]"
    - id: 3
      descripcion: "Nombres ya declarados en la Foundation compartida de Colombia (los 4 de nivel A incluidos, p. ej. un nivelSisben previo con otro dataType, y fechaCorte, fechaDigitacion, fechaActualizacionCns): el último en orden gana para todas las fuentes (ContextUtils.scala:15-19; FoundationStateCalculator.scala:52-59). El domain de un archivo adicional no cuenta (ContextUtils.scala:17). PA-013 (6)"
      estado: "[PM]"

# ═════════════════════════════════════════════════════════════
# Instrucción de generación — Foundation (ART-071)
# ═════════════════════════════════════════════════════════════

instruccion_generacion_foundation:
  archivo: "statecalc-foundation-local.json (propuesta en propuestas/statecalc/; se integra en la Foundation de Colombia o como archivo adicional de paths.foundationConfigurations, que es una lista: logica-statecalc.md §4.1; ContextUtils.scala:15-19)"
  seccion: "fields[]"
  contenido_a_escribir:
    regla: >
      Solo campos nivel_confianza A. DERIVED implícito: en el JSON se omite la clave `type` y no se escribe `value` (DERIVED
      lee por `name`, FoundationFunctions.scala:24-35). dataType solo si no es STRING. Nunca dataSource, subscriber,
      subscriberRelation, asOfPeriod, pin ni parentEventIds (los inyecta el motor, FoundationStateCalculator.scala:46-51).
      Sin comentarios en el JSON. Se genera solo si el PO aprueba este insumo limitado a ART-071 (alcance.genera).
    campos_a_generar:
      - name: "grupoSisben"
        type: "DERIVED"
      - name: "nivelSisben"
        type: "DERIVED"
        dataType: "INTEGER"
      - name: "codDepartamentoSisben"
        type: "DERIVED"
      - name: "codMunicipioSisben"
        type: "DERIVED"
    campos_excluidos_hasta_resolver:
      - "fechaDigitacion con aliases [fechaEncuesta], dataType LONG — PA-013 punto 1 (aliasEnabled); alternativa CALCULATED [A:OQ-TR-2]"
      - "fechaActualizacionCns con aliases [fechaModificacion], dataType LONG — PA-013 punto 1; alternativa CALCULATED [A:OQ-TR-2]"
      - "fechaCorte, dataType LONG — PA-002 (condiciones de cierre de (c1-a))"
    advertencia: >
      Modo Colombia (modo_colombia): los 4 campos son CANDIDATOS sujetos a PA-013 (6), no una lista final. Si el foundation
      compartido ya declara uno con la misma clave curada y el mismo dataType, se reutiliza y no se declara; si lo declara con
      otro dataType u otro significado, es un bloqueo N4 que se escala, nunca un nombre repetido (references/modo-colombia.md
      §2.1; ContextUtils.scala:15-19). Por §3e #1, ART-071 tampoco queda final antes de PA-013 (6), coherente con APR-030.
      ART-071 con 4 de 6 atributos no produce «sisben» ni cumple la DoD (HU §6); ART-072 no se genera con este insumo. Si se
      entrega como archivo aparte, su domain no cuenta (ContextUtils.scala:17).
    estado: "[C] contenido de los 4 candidatos de campos_a_generar · [PM] su inclusión final, PA-013 (6) · [A:PA-013] / [A:PA-002] los excluidos"

# ═════════════════════════════════════════════════════════════
# Instrucción de generación — Calculation (ART-072) y prueba (ART-073)
# ═════════════════════════════════════════════════════════════

instruccion_generacion_calculation:
  archivo: "statecalc-calculation-local.json"
  seccion: "calculations[]"
  contenido_a_escribir:
    regla: "una CalculationSection con groupBy PLANO (nunca grouping.groupBy anidado); en este insumo: NO GENERAR"
    generar: false
    motivo_no_generar: >
      Una sección sin los dos filtros produce un dato erróneo visible al cliente (N4): el registro Foundation de un PIN de
      Colombia mezcla eventos de todas las fuentes (StateCalcIOUtils.scala:174-177; FoundationStateCalculator.scala:37-51)
      y MOST_RECENT_VALUE toma el más reciente de cualquiera (MostRecentValue.scala:20-24); con un PIN fuera del corte
      vigente la sección sale igual. El filtro por fuente depende de [A:OQ-TR-2] (where Nashorn); el del corte vigente,
      además, de la entrega manual del enricher (CQ-006, BKL-001) y de PA-002; fechaEncuesta y fechaModificacion de
      select, de PA-013 (1); el modo de cálculo y lo que toca el XPM después, de PA-013 (5). La sección que resultaría
      está en propuesta_pa_002.seccion_resultante, fuera de esta instrucción (AUD-SC-13).
    valor_resultante: null
    campos_select_pendientes_de_agregar:
      - "grupoSisben, nivelSisben, codDepartamentoSisben, codMunicipioSisben (nivel A en Foundation; esperan los filtros)"
      - "fechaEncuesta, fechaModificacion (alias; PA-013 punto 1)"
    estado: "[A:PA-002] · [A:OQ-TR-2] · [A:PA-013] · [A:PA-014] · BKL-001 (CQ-006)"

  nota_sobre_passthrough_directo:
    descripcion: >
      El passthrough (spec §13) no necesita un FoundationStateEnrichmentProcessor ni un CustomOnSectionProcessor para los 6
      atributos. Lo que sí necesita lógica fuera de la configuración es R-26 (corte vigente): ver propuesta_pa_002. El
      enricher por defecto del motor es un no-op (DefaultFoundationStateEnrichmentProcessor.scala:11) y se fija en el código
      de la App, no por configuración (StateCalcApp.scala:15) [C].
    estado: "[C]"
    fuente: "spec §13; logica-statecalc.md §9.1; StateCalcApp.scala:15; DefaultFoundationStateEnrichmentProcessor.scala:11"

instruccion_generacion_prueba:
  artefacto: "ART-073 · CA1: Data Provisioning consulta la sección «sisben» en el XPM"
  generar: false
  motivo_no_generar: "Es una prueba de pipeline (DAG state-generation, carga al XPM y consulta online y batch de Data Provisioning), no un archivo de la skill; no hay ART-072 que probar; N4 no admite evidencia diferida (references/03 §3b). Cómo escribe el writer una sección o un atributo nulo y si Data Provisioning lo muestra es PA-013 (4)"
  criterios: "criterios_aceptacion SC-4"
  estado: "[A:PA-002] · [A:PA-013]"

# ═════════════════════════════════════════════════════════════
# PA-002 — Dirección (c1-a) decidida por el PO, con evidencia del motor (sigue abierta)
# ═════════════════════════════════════════════════════════════

propuesta_pa_002:
  pregunta: "PA-002 (abierta, bloqueante para state_calculation): ¿cómo se determina el corte vigente de SISBEN y cómo se excluye «sisben» de los PIN cuyo último evento SISBEN no pertenece a ese corte (HU R-26, §5.6)?"
  decision_del_po: "[C] decisión registrada (INT-075, APR-030, BIT-0177): dirección (c1-a), filtro por fuente en el where con los campos base y corte vigente marcado por el enricher; CQ-006 en el alcance de la ingesta como entrega manual de Ingesta 3 (BKL-001), sin regla de corte; supuesto «vigente = mayor periodo aceptado» con control operativo de re-entrega (BKL-003). PA-002 NO se cierra hasta cumplir condiciones_de_cierre"
  datos_de_entrada:
    - "Cada archivo REGULAR es la foto completa del corte (spec §1, §10.3; HU R-02). collection-stock vuelve a curar todos los cortes acumulados: el input de State Calculation trae eventos SISBEN de todos los cortes aceptados [C] (antecedente del expediente, BIT-0123)"
    - "Synthesis agrupa por periodo y por subscriber+subscriberRelation, ordena por (asOfDate, receivedDate) y LFP deja el último valor no nulo (ConsistencyCheckOps.scala:111-118, :177-181; EventSynthesizer.scala:110-116). El periodo sale de getPeriod / minFrequency (HF-69; RG-028). Un PIN ausente del corte vigente conserva eventos sintetizados de cortes anteriores, con su fechaCorte [C]"
    - "En modo completo, el input de State Calculation es synthesizedDir/*/*: un SyntheticEvents por PIN con los eventos de todas las fuentes (StateCalcIOUtils.scala:174-177; SparkStateCalculator.scala:205-217) [C]"

  opcion_d_el_motor_ya_lo_cumple:
    veredicto: "DESCARTADA con evidencia de código (la auditoría la reproduce)"
    evidencia:
      - "Foundation solo excluye eventos con curatedRecordJson.isVisible == false (FoundationStateCalculator.scala:37-42). SISBEN no publica isVisible (spec §10.1 es la lista completa) y Synthesis solo lo escribe con custom rules o migración (CustomRuleChecker.scala:158-178; VisibilityChecker.scala:137-155; RelationshipMigrationChecker.scala:106,163)"
      - "numberOfPeriods es takeRight(n) sobre los registros del PIN (CalculationFunctions.scala:28-30): relativo al PIN, no a un corte global"
      - "MOST_RECENT_VALUE elige el registro de mayor recentBy (asOfPeriod por defecto) entre los del PIN (MostRecentValue.scala:16-29): también relativo al PIN"
      - "El enricher por defecto no hace nada (DefaultFoundationStateEnrichmentProcessor.scala:11) y la App lo fija en código (StateCalcApp.scala:15)"
      - "El borrado inferido V2 (voidIndicator) vive en Synthesis, solo con checkFileTagEnabled = true y Process Management (SparkConsistencyChecker.scala:75-130; HCUtil.scala:76-88, :125-129); voidIndicator no es campo inyectado del GDD (DomainDictionaryInternal.scala:101-104) y State Calculation no lo filtra (AUD-E0-07)"
      - "Un where solo ve un registro a la vez (QueryFunctions.scala:49-63) y el enricher solo los registros de un PIN (FoundationStateCalculator.scala:75; FoundationStateEnrichmentProcessor.scala:10): ninguno conoce el máximo fechaCorte del conjunto sin que se lo inyecten"
      - "En modo delta el motor no recalcula los PIN sin cambios y copia su XPM desde la generación de referencia (SparkStateCalculator.scala:187-188, :207-213, :246-271; StateCalcIOUtils.scala:179-196): un PIN ausente del corte vigente conservaría su sección (AUD-SC-02)"

  opcion_c1a_decidida:
    filtro_por_fuente:
      mecanismo: "En el where de la sección, con los campos base que inyecta el motor: field.dataSource == \"DNP\" && field.subscriber == \"999722\" (FoundationStateCalculator.scala:47-48; spec §1). No necesita el enricher. Es el patrón del fixture real con banderas por fuente (resources/local/statecalc-foundation-local.json:1947-1950; statecalc-calculation-local.json:149), salvo que SISBEN no publica bandera (spec §10.1, lista completa) (AUD-SC-07)"
      depende_de: "[A:OQ-TR-2] (where Nashorn, QueryFunctions.scala:75-82)"
    corte_vigente:
      mecanismo: >
        Corte vigente = mayor fechaCorte entre los eventos SISBEN (DNP, 999722) del input de la corrida, que con el supuesto
        del PO es el mayor periodo aceptado (un archivo rechazado por Acceptance no deja eventos curados, HU R-22, spec RQ-03).
        Se calcula una vez por corrida con una lectura previa del sintetizado y se inyecta al enricher de Colombia, que agrega
        isSisbenCorteVigente = true a los registros Foundation de DNP/999722 con fechaCorte = corte vigente, sin borrar
        registros (flag aditivo, steering 07 §5.7). No basta con el enricher: StateCalcApp arma el contexto antes de run
        (StateCalcApp.scala:15-16) y la entrada se lee dentro de run (SparkStateCalculator.scala:205-217), así que hace falta
        cambiar la App o el motor de Colombia (o un SparkStateCalculator propio); el contexto tiene enrichConf y lookup
        (StateCalculationContext.scala:16-22) (AUD-SC-05). El enricher no registra valores en logs WARN/ERROR (steering 07
        §5.7; 08 §3 S4).
      depende_de: "CQ-006 como entrega manual de Ingesta 3 en el fork (BKL-001) + [A:OQ-TR-2] (el flag solo filtra con un where) + PA-013 (2)"
    foundation: "fechaCorte DERIVED LONG en fields[] para que el enricher lo lea (mapeo_campos)"
    supuesto_del_po: "Vigente = mayor periodo aceptado. Con una re-entrega de un REGULAR del mismo periodo (nada en el contrato la impide: spec §2 regex, RA-01..04; HU R-02 «reemplaza todo lo anterior») las dos entregas tienen el mismo fechaCorte y los registros no traen la identidad del archivo (spec §10.1 lista completa): un PIN que salió en la segunda conservaría «sisben». Mitigación: control operativo BKL-003 (detener la corrida hacia producción ante un segundo REGULAR aceptado del mismo periodo hasta que decida una persona; dueño Operación) [PM]; respuesta de negocio en PA-014 (1). Un periodo anterior aceptado después de uno posterior no pasa a ser el vigente (AUD-SC-01)"
    limites:
      - "Requiere modo completo: deltaMode y deltaModeAccountLevel en false y doesComputeXpm en true, sin el feature de histórico (STATECALC_ATTACH_HISTORIC_DATA, clave de conf attachHistorcData con esa grafía real: statecalc-application-local.conf:67, oxygen-config-default.conf:666; StateCalcAddOns.scala:40-48) ni de enriquecimiento de cálculo con appenders que reintroduzcan la sección (SparkStateCalculator.scala:187-190; StateCalcAddOns.scala:30-48, :136-160). PA-013 (5)"
      - "RG-029: un PIN vigente se excluye por error si su evento vigente cae en el mismo periodo que uno anterior con asOfDate MAYOR (LFP por (asOfDate, receivedDate), ConsistencyCheckOps.scala:115-118). Depende de la periodicidad efectiva (minFrequency, RG-028), no del dateType. SC-7"
      - "RG-030: por PA-011, fechaEncuesta puede no salir nula dentro de un mismo periodo. SC-3"
      - "RG-031: con dos documentos SISBEN vigentes en un PIN, la sección toma el más reciente (supuesto del PO; PA-014 (3))"
      - "El nombre de la sección debe ser un identificador JavaScript: el motor compila function aggregated_where_<name> al construir el calculador (QueryFunctions.scala:75-82; CalculationStateCalculator.scala:50-52). «#sisben» no compila (AUD-SC-03); por eso «sisben» (PA-012 a)"
      - "Sin groupBy, una sección sin registros tras el where vale null (QueryFunctions.scala:61; CalculationStateCalculator.scala:146-163, :162); con groupBy saldría una lista vacía [] (CalculationStateCalculator.scala:123-143) (AUD-SC-04). Con PA-012 (b) sin groupBy: null = sin sección (PA-012 c)"
      - "Código Scala en el fork, fuera de las skills y de la DoD de la HU (§6: solo statecalc-foundation y statecalc-calculation): entrega manual de Ingesta 3 (BKL-001), aprobación del PO en N4"
    condiciones_de_cierre:
      nota: "INT-075 (condiciones 1-6; mitigación de RG-003). Ninguna se cumple en esta corrida"
      lista:
        - "1 · PA-014 (1) respondida por negocio, o el supuesto «vigente = mayor periodo aceptado» con el control operativo de re-entrega BKL-003 en marcha"
        - "2 · Modo completo confirmado en el fork (deltaMode y deltaModeAccountLevel false, doesComputeXpm true) sin histórico, appenders ni enriquecimiento que reintroduzcan la sección (PA-013 (5))"
        - "3 · Sección «sisben» (identificador JavaScript; PA-012 a). Si Data Provisioning exige «#sisben» literal, PA-013 / PA-014 (2) y (c1-a) no sirve tal como está"
        - "4 · CQ-006 ejecutado como entrega manual en el fork (BKL-001): enricher con isSisbenCorteVigente y lectura previa del sintetizado en la App o el motor, aprobados por el PO en N4"
        - "5 · OQ-TR-2 cerrado (JDK del runtime de Colombia y aceptación de Nashorn por Experian; PA-013 (3))"
        - "6 · Escenarios SC-7 y SC-8 agregados y probados antes de certificar (criterios_aceptacion)"
    seccion_resultante:
      nota: "NO es instrucción de generación (AUD-SC-13). Es la sección que resultaría con PA-002 cerrada en (c1-a) y PA-012 como la resolvió el PO"
      name: "sisben"                                # [C] decisión del PO (PA-012 a); identificador JavaScript
      description: "Sección sisben del XPM (spec §13): clasificación Sisbén IV del corte vigente"   # [P]
      type: "MOST_RECENT_VALUE"                     # [C] decisión del PO (PA-012 b) · [P] tipo del motor
      select: ["grupoSisben", "nivelSisben", "fechaEncuesta", "fechaModificacion", "codDepartamentoSisben", "codMunicipioSisben"]   # [C] spec §13; fechaEncuesta/fechaModificacion [A:PA-013]
      groupBy: []                                   # [C] decisión del PO (PA-012 b): un objeto por PIN
      where: "return field.dataSource == \"DNP\" && field.subscriber == \"999722\" && field.isSisbenCorteVigente == true"   # [A:PA-002] + [A:OQ-TR-2]; el flag lo pone el enricher (BKL-001)
      enabled: true
      transient: false
      efecto_sin_registros: "null (QueryFunctions.scala:61; CalculationStateCalculator.scala:162) = sin sección (PA-012 c); el writer y Data Provisioning: PA-013 (4)"

  alternativas_dentro_de_c1_no_elegidas:
    - "(c1-b) Corte vigente desde los metadatos del último archivo aceptado (process management o lookup del contexto, StateCalculationContext.scala:16-22): resuelve la llegada fuera de orden pero no la re-entrega del mismo periodo; también es Scala"
    - "(c1-c) Corte escrito como literal en el where en cada corrida: sin Scala, pero ata el despliegue de la configuración a cada archivo del DNP; frágil"
    - "where con fecha relativa a la ejecución (p. ej. corte ≥ hoy − N meses), o custom rule de Synthesis con duration relativa a env.CURRENT_DATE_TIME (CustomRuleChecker.scala:47-52): si el DNP se atrasa, «sisben» desaparece para todos"
    - "No sirven: elegir con recentBy de MOST_RECENT_VALUE (no filtra, y un registro sin la clave rompe el toString, MostRecentValue.scala:22); un appender de XPM (Scala, y expone fechaCorte, que spec §13 no lista)"

  fuera_de_pa_002_para_el_po:
    - "(e) Borrado inferido V2 en Synthesis (checkFileTagEnabled, eventTypeList, historicAttributeArgs, voidIndicator en el GDD y un where en State Calculation). Es el mecanismo del motor para «carga completa» (SparkConsistencyChecker.scala:75-79), pero cambia Synthesis y su conf compartido y depende de que el fileTag de SISBEN no se comparta con otras fuentes (getLatestTimeForEachType, :91-104). Solo con versión nueva de HU y spec (HU §3 «Estabilidad de las reglas»); es una de las salidas de PA-014 (1) si hay re-entrega"

# ═════════════════════════════════════════════════════════════
# Criterios de aceptación (HU §5.6, §6) y ART-073
# ═════════════════════════════════════════════════════════════

criterios_aceptacion:
  nota: "State Calculation no admite evidencia diferida: estos escenarios se prueban en el pipeline (DAG state-generation) con datos sintéticos y se registran en Zephyr (HU §6). La aprobación es del PO (N4)"
  escenarios:
    - id: "SC-1 Sección generada"
      dado: "un PIN con un evento SISBEN del corte vigente"
      entonces: "el XPM tiene la sección «sisben» con grupoSisben, nivelSisben, fechaEncuesta, fechaModificacion, codDepartamentoSisben y codMunicipioSisben con los valores curados de ese corte (códigos con cero inicial; fechas en epoch ms)"
      fuente: "HU §5.6; spec §13"
    - id: "SC-2 Persona que ya no aparece"
      dado: "un PIN con eventos SISBEN de 202512 y ninguno de 202601, corriendo con 202601 como corte vigente"
      entonces: "el XPM de 202601 no tiene sección «sisben» para ese PIN (clave ausente o null y Data Provisioning no la muestra, PA-012 c)"
      fuente: "HU R-26, §5.6"
    - id: "SC-3 Fecha de encuesta ausente"
      dado: "un evento del corte vigente sin Fec_digitacion (incluido un PIN con un corte anterior del mismo periodo que sí la traía, RG-030)"
      entonces: "fechaEncuesta nula o ausente y la sección se genera igual"
      fuente: "HU §5.6; RG-030"
    - id: "SC-4 / ART-073 CA1 Consulta en Data Provisioning"
      dado: "la salida de State Calculation cargada al XPM (statecalc/calculated, spec §14; XpmEventDAO)"
      entonces: "la sección «sisben» está disponible en la consulta online y batch de Data Provisioning"
      fuente: "HU §5.6, §1"
    - id: "SC-5 Sin sección para otras fuentes"
      dado: "un PIN de Colombia sin eventos SISBEN, y otro con SISBEN vigente y un evento más reciente de otra fuente"
      entonces: "el primero no tiene sección «sisben»; el segundo la tiene con los datos de SISBEN (comprueba el filtro por fuente)"
      fuente: "HU R-26; motivo_no_generar"
      estado: "[P]"
    - id: "SC-6 Igualdad de asOfDate entre cortes"
      dado: "un PIN presente en 202512 y 202601 con la misma fec_actualizacion_cns"
      entonces: "la sección sale con los datos y el fechaCorte de 202601 (gana el receivedDate mayor, ConsistencyCheckOps.scala:115-118)"
      fuente: "HU §5.5"
      estado: "[P]"
    - id: "SC-7 asOfDate decreciente y re-entrega (límites de c1-a)"
      dado: "(a) un PIN cuyo evento de 202601 tiene fec_actualizacion_cns MENOR que el de 202512 dentro del mismo periodo de Synthesis; (b) un segundo REGULAR aceptado del mismo periodo 202601 sin uno de los PIN de la primera entrega"
      entonces: "(a) el PIN conserva la sección (si sale sin ella, RG-029 se materializa y se escala); (b) el control operativo BKL-003 detiene la corrida hacia producción antes de publicar el XPM"
      fuente: "HU R-02, R-26; RG-029; BKL-003; INT-075 condición 6"
      estado: "[C] decisión del PO (escenario exigido)"
    - id: "SC-8 Fecha de encuesta futura (RG-007)"
      dado: "un evento del corte vigente con Fec_digitacion futura de formato válido (SISBEN_INC_018, sev. 3)"
      entonces: "fechaEncuesta llega como la fecha futura publicada por Curation, sin filtro ni anulación en State Calculation"
      fuente: "HU R-06; spec §10.4 regla 1, §13; RG-007 aceptado; INT-075 condición 6"
      estado: "[C] decisión del PO (escenario exigido)"
    - id: "SC-9 Dos documentos SISBEN vigentes en un PIN (RG-031)"
      dado: "un PIN que Pinning formó con dos documentos SISBEN del corte vigente (regla 2, spec §11)"
      entonces: "la sección es un solo objeto con los datos del registro de mayor asOfPeriod"
      fuente: "PA-012 b; RG-031"
      estado: "[C] exigido por RG-031 antes de certificar"

certificacion_4_dimensiones:
  regla: "Steering 07 §5.7: completitud de mandatorios ≥90%, validez de tipo 100%, unicidad 0% de duplicados por la llave de identidad que declare la spec, consistencia ≥90%, antes de producción"
  llave_unicidad: "[P] tipo + número normalizado (sin espacios ni ceros a la izquierda), la clave de duplicados de spec §6; en el evento curado, standardizedIdType + standardizedIdNumber (spec §10.1). La tabla de spec §11 es la prioridad del matcher, no la llave (AUD-SC-08)"
  estado: "[A:sin-clasificar] — no figura en la DoD (HU §6) y no hay motor que la calcule (logica-statecalc.md §2). No se genera ninguna clave. RG-011 abierto (alto): no bloquea la propuesta, sí producción; dueños PO e Ingesta 3 (BKL-002)"

