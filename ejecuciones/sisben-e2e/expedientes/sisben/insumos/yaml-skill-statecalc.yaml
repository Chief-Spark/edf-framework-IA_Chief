# yaml-skill-statecalc.yaml — insumo de edf-statecalc para la ingesta sisben (ART-070), producido por edf-analisis
# (Modo 2, tipo T3/T4). Estructura: .kiro/skills/edf-analisis/assets/templates/_cabecera-yaml-skill.yaml.tpl +
# yaml-skill-statecalc.yaml.tpl (framework 1.9.9). El ejemplo assets/examples/sisben/yaml-skill-statecalc.yaml es solo
# forma: ningún valor se copió de él (sus 25 campos del Levantamiento, su personIdType/personIdNumber CALCULATED, su grain
# [personIdType, personIdNumber] y su nombre de sección no salen de la HU ni de la spec vigentes; LEEME.md).
# Sin estado ni aprobador (HF-32). Versión 1 · 2026-11-25. State Calculation es riesgo N4: aprueba el PO o el Aprobador
# designado (steering 06 §2.2; spec §13).
#
# Fuentes de la ingesta (únicas): fuentes/hu-sisben.md 1.0.2 (§1, §2, R-25, R-26, R-28, §5.5, §5.6, §6 fila State
# Calculation) y fuentes/spec-sisben.md 1.0.2 (§1, §10.1, §10.3, §12, §13). La spec no trae un anexo con el contenido de
# este insumo. Claves publicadas: insumos/source-spec-curation.yaml v2 (ART-030). Claves que llegan a State Calculation:
# las del GDD de Synthesis (insumos/yaml-skill-synthesis.yaml, ART-060, en revisión: 34 entradas LFP, incluida fechaCorte).
# Evidencia del motor: copia de solo lectura Motor-Oxigen/oxygen-statecalculation/ y Motor-Oxigen/oxygen-synthesis/ (no hay
# fork de Colombia en esta corrida: oxygen-core / oxygen-global / bureau.colombia_innersource no están en el workspace).
#
# Marcadores (steering 05 §3): [C] confirmado (fuente de la ingesta o lectura directa del motor, con cita) · [P] propuesto
# / inferencia del analista con evidencia · [A:<ID>] abierto · [PM] pendiente-manual (se verifica en el fork o en el
# pipeline) · [S] superado.
#
# Resumen para el revisor:
#   - Contenido de #sisben (spec §13): 6 atributos passthrough. 4 tienen cadena completa y nombre Foundation forzado por el
#     motor (DERIVED lee curatedRecordJson.get(name)): grupoSisben, nivelSisben, codDepartamentoSisben, codMunicipioSisben.
#     fechaEncuesta y fechaModificacion cambian de nombre respecto del campo curado: necesitan alias (aliasEnabled del conf
#     de Colombia, hecho del fork) o un CALCULATED (Nashorn, [A:OQ-TR-2]). Quedan fuera de la generación (PA-012 propuesta).
#   - PA-002: (d) queda descartada con evidencia del motor (sección propuesta_pa_002). La única opción compatible es (c1) y
#     necesita código Scala en el enricher de Colombia ([A:CQ-006]) más un `where` Nashorn ([A:OQ-TR-2]). Además, sin un
#     filtro por fuente la sección se calcularía con eventos de cualquier fuente de Colombia: el filtro del corte vigente y
#     el filtro por fuente se resuelven juntos.
#   - La sección de Calculation (ART-072) NO se genera con este insumo: depende de PA-002, de PA-012 y PA-013 (propuestas)
#     y de [A:OQ-TR-2]. Esos hechos del fork no admiten verificación diferida (edf-orquestador references/03 §3e #1).

documento:
  tipo: "intermediario-skill"
  etapa_pipeline: "State Calculation"
  ingesta: "sisben"
  version: "1.0.0"
  fecha: "2026-11-25"
  # Sin estado ni aprobador (HF-32): viven solo en estado-ingesta.json, que registra edf-orquestador con el hash de este archivo.

procedencia:
  fuente_analisis:
    ruta: ".kiro/skills/edf-analisis/references/logica-statecalc.md"
    version_fuente: "1.0.0 (§5.1-§5.6, §6, §7, §9.1, §9.2), contrastada con el motor donde la reference no alcanza (alias, filtro isVisible, numberOfPeriods, null de una sección vacía, recentBy de MOST_RECENT_VALUE)"
  fuentes_ingesta:
    hu: "ejecuciones/sisben-e2e/expedientes/sisben/fuentes/hu-sisben.md 1.0.2 (§1, §2, R-25, R-26, R-28, §5.5, §5.6, §6)"
    spec: "ejecuciones/sisben-e2e/expedientes/sisben/fuentes/spec-sisben.md 1.0.2 (§1, §10.1, §10.3, §12, §13)"
    mapeo_campos: "ejecuciones/sisben-e2e/expedientes/sisben/analisis/mapeo-campos.md (ART-002; filas 3, 5, 16, 17, 18, 22 y fechaCorte; no mapea al XPM, 04 §4.4)"
    source_spec_curation: "ejecuciones/sisben-e2e/expedientes/sisben/insumos/source-spec-curation.yaml (v2, ART-030; campos_curados[].destino)"
    contrato_curation_pinning: "ejecuciones/sisben-e2e/expedientes/sisben/insumos/contrato-curation-pinning.md (no aporta claves a State Calculation; se cita por la cadena de nombres)"
    yaml_skill_synthesis: "ejecuciones/sisben-e2e/expedientes/sisben/insumos/yaml-skill-synthesis.yaml (ART-060, en revisión; el evento sintetizado solo lleva los campos del GDD, EventSynthesizer.scala:94-116)"
  repositorio_base:
    nombre: "oxygen-statecalculation (copia Motor-Oxigen/oxygen-statecalculation/) · App, enricher y JSON de Foundation/Calculation de Colombia en el fork (no disponibles)"
    naturaleza: "Z2 — solo lectura"
  skill_destino: "edf-statecalc"

alcance:
  genera:
    - "ART-071 · propuestas/statecalc/statecalc-foundation-local.json: fields[] con los 4 campos de nivel A (instruccion_generacion_foundation.campos_a_generar), DERIVED, sin `value`, sin campos base. Los otros 3 quedan en campos_excluidos_hasta_resolver [C] cadena / [PM] integración al JSON compartido de Colombia (PA-013 propuesta, punto 3)"
  no_genera:
    - "ART-072 · CalculationSection de #sisben: no se genera con este insumo. Sin el filtro del corte vigente (PA-002) y sin el filtro por fuente, MOST_RECENT_VALUE toma el registro Foundation más reciente del PIN de CUALQUIER fuente de Colombia (MostRecentValue.scala:16-24; FoundationStateCalculator.scala:43-51) y la sección sale para todos los PIN, con nulos o con datos de otra fuente: dato erróneo visible al cliente (N4). Ver instruccion_generacion_calculation"
    - "Código Scala de ningún tipo: ni el cambio del enricher de Colombia que pide (c1), ni un CustomOnSectionProcessor, ni un CalculationType pluggable (edf-statecalc SKILL.md «Qué este skill nunca hace»; steering 07 §5.7 [A:CQ-006])"
    - "Campos CALCULATED y predicados `where`: dependen de Nashorn [A:OQ-TR-2] (steering 07 §5.7: «No generar configuración que dependa de Nashorn sin resolverlo»)"
    - "Scoring (risk, trust, completeness): fuera de alcance (HU §2; spec §13 «Sin scoring») [C]"
    - "NAMES, BEST NAME, IDENTIFICATIONS y BEST IDENTIFICATIONS: SISBEN las alimenta «con la configuración estándar de Colombia, sin cambios» (spec §13) [C]; no se genera nada para ellas"
    - "Clave de quality threshold o motor de calidad de 4 dimensiones: no existe en el motor (logica-statecalc.md §2); ver certificacion_4_dimensiones (RG-011)"
    - "ART-073 (CA1, Data Provisioning consulta #sisben): es una prueba de pipeline, no un artefacto de la skill; criterios en criterios_aceptacion"
  precondiciones_bloqueantes:
    - id: "PA-002"
      descripcion: "Mecanismo del corte vigente (R-26, HU §5.6 «Persona que ya no aparece»). Abierta, bloqueante para state_calculation; decide el PO"
      efecto: "Bloquea ART-072, la inclusión de fechaCorte en ART-071 y la aprobación de este insumo (RG-003). Propuesta con evidencia en propuesta_pa_002"
    - id: "OQ-TR-2"
      descripcion: "Uso de Nashorn (steering 07 §5.7, 06 §6 fila 3). La opción (c1) recomendada necesita un `where` en la sección; renombrar con CALCULATED también lo necesitaría"
      efecto: "Mientras siga abierta, ningún `where` ni CALCULATED entra a una instrucción de generación"
    - id: "CQ-006"
      descripcion: "Si State Calculation de SISBEN requiere lógica propia en el enricher (steering 07 §5.7, §7 fila 6). (c1) responde que sí"
      efecto: "Decisión de alcance del PO: el cambio del enricher es código fuera de las skills del framework (edf-statecalc SKILL.md, decisiones-pendientes.md §5)"
    - id: "PA-012 (propuesta)"
      descripcion: "Forma visible de la sección: nombre literal de la clave, objeto único o lista por documento, sección ausente frente a valor nulo (preguntas_propuestas)"
      efecto: "Bloquea ART-072"
    - id: "PA-013 (propuesta)"
      descripcion: "Hechos del fork de los que dependen ART-071 y ART-072 (aliasEnabled, App y enricher de Colombia, JSON compartidos, serialización de una sección nula)"
      efecto: "Bloquea fechaEncuesta y fechaModificacion en ART-071 y todo ART-072. No admite verificación diferida porque los artefactos dependen de ellos (edf-orquestador references/03 §3e #1)"
    - id: "habilitacion-synthesis"
      descripcion: "edf-statecalc solo genera con synthesis aprobada y transicion_habilitada (edf-statecalc SKILL.md Paso 0 #2). Hoy synthesis está no_iniciada (ART-060 en revisión)"
      efecto: "Este insumo se puede registrar y revisar; la generación espera la aprobación de synthesis y la de este insumo por el PO"
    - id: "RG-025 / evidencia"
      descripcion: "La verificación diferida del matcher de Colombia bloquea la certificación de State Calculation. State Calculation no admite evidencia diferida"
      efecto: "Aun con PA-002 cerrada, la etapa termina en pendiente_evidencia con los artefactos aprobados por el PO hasta tener la corrida del DAG state-generation y la prueba CA1 (criterios_aceptacion)"

marcado_heredado:
  nota: "Todo valor con marcador distinto de [C] en logica-statecalc.md se transcribe con su marcador original. Ningún [A:*] se resuelve en este YAML. La regla dura de groupBy plano (logica-statecalc.md §5.4) se respeta; esta sección no usa groupBy (propuesta [A:PA-012]). El pendiente #2 de logica-statecalc.md §12 (sin motor de 4 dimensiones) sigue [A:sin-clasificar] y se cruza con RG-011."

trazabilidad:
  citas_formato: "archivo §sección | archivo:línea | ruta/archivo::símbolo"
  ultima_verificacion_referencias: "2026-11-25"

# ═════════════════════════════════════════════════════════════
# Decisión de formato
# ═════════════════════════════════════════════════════════════

decision_formato:
  descripcion: >
    Spec §13 define #sisben como 6 atributos que salen 1 a 1 de campos curados, sin transformación propia y sin scoring:
    passthrough. Se traduce al DTO real (CalculationSection.java) como UNA sección de type MOST_RECENT_VALUE (el valor del
    registro Foundation más reciente, MostRecentValue.scala:16-24, por defecto ordenado por asOfPeriod) con los 6 atributos
    en select. Los 6 nombres de select son los atributos XPM de spec §13: el motor proyecta con el nombre de select
    (QueryFunctions.scala:28-29), así que el nombre del atributo XPM es el nombre del campo en el registro Foundation.
    Por eso los dos atributos que cambian de nombre (fechaEncuesta, fechaModificacion) necesitan que el registro Foundation
    los tenga con ese nombre (alias o CALCULATED; mapeo_campos). El tipo de sección es [P] (inferencia del analista: la
    spec no nombra un tipo del motor); el passthrough es [C] (spec §13).
  estado: "[C] passthrough (spec §13) · [P] type MOST_RECENT_VALUE"
  fuente: "logica-statecalc.md §5.2-5.3; spec §13; MostRecentValue.scala:14-29; QueryFunctions.scala:22-29"

# ═════════════════════════════════════════════════════════════
# CORE — Mapeo spec §13 (#sisben) → campo curado → Foundation
# ═════════════════════════════════════════════════════════════

mapeo_campos:
  nota_general: >
    Spec §13 da para cada atributo XPM su campo curado y su tipo, y spec §10.1 declara que los nombres curados son
    definitivos («Pinning, Synthesis y State Calculation los citan literalmente»). Un campo DERIVED de Foundation lee
    curatedRecordJson.get(name) del evento sintetizado (FoundationFunctions.scala:24-35): el `name` del campo Foundation
    TIENE que ser el nombre curado; `value` no se usa en DERIVED. Por eso el nombre Foundation no se infiere: lo fija el
    motor. El evento sintetizado solo lleva los campos del GDD (EventSynthesizer.scala:94-116): los 7 nombres de abajo
    están entre las 34 entradas del GDD de ART-060. Clasificación PII: los 7 son públicos (spec §10.1; HU R-28) [C].
    nivel_confianza A = cadena completa (origen curado [C] + nombre Foundation [C] + nombre XPM [C] + sin hecho abierto).
  campos:
    - campo_xpm_destino: "grupoSisben"
      campo_curado_sisben_origen: "grupoSisben"
      nombre_en_foundation: "grupoSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "STRING"                            # default del DTO: se omite en el JSON
      transformacion: "Ninguna (texto de 1 carácter A-D; toDataType STRING hace toString.trim, CalculationUtils.scala:15-36)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila grupoSisben, §10.1 fila Grupo; HU R-12, §5.6 «Sección generada»; source-spec-curation.yaml destino grupoSisben; FoundationFunctions.scala:24-35"

    - campo_xpm_destino: "nivelSisben"
      campo_curado_sisben_origen: "nivelSisben"
      nombre_en_foundation: "nivelSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "INTEGER"
      transformacion: "Ninguna en esta etapa: el curado ya es entero (spec §10.1); INTEGER = Try(value.toDouble.toInt) (CalculationUtils.scala:34)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila nivelSisben («entero»), §10.1 fila Nivel; HU R-12; source-spec-curation.yaml destino nivelSisben (tipo_salida entero)"

    - campo_xpm_destino: "codDepartamentoSisben"
      campo_curado_sisben_origen: "codDepartamentoSisben"
      nombre_en_foundation: "codDepartamentoSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "STRING"                            # NO INTEGER: perdería el cero inicial («05»)
      transformacion: "Ninguna (texto de 2 dígitos, conserva el cero inicial; HU R-04)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila codDepartamentoSisben («texto (2)»), §10.1 fila Cod_dpto; HU R-04; source-spec-curation.yaml destino codDepartamentoSisben"

    - campo_xpm_destino: "codMunicipioSisben"
      campo_curado_sisben_origen: "codMunicipioSisben"
      nombre_en_foundation: "codMunicipioSisben"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "STRING"                            # NO INTEGER: perdería el cero inicial («05001»)
      transformacion: "Ninguna (texto de 5 dígitos DDMMM; HU R-04)"
      nivel_confianza: "A"
      estado: "[C]"
      fuente: "spec §13 fila codMunicipioSisben («texto (5)»), §10.1 fila Cod_mpio; HU R-04; source-spec-curation.yaml destino codMunicipioSisben"

    - campo_xpm_destino: "fechaEncuesta"
      campo_curado_sisben_origen: "fechaDigitacion"
      nombre_en_foundation: "fechaDigitacion, con alias fechaEncuesta [A:PA-013]"
      tipo_foundation: "DERIVED + aliases [\"fechaEncuesta\"] (propuesto)"
      valor_calculated: ""
      dataType: "LONG"
      transformacion: >
        Passthrough del epoch ms UTC del inicio del día en Bogotá que publica Curation; nulo si Fec_digitacion vino vacía o
        inválida (spec §10.1). Con nulo, DERIVED no escribe la clave ni el alias (FoundationStateCalculator.scala:54-58,
        :103-105) y select devuelve null para el atributo (QueryFunctions.scala:28-29; CalculationUtils.scala:44-46): «fechaEncuesta
        queda nula y la sección se genera igual» (HU §5.6) [C]. Una Fec_digitacion futura con formato válido llega como fecha
        futura (spec §10.4 regla 1; RG-007): no se filtra aquí; lo confirma el PO al aprobar.
      nivel_confianza: "B"
      estado: "[A:PA-013]"
      nota: >
        Cadena de origen completa en las fuentes, pero el nombre XPM difiere del curado. Dos maneras de que el registro
        Foundation tenga `fechaEncuesta`: (1) alias, que el motor escribe solo si computeAliasInFoundation =
        oxygen.stage.stateCalculation.aliasEnabled (SparkStateCalculator.scala:66-67; FoundationStateCalculator.scala:103-105):
        el valor vigente en el conf de State Calculation de Colombia es un hecho del fork (en el conf local es true,
        statecalc-application-local.conf:26-27,34); (2) CALCULATED «return field.fechaDigitacion» con un DERIVED fechaDigitacion
        declarado antes (el `field` del script es el registro Foundation, no el evento curado: FoundationStateCalculator.scala:52-63,
        FoundationFunctions.scala:43-49): depende de Nashorn [A:OQ-TR-2]. Se prefiere (1). Sin el hecho verificado no se genera.
      fuente: "spec §13 fila fechaEncuesta («epoch ms (nulo si no viene)»), §10.1 fila Fec_digitacion, §10.4; HU R-05, R-06, §5.6 «Fecha de encuesta ausente»; source-spec-curation.yaml destino fechaDigitacion (largo)"

    - campo_xpm_destino: "fechaModificacion"
      campo_curado_sisben_origen: "fechaActualizacionCns"
      nombre_en_foundation: "fechaActualizacionCns, con alias fechaModificacion [A:PA-013]"
      tipo_foundation: "DERIVED + aliases [\"fechaModificacion\"] (propuesto)"
      valor_calculated: ""
      dataType: "LONG"
      transformacion: >
        Passthrough del epoch ms de fec_actualizacion_cns (la As-Of-Date, R-07): obligatoria con sev. 1, así que nunca es nula
        en un evento aceptado (spec §3 fila 22). LONG = Try(value.toDouble.toLong) (CalculationUtils.scala:35); un epoch ms
        (< 2^53) no pierde precisión. Ojo: no es lo mismo que asOfPeriod (el periodo del evento sintetizado, que depende del
        dateType de Synthesis, VD-SYN de RG-026); por eso se toma el campo curado y no el campo base.
      nivel_confianza: "B"
      estado: "[A:PA-013]"
      nota: "Mismo mecanismo y misma dependencia que fechaEncuesta (alias con aliasEnabled del fork; CALCULATED con Nashorn [A:OQ-TR-2])"
      fuente: "spec §13 fila fechaModificacion («epoch ms»), §3 fila 22 y guard-rails, §10.1 fila fec_actualizacion_cns; HU R-07; source-spec-curation.yaml destino fechaActualizacionCns (largo)"

    - campo_xpm_destino: "(ninguno: soporte del filtro del corte vigente, no es atributo de #sisben)"
      campo_curado_sisben_origen: "fechaCorte"
      nombre_en_foundation: "fechaCorte"
      tipo_foundation: "DERIVED"
      valor_calculated: ""
      dataType: "LONG"
      transformacion: "Epoch ms del último día del periodo AAAAMM del nombre del archivo (spec §10.1; HU §5.3 «Fecha de corte y tipo de archivo»). El enricher solo ve los campos declarados en Foundation (FoundationStateCalculator.scala:43-75), por eso (c1) lo necesita en fields[]"
      nivel_confianza: "B"
      estado: "[A:PA-002]"
      nota: "Solo se declara si el PO elige (c1). No va a select: spec §13 no lo lista como atributo de #sisben"
      fuente: "spec §10.1 fila (nombre del archivo) fechaCorte, §10.3; HU R-26; PA-002; source-spec-curation.yaml destino fechaCorte"

  pendientes_del_mapeo:
    - id: 1
      descripcion: "fechaEncuesta y fechaModificacion: verificar en el fork aliasEnabled del conf de State Calculation de Colombia (PA-013 propuesta, punto 1). Con true, pasan a nivel A como DERIVED con alias; con false, la alternativa CALCULATED espera [A:OQ-TR-2]"
      estado: "[A:PA-013]"
    - id: 2
      descripcion: "fechaCorte: se declara solo si PA-002 se cierra con (c1)"
      estado: "[A:PA-002]"
    - id: 3
      descripcion: "Nombres ya declarados en los JSON de Foundation compartidos de Colombia (fechaCorte, fechaDigitacion, fechaActualizacionCns, nivelSisben… con otro dataType) y el `domain` del archivo: un nombre duplicado con otro dataType cambiaría el valor que ve otra fuente (PA-013 propuesta, punto 3)"
      estado: "[PM]"

# ═════════════════════════════════════════════════════════════
# Instrucción de generación — Foundation (ART-071)
# ═════════════════════════════════════════════════════════════

instruccion_generacion_foundation:
  archivo: "statecalc-foundation-local.json (propuesta en propuestas/statecalc/; se integra en el JSON de Foundation de Colombia o como archivo adicional de paths.foundationConfigurations, que es una lista: logica-statecalc.md §4.1)"
  seccion: "fields[]"
  contenido_a_escribir:
    regla: >
      Solo campos nivel_confianza A. DERIVED implícito: en el JSON se omite la clave `type` y no se escribe `value` (DERIVED
      lee por `name`, FoundationFunctions.scala:24-35). dataType solo si no es STRING. Nunca dataSource, subscriber,
      subscriberRelation, asOfPeriod, pin ni parentEventIds (los inyecta el motor, FoundationStateCalculator.scala:46-51).
      Sin comentarios en el JSON.
    campos_a_generar:
      - name: "grupoSisben"
        type: "DERIVED"
      - name: "nivelSisben"
        type: "DERIVED"
        dataType: "INTEGER"
      - name: "codDepartamentoSisben"
        type: "DERIVED"
      - name: "codMunicipioSisben"
        type: "DERIVED"
    campos_excluidos_hasta_resolver:
      - "fechaDigitacion con aliases [fechaEncuesta], dataType LONG — PA-013 propuesta, punto 1 (aliasEnabled); alternativa CALCULATED [A:OQ-TR-2]"
      - "fechaActualizacionCns con aliases [fechaModificacion], dataType LONG — PA-013 propuesta, punto 1; alternativa CALCULATED [A:OQ-TR-2]"
      - "fechaCorte, dataType LONG — PA-002 (solo con la opción c1)"
    advertencia: >
      ART-071 con 4 de 6 atributos no habilita la sección: ART-072 no se genera con este insumo
      (instruccion_generacion_calculation). El `domain` del archivo es el de Colombia si se integra en el JSON compartido
      (PA-013 propuesta, punto 3) [PM]; si se entrega como archivo aparte, la skill lo propone y lo declara [P].
    estado: "[C] para los 4 campos de campos_a_generar; [A:PA-013] / [A:PA-002] los excluidos"

# ═════════════════════════════════════════════════════════════
# Instrucción de generación — Calculation (ART-072)
# ═════════════════════════════════════════════════════════════

instruccion_generacion_calculation:
  archivo: "statecalc-calculation-local.json"
  seccion: "calculations[]"
  contenido_a_escribir:
    regla: "una CalculationSection con groupBy PLANO (nunca grouping.groupBy anidado); en este insumo: NO GENERAR"
    generar: false
    motivo_no_generar: >
      Una sección sin filtro produce un dato erróneo visible al cliente (N4): el registro Foundation de un PIN de Colombia
      mezcla eventos de todas las fuentes (FoundationStateCalculator.scala:37-51) y MOST_RECENT_VALUE toma el más reciente
      de cualquiera (MostRecentValue.scala:20-24); con un PIN sin SISBEN vigente la sección sale igual. Los dos filtros
      necesarios (fuente y corte vigente) dependen de PA-002, [A:OQ-TR-2] y [A:CQ-006]; el nombre y la forma, de PA-012
      (propuesta); fechaEncuesta y fechaModificacion de select, de PA-013 (propuesta).
    valor_resultante: null
    campos_select_pendientes_de_agregar:
      - "grupoSisben, nivelSisben, codDepartamentoSisben, codMunicipioSisben (nivel A en Foundation; esperan el filtro)"
      - "fechaEncuesta, fechaModificacion (alias; PA-013 propuesta)"
    estado: "[A:PA-002] · [A:OQ-TR-2] · [A:CQ-006] · [A:PA-012] · [A:PA-013]"

  propuesta_sujeta_a_decision:
    nota: "NO es instrucción de generación. Es la sección que resultaría de cerrar PA-002 con (c1) recomendada y PA-012 con las propuestas de abajo; se deja para que el PO vea qué aprueba"
    name: "sisben"                                  # [A:PA-012] (a): ¿la clave literal es «sisben» o «#sisben»?
    description: "Sección #sisben del XPM (spec §13): clasificación Sisbén IV del corte vigente"   # [P]
    type: "MOST_RECENT_VALUE"                       # [P] decision_formato
    select: ["grupoSisben", "nivelSisben", "fechaEncuesta", "fechaModificacion", "codDepartamentoSisben", "codMunicipioSisben"]   # [C] spec §13; fechaEncuesta/fechaModificacion [A:PA-013]
    groupBy: []                                     # [A:PA-012] (b): objeto único por PIN (sin groupBy) o lista por subscriberRelation
    where: "return field.isSisbenCorteVigente == true"   # [A:PA-002] (c1) + [A:OQ-TR-2] (Nashorn); el flag lo pone el enricher
    enabled: true
    transient: false
    efecto_sin_registros: "Si ningún registro cumple el where, la sección vale null, no se omite (QueryFunctions.scala:61; CalculationStateCalculator.scala:146-163, :92-99). [A:PA-012] (c): ¿«no tiene sección» (HU §5.6) se cumple con el valor nulo?"

  nota_sobre_passthrough_directo:
    descripcion: >
      El passthrough (spec §13) no necesita un FoundationStateEnrichmentProcessor ni un CustomOnSectionProcessor para los 6
      atributos. Lo que sí necesita lógica fuera de la configuración es R-26 (corte vigente): ver propuesta_pa_002.
      El enricher por defecto del motor es un no-op (DefaultFoundationStateEnrichmentProcessor.scala:11) y se fija en el código
      de la App, no por configuración (StateCalcApp.scala:15) [C].
    estado: "[C]"
