# ═════════════════════════════════════════════════════════════
# PA-002 — Propuesta con evidencia del motor (la decide el PO)
# ═════════════════════════════════════════════════════════════

propuesta_pa_002:
  pregunta: "PA-002 (abierta, bloqueante para state_calculation): ¿cómo se determina el corte vigente de SISBEN y cómo se excluye #sisben de los PIN cuyo último evento SISBEN no pertenece a ese corte (HU R-26, §5.6)?"
  datos_de_entrada:
    - "Cada archivo REGULAR es la foto completa del corte (spec §1, §10.3; HU R-02). collection-stock vuelve a curar todos los cortes acumulados: el input de State Calculation trae eventos SISBEN de todos los cortes aceptados [C] (antecedente del expediente)"
    - "Synthesis agrupa por periodo y por subscriber+subscriberRelation, ordena por (asOfDate, receivedDate) y LFP deja el último valor no nulo (ConsistencyCheckOps.scala:111-118, :179-181; EventSynthesizer.scala:110-116). Un PIN ausente del corte vigente conserva eventos sintetizados de cortes anteriores, con su fechaCorte [C]"
    - "El input de State Calculation es synthesizedDir/*/* completo: un SyntheticEvents por PIN con los eventos de todas las fuentes (StateCalcIOUtils.scala:174-177; SparkStateCalculator.scala:205-217) [C]"

  opcion_d_el_motor_ya_lo_cumple:
    veredicto: "DESCARTADA con evidencia de código. El motor no tiene un filtro por corte vigente en State Calculation"
    evidencia:
      - "Foundation solo excluye eventos con curatedRecordJson.isVisible == false (FoundationStateCalculator.scala:37-42). SISBEN no publica isVisible (spec §10.1 es la lista completa) y Synthesis solo lo escribe con custom rules o migración (CustomRuleChecker.scala:158-178; VisibilityChecker.scala:137-155; RelationshipMigrationChecker.scala:106,163)"
      - "numberOfPeriods es takeRight(n) sobre los registros del PIN (CalculationFunctions.scala:28-30): relativo al propio PIN, no a un corte global. Un PIN solo presente en 202512 conserva su registro"
      - "MOST_RECENT_VALUE elige el registro de mayor recentBy (asOfPeriod por defecto) entre los del PIN (MostRecentValue.scala:16-29): también relativo al PIN"
      - "El enricher por defecto no hace nada (DefaultFoundationStateEnrichmentProcessor.scala:11) y la App lo fija en código (StateCalcApp.scala:15)"
      - "El borrado inferido V2 (voidIndicator) vive en Synthesis, solo con checkFileTagEnabled = true y Process Management (SparkConsistencyChecker.scala:75-130; HCUtil.scala:76-88, :125-129); voidIndicator no es campo inyectado del GDD (DomainDictionaryInternal.scala:98-104), así que no llega al evento sintetizado si el GDD no lo declara (EventSynthesizer.scala:110-116), y State Calculation no lo filtra (AUD-E0-07). Activarlo cambia Synthesis y su conf compartido: fuera de alcance sin versión nueva de HU/spec (PA-002; spec §12; RG-026)"
      - "Un `where` solo ve un registro a la vez (QueryFunctions.scala:49-63) y el enricher solo los registros de un PIN (FoundationStateCalculator.scala:75; FoundationStateEnrichmentProcessor.scala:10): ninguno conoce el máximo fechaCorte del conjunto sin que se lo inyecten"

  opcion_c1_filtro_en_el_enricher:
    veredicto: "RECOMENDADA [P]. Es la única opción compatible con las fuentes vigentes. Toca [A:CQ-006] (código propio en el enricher) y necesita [A:OQ-TR-2] (where Nashorn)"
    mecanismo:
      corte_vigente: >
        Máximo fechaCorte entre los eventos SISBEN (dataSource = DNP y subscriber = 999722, spec §1) del input de la corrida
        [P]. Equivale al «corte del último archivo aceptado»: un archivo rechazado por Acceptance no deja eventos curados
        (HU R-22; spec RQ-03) y collection-stock re-cura todos los cortes aceptados. Se calcula UNA vez por corrida (una
        agregación sobre el input antes de Foundation) y se inyecta en el enricher al construirlo; el enricher no puede
        calcularlo porque solo recibe los registros de un PIN. La App y el motor de la corrida de Colombia son del fork
        (PA-013 propuesta, punto 2) [PM].
      marca: >
        El enricher de Colombia agrega isSisbenCorteVigente = true a los registros Foundation con dataSource = DNP,
        subscriber = 999722 y fechaCorte = corte vigente; no borra registros (los usan las demás secciones del XPM) [P].
        Flag aditivo por ingesta, patrón de steering 07 §5.7 («flag aditivo por ingesta (patrón isSisben)»). Se nombra
        isSisbenCorteVigente para no chocar con un isSisben que ya exista en el fork (PA-013 propuesta, punto 2).
      calculo: "La sección #sisben filtra con where «return field.isSisbenCorteVigente == true» (Nashorn, [A:OQ-TR-2]): resuelve a la vez el filtro por fuente y el del corte (propuesta_sujeta_a_decision)"
      foundation: "fechaCorte DERIVED LONG en fields[] para que el enricher lo lea (mapeo_campos)"
      seguridad: "El enricher no registra valores en logs WARN/ERROR (steering 07 §5.7; 08 §3 S4); los 6 atributos y fechaCorte son públicos (spec §10.1)"
    efecto_en_los_escenarios_hu_5_6:
      - "Sección generada: el PIN del corte vigente tiene su registro SISBEN marcado y MOST_RECENT_VALUE lo proyecta [P]"
      - "Persona que ya no aparece: ningún registro marcado → la sección vale null ([A:PA-012] (c)) [P]"
      - "Fecha de encuesta ausente: fechaEncuesta null y la sección sale (mapeo_campos) [C], con el residual de PA-011 (riesgos_nuevos R-SC-2)"
      - "Consulta en Data Provisioning: prueba CA1 (criterios_aceptacion) [PM]"
    limites:
      - "Un PIN cuyo registro del corte vigente cae en el mismo periodo de Synthesis que uno anterior con asOfDate mayor queda con el fechaCorte anterior (LFP por (asOfDate, receivedDate), ConsistencyCheckOps.scala:115-118) y se excluiría por error (riesgos_nuevos R-SC-1). Depende del dateType de Synthesis (VD-SYN de RG-026)"
      - "Necesita código Scala en el fork (enricher y cálculo del corte vigente), que ninguna skill del framework genera: es una decisión de alcance del PO (edf-statecalc SKILL.md; decisiones-pendientes.md §5)"
    alternativas_dentro_de_c1_no_recomendadas:
      - "Corte vigente desde metadatos del orquestador o una clave por corrida (último archivo aceptado): mismo resultado con más acoplamiento a hechos del fork y del DAG [P]"
      - "where con fecha relativa a la fecha de ejecución (p. ej. «corte ≥ hoy − N meses»): depende de cuándo corre el DAG; si el DNP se atrasa, #sisben desaparece para todos. Mismo defecto tiene una custom rule de Synthesis con duration relativa a env.CURRENT_DATE_TIME (CustomRuleChecker.scala:47-52) [P]"
      - "Borrar en el enricher los registros SISBEN no vigentes en lugar de marcarlos: igual necesita un filtro por fuente en la sección; el flag es aditivo y no altera lo que ven otras secciones [P]"

  fuera_de_pa_002_para_el_po:
    - "(e) Borrado inferido V2 en Synthesis (checkFileTagEnabled, eventTypeList, historicAttributeArgs, voidIndicator en el GDD y un where en State Calculation). Es el mecanismo del motor para «carga completa: si el dato no está en el último archivo, no se usa» (SparkConsistencyChecker.scala:75-79), pero cambia Synthesis y su conf compartido de Colombia y depende de que el fileTag de SISBEN no se comparta con otras fuentes (getLatestTimeForEachType toma una fecha por fileTag, :91-104). Solo con versión nueva de HU y spec (PA-002; HU §3 «Estabilidad de las reglas»)"

  hechos_que_solo_estan_en_el_fork:
    nota: "Sin ellos no se puede cerrar (c1) ni generar ART-072. La verificación diferida de references/03 §3e no aplica: ART-071/ART-072 dependen de ellos (§3e #1). Se proponen como PA-013"
    lista:
      - "App de State Calculation de Colombia y su enricher (clase, si ya marca fuentes con un flag tipo isSisben, cómo recibe un valor por corrida, si ya hay una agregación previa sobre el input)"
      - "aliasEnabled en el conf de State Calculation de Colombia"
      - "JSON de Foundation y Calculation de Colombia (familia statecalcAlpha-js-foundation-stage.json, steering 07 §5.7): domain, nombres ya declarados y su dataType, si ya usan where/CALCULATED (Nashorn) y la versión de Java con la que corre (el motor InnerSource exige JDK 11, migrate.md:12-16)"
      - "Cómo se serializa una sección null en el XPM y en HBase (XpmEventDAO) y cómo la lee Data Provisioning (sección ausente frente a valor nulo)"
      - "dateType de Synthesis de Colombia (periodo de los eventos SISBEN), ya listado en VD-SYN de RG-026"

