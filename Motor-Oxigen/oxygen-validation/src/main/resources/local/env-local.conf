oxygen {
  application {
    lambda = batch
    storage = "text"
    historicAttributes = true
    paths {
      appName = "oxygen-is"
      userHome = "/data/example/"
      dataHome = "/data/example/discovery"
    }
    orchestration {
      paths {
          appHome = ${oxygen.application.paths.userHome}${oxygen.application.paths.separator}${oxygen.application.name}"-app"
          dataHome = [
            ${oxygen.application.paths.dataHome}"-data"
          ]
      }
    }
  }

}