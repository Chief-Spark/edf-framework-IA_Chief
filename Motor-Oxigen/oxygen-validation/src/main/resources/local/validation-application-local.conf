oxygen {
 application {
    lambda = "batch"
    paths {
      lookupHome = "example/lookup"
    }
  }

  stage {
    discovery {
      orchestration {
        source = ["/data/example/discovery"]
        target = ["/data/example/discovered"]
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
    }
    validation {
      discover = true
      orchestration {
        source = ["/data/example/discovery"]
        target = ["/data/example/validatedOutput"]
      }
      paths {
        validationDir = "/data/example/discovery"
        validatedDir = "/data/example/validatedOutput"
        discoverPath = "/data/example/discovery"
      }
      configs = [
        {
          fullScanSchema = false
          filePattern = ".*-.*\\..+\\.T"
          dupKeyCheckEnabled = true
          processor = "com.experian.edf.oxygen.validation.extension.CreditEventValidationProcessor"
          searchAllHeaderFooter = true
          historicAttributeArgs = "{\"size\":1,\"status\":\"status:SUCCESS\"}"
          validate = [
            {
              filePattern = ".*A-.*\\..+\\.T"
              fileName = "(errorcodeNotIn(\"F1003\"))"
              header = "((errorcodeNotIn(\"H1001\")) or count(errors) > 2)"
              footer = "(errorcodeNotIn(\"F1003\"))"
              contexual {
                qualification = "errorcodeNotIn(\"1004\") and errorcodeIn(\"1001\") and (0.3*qs1 + 0.6*qs2) > 3 and (errorcodeIn(\"1000\")) and count(errors)>2"
                enabled = true
                version = "v3"
              }
            },
            {
              filePattern = ".*B-.*\\..+\\.T"
              fileName = "(errorcodeNotIn(1001))"
              header = "((errorcodeNotIn(\"H1001\")) or count(errors) > 2)"
              #footer = ""
              footer = "(errorcodeNotIn(\"F1003\"))"

              contexual {
                qualification = "errorcodeNotIn(\"1004\") and errorcodeIn(\"1001\") and (0.3*qs1 + 0.6*qs2) > 3 and (errorcodeIn(\"1000\")) and count(errors)>2"
                enabled = false
                version = "v3"
              }
            },
            {
              fileName = "(errorcodeNotIn(\"N1001\"))"
              header = "((errorcodeNotIn(\"H1001\")) or count(errors) > 2)"
              footer = "(errorcodeNotIn(\"F1003\"))"
              contexual {
                qualification = ""
                enabled = true
                version = "v3"
              }
            }
          ]
          metrics = [
            {
              filePattern = ".*A-.*\\..+\\.T"
              file = [
                {
                  metricId = "AverageOfQualityscore"
                  metricExpr = "average(\"qs.qualityscore1\")"
                },
                {
                  metricId = "sumOfMissingFields"
                  metricExpr = "sum(\"qs.missingfields\")/count(*)"
                }
              ]
              #"average(\"qs.qualityscore1\"),average(\"validatedRecordJson.debtBalance\"), sum(\"qs.missingfields\")/count(*),duplicates(\"qs.transactionid\"),min(\"qs.transactionid\"),max(\"qs.transactionid\")"
              #header = "(if(sum(\"AC_QS1\") == min(\"FQS1\")) warning \"Error code 1\"),(if(sum(\"AC_QS2\") == min(\"FQS2\")) warning \"Error code 3\")"
              #footer = "(if(sum(\"qs.AC_QS1\") == min(\"qs.FQS1\")) warning \"Error code 1\"),(if(sum(\"qs.AC_QS2\") == min(\"qs.FQS2\")) warning \"Error code 3\")"
            },
            {
              file = [
                {
                  metricId = "CountIdType"
                  metricExpr = "sum(\"qs.idNumberPresent\")"
                },
                {
                  metricId = "AverageOfQualityscore"
                  metricExpr = "average(\"qs.qualityscore1\")"
                },
                {
                  metricId = "30MoraCount"
                  metricExpr = "sum(\"qs.30Mora\")"
                },
                {
                  metricId = "60MoraCount"
                  metricExpr = "sum(\"qs.60Mora\")"
                },
                {
                  metricId = "90MoraCount"
                  metricExpr = "sum(\"qs.90Mora\")"
                },
                {
                  metricId = "120MoraCount"
                  metricExpr = "sum(\"qs.120Mora\")"
                }

              ]
              #file = "average(\"qs.qualityscore1\"),average(\"validatedRecordJson.debtBalance\"), sum(\"qs.missingfields\")/count(*),duplicates(\"qs.transactionid\"),min(\"qs.transactionid\"),max(\"qs.transactionid\")"
              #header = "(if(sum(\"AC_QS1\") == min(\"FQS1\")) warning \"Error code 1\"),(if(sum(\"AC_QS2\") == min(\"FQS2\")) warning \"Error code 3\")"
              #footer = "(if(sum(\"qs.AC_QS1\") == min(\"qs.FQS1\")) warning \"Error code 1\"),(if(sum(\"qs.AC_QS2\") == min(\"qs.FQS2\")) warning \"Error code 3\")"
            }
          ]
        },
        {
          filePattern = ".*X-.*\\..+\\.T"
          processor = "com.experian.edf.oxygen.validation.extension.CreditEventValidationProcessor"
          validate = [
            {
              filePattern = ".*A-.*\\..+\\.T"
              fileName = "(errorcodeNotIn(1001))"
              header = "((errorcodeNotIn(\"H1001\")) or count(errors) > 2)"
              #footer = ""
              contexual {
                qualification = "errorcodeNotIn(\"1004\") and errorcodeIn(\"1001\") and (0.3*qs1 + 0.6*qs2) > 3 and (errorcodeIn(\"1000\")) and count(errors)>2"
                enabled = true
                version = "v3"
              }
            },
            {
              filePattern = ".*B-.*\\..+\\.T"
              fileName = "(errorcodeNotIn(1001))"
              header = "((errorcodeNotIn(\"H1001\")) or count(errors) > 2)"
              #footer = ""
              contexual {
                qualification = "errorcodeNotIn(\"1004\") and errorcodeIn(\"1001\") and (0.3*qs1 + 0.6*qs2) > 3 and (errorcodeIn(\"1000\")) and count(errors)>2"
                enabled = true
                version = "v3"
              }
            },
            {
              fileName = "(errorcodeNotIn(1001))"
              header = "((errorcodeNotIn(\"H1001\")) or count(errors) > 2)"
              #footer = ""
              contexual {
                qualification = "errorcodeNotIn(\"1004\") and errorcodeIn(\"1001\") and (0.3*qs1 + 0.6*qs2) > 3 and (errorcodeIn(\"1000\")) and count(errors)>2"
                enabled = true
                version = "v3"
              }
            }
          ]
          metrics = [
            {
              filePattern = ".*A-.*\\..+\\.T"
              file = [
                {
                  metricId = "AverageOfQualityscore"
                  metricExpr = "average(\"qs.qualityscore1\")"
                },
                {
                  metricId = "sumOfMissingFields"
                  metricExpr = "sum(\"qs.missingfields\")/count(*)"
                }
              ]
              #"average(\"qs.qualityscore1\"),average(\"validatedRecordJson.debtBalance\"), sum(\"qs.missingfields\")/count(*),duplicates(\"qs.transactionid\"),min(\"qs.transactionid\"),max(\"qs.transactionid\")"
              #header = "(if(sum(\"AC_QS1\") == min(\"FQS1\")) warning \"Error code 1\"),(if(sum(\"AC_QS2\") == min(\"FQS2\")) warning \"Error code 3\")"
              #footer = "(if(sum(\"qs.AC_QS1\") == min(\"qs.FQS1\")) warning \"Error code 1\"),(if(sum(\"qs.AC_QS2\") == min(\"qs.FQS2\")) warning \"Error code 3\")"
            },
            {
              file = [
                {
                  metricId = "AverageOfQualityscore"
                  metricExpr = "average(\"qs.qualityscore1\")"
                },
                {
                  metricId = "sumOfMissingFields"
                  metricExpr = "sum(\"qs.missingfields\")/count(*)"
                }
              ]
              #"average(\"qs.qualityscore1\"),average(\"validatedRecordJson.debtBalance\"), sum(\"qs.missingfields\")/count(*),duplicates(\"qs.transactionid\"),min(\"qs.transactionid\"),max(\"qs.transactionid\")"
              #header = "(if(sum(\"AC_QS1\") == min(\"FQS1\")) warning \"Error code 1\"),(if(sum(\"AC_QS2\") == min(\"FQS2\")) warning \"Error code 3\")"
              #footer = "(if(sum(\"qs.AC_QS1\") == min(\"qs.FQS1\")) warning \"Error code 1\"),(if(sum(\"qs.AC_QS2\") == min(\"qs.FQS2\")) warning \"Error code 3\")"
            }
          ]
        }
      ]
    }
  }
  lookups = []
  features {
    enable{
        defaultOutputStructure = false
    }
  }
}
