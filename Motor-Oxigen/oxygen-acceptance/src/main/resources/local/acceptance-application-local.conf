oxygen {
  stage {
    validation {
      paths {
        # Input
        #Local
        validationDir = "example/test-workspace/validation"

        #Docker
        #validationDir = "/data/example/test-workspace/validation"

      }
    }
    acceptance {

      paths {
        # Output
        #Local
        acceptedDir = "example/test-workspace/accepted"
        rejectedDir = "example/test-workspace/rejected"

        #Docker
        #acceptedDir = "/data/example/test-workspace/accepted"
        #rejectedDir = "/data/example/test-workspace/rejected"
       }

      datasetFormat {
        input = text
        output = text
      }

      configs = [
        {
          managerStoreEnabled = true
          # For Credit Master File
          filePattern = ".*E-.*\\..+\\.T"
          fileActions {
            reject = false
            accept = true #or isEmptyBodyFile"
          }
          recordAcceptance = true #"(qs1 > 60.0)" #true # "errorcodeNotIn(\"OxygenDuplicate\")"
          contextualOverride {
            inferDelete {
              enabled = true
              lookBackPeriod = 6
              deletePredicates = [["subscriber, subscriberRelation"]]
            }
          }

        },
        {
          # For For Sample X file
          filePattern = ".*X-.*\\..+\\.T"
          fileActions {
            reject = false
            accept = "(average(\"qs.qualityscore1\") > 90.0) or (externalAction(\"opsApproval\") == \"approved\" and externalAction(\"adminApproval\") == \"approved\")"
          }
          recordAcceptance = true
        },
        {
          # For For Sample X file
          filePattern = ".*[.xml]"
          fileActions {
            reject = false
            accept = "(average(\"qs.qualityscore1\") > 90.0) or (externalAction(\"opsApproval\") == \"approved\" and externalAction(\"adminApproval\") == \"approved\" )"
          }
          recordAcceptance = true
        },
        {
          # For ACPO005 file
          filePattern = ".*fileName=422_641425_ACPO005_02038232_62173620_20181026_001"
          fileActions {
            reject = false
            accept = true
          }
          recordAcceptance = true
          contextualOverride {
            inferDelete {
              enabled = true
              lookBackPeriod = 6
              deletePredicates = [["NrUnco"]]
            }
          }
        }
      ]
    }
  }
}