oxygen {
  application {
    storage = "text"
    paths {
      appName = "oxygen-is"
      userHome = "/Users/c80844b/Documents/InnersourceWorkspace/oxygen-acceptance/example/test-workspace/home"
# Uncomment lookupHome setting below and point to your oxygen-ri directory if you want to run RIApps in spark local mode
# using default configuration of RI.
# For Spark standalone mode the setting is available in maven exec goal in pom.xml via property ${lookup-home}.
#      lookupHome = "/CHANGE-ME to your oxygen-ri parent directory/oxygen-ri/src/dev/resources/config/default/lookup"
    }
    highFrequencyProperties {
      consumer {
        kafka.bootstrap.servers = "localhost:9092"
        key.deserializer = "org.apache.kafka.common.serialization.StringDeserializer"
        value.deserializer = "org.apache.kafka.common.serialization.StringDeserializer"
        auto.offset.reset = "latest"
      }
      producer {
        kafka.bootstrap.servers = "localhost:9092"
      }
      switchOverConsumer {
        group.id = "testGroup7"
        key.deserializer = "org.apache.kafka.common.serialization.StringDeserializer"
        value.deserializer = "org.apache.kafka.common.serialization.StringDeserializer"
        bootstrap.servers = "localhost:9092"
        kafka.bootstrap.servers = "localhost:9092"
      }
    }
    configs {
      hbase.bulkLoadDirectory = ${oxygen.application.paths.tempHome}${oxygen.application.paths.separator}"hbase"
      kafka {
        producer {
          bootstrap.servers = "localhost:9092"
        }
        consumer {
          bootstrap.servers = "localhost:9092"
        }
        loggerTopic {
          metricTopic = "oxygen-metrics"
          puTopic = "oxygen-process-update"
          consistencyTopic = "oxygen-consistency"
        }
      }
    }
#    generation {
#      candidate = candidate
#      reference = reference
#    }
  }
  features {
    enable {
      writeToSwitchOverConsumer = false
      defaultOutputStructure = false
    }
  }
}

