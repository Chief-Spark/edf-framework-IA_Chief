oxygen {
  application {
    lambda = batch
  }

  stage {
     consistencyCheck {

      paths {
             # Input - syntehtic events
             #synthesizedDir = /Users/c80844b/Documents/InnersourceWorkspace/oxygen-statecalculation/example/test/input
             synthesizedDir = /data/example/syntehtic-events-input/consistency
           }

     }
    stateCalculation {

        paths {
        # Input - syntehtic events
        #statecalcDir = /Users/c80844b/Documents/InnersourceWorkspace/oxygen-statecalculation/example/test/output
        statecalcDir = /data/example/output-demo
      }
      deltaModeAccountLevel = false   // default is false
      doesComputeXpm = true  // default is true
      doesArchive = true  // default is true
      foundationWithAlias = true
      aliasEnabled = true
      eventTrackingEnabled = true

      datasetFormat {
        input = text
        output = text
      }
      aliasEnabled = true
      eventTrackingEnabled = true
      paths {
        foundationConfigurations = ["local/statecalc-foundation-local.json"]
        calculationConfigurations = ["local/statecalc-calculation-local.json"]
        #lookupFiles = [{"name": "subscriberIndustryTbl", "file": ${oxygen.application.paths.lookupHome}/"statecalc/subscriber-industry.csv", "cache": "no"}]
      }
      appenders = [
//        {
//          name = "attributesEngine",
//          processor = "com.experian.edf.oxygen.statecalculation.extension.TestStateCalcProcessor"
//        },
//        {
//          name = "otherEngine",
//          processor = "com.experian.edf.oxygen.statecalculation.extension.TestStateCalcProcessor"
//        }
      ]
    #historicalData = {
    #  identifyingAttributes = ["identifications.counterpartyIdType", "identifications.dataSource"]
    #  historicalNumPeriods = 12
    #  historicalObjectName = scores
    #  historicalDataPaths = [
    #    "/Users/c17719a/Developer/experian/oxygen-ri/oxygen-ri-app/score.json"
    #  ]
    #}
    }

  }
  features {
    statecalc {
      outputFoundation = true #To write Foundation output - Defaulted to false - Will affect performance
      outputCalculation = true #To write Calculation Output - Defaulted to true
      additionalOutputFoundation = false
      attachHistorcData = false #To attach Historic data - Defaulted to false
      performCalculationEnrichment = true #To perform Calculation Enrichment, Eg: Attribute Engine - Defaulted to false
      performFoundationEnrichment = true #Perform Foundation Enrichment - Defaulted to true
      outputAsTSV = false # To write Output as TSV. - Defaulted to false
      pinGroupFilter = true
    }
  }

}