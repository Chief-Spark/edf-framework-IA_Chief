oxygen {
  application {
    lambda = batch
    paths {
      lookupHome = "s3://oxygen-innersource/c67099a-synthesis/lookup"
    }
  }
  stage {
    pinning {
      paths {
        # Custom input path
        pinnedDir = "s3://oxygen-innersource/c67099a-synthesis/input/pinned-input/"
      }
    }
    consistencyCheck {
      paths {
        # Custom output paths
        checkedDir = "s3://oxygen-innersource/c67099a-synthesis/output/checked"
        synthesizedDir = "s3://oxygen-innersource/c67099a-synthesis/output/synthesized"

        dictionaryFile = ["consistency-checks.json"]
        domainDictionaryFile = ["domain-dictionary.json"]
        #visibilityRulesFile=["visibility-rules.json"]
        customRulesFile=["custom-rules-empty.json"]
      }

      datasetFormat {
        input = text
        output = text
      }

      relationshipMigrationProcessorClassName = "com.experian.edf.oxygen.consistencycheck.extension.migration.RelationshipMigrationProcessorImpl"

      checkFileTagEnabled = false
      eventTypeList = ["sisben","jurad","judicial"]
      dateType = "receivedDate"
      historicAttributeArgs = "{\"status\":\"status:NOOP OR status:SUCCESS\",\"stage\":\"stage=Synthesis OR stage=Pinning\"}"

      // By default, writing synthesized TSV is disabled. To enable TSV write, the following parameter has to be set to true
      synthesisOutputAsTSV = false

      // By default, saving consistency info as avro file is enabled. To enable, the following parameter has to be set to true.
      saveConsistencyInfoToFile = true

      // By default, sending consistency info to kafka is disabled. To enable, the following parameter has to be set to true. Additionally,
      // kafka should also be enabled
      sendConsistencyInfoToKafka = false

      // "disableCategories" previously called "checkCategory" provides support to disable certain checks based the number
      // of accounts threshold
      disabledCategories = [
        {
          name = "crossAccounts"
          accountsThreshold = 100
        }
      ]
      // To limit the reference events to a certain period for consistency checks, following paramater can be used
      // referenceEventsWindowInMonths = 0

      // To switch on the delete inference
      // shouldFilterDeletedEvents = true
    }
  }
}