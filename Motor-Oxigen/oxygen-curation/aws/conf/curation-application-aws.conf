oxygen {
  application {
    lambda = "batch"
    paths {
      lookupHome = "s3://oxygen-innersource-test/demo-curation/lookup"
    }
  }
  stage {
    acceptance {
      paths {
        acceptedDir = "s3://oxygen-innersource-test/demo-curation/input/accepted-input"
      }
    }
    curation {
      paths {
        curatedDir = "s3://oxygen-innersource-test/demo-curation/output/output-demo"
      }

      # runMode options: stock, flow, or eventsync
      runMode = stock

      datasetFormat {
        input = text
        output = text
      }
      configs = [
        {
          filePattern = ".*E-.*\\..+\\.T"
          processor = "com.experian.edf.oxygen.curation.extension.processor.CreditCurationProcessorJson"
        },
        {
          filePattern = ".*X-.*\\..+\\.T"
          processor = "com.experian.edf.oxygen.curation.extension.processor.CreditCurationProcessorJson"
        }

      ]
    }
  }
  features {
    enable{
      changeFrequencyOnCuration = false
    }
  }
}