oxygen {
  lookups = [
    {
      tableName = "subscriber-industry"
      file = ${oxygen.application.paths.lookupHome}"/statecalc/subscriber-industry.csv"
      keys = [
        {
          index = "subscriberCode"
        }
      ]
    },
    {
      tableName = "DATA_CREDITO_SPECIAL_CASE"
      file = ${oxygen.application.paths.lookupHome}"/data_credito_special_case.csv"
      keys = [
        {
          index = "bureau_event"
        },
        {
          index = "bureau_event+incoming_event",
          caseSensitive = false
        }
      ]
    },
    {
      tableName = "consistencytable2"
      file = ${oxygen.application.paths.lookupHome}"/consistency-table1-creditcard.csv"
      keys = [
        {
          index = "incomingCreditCard+historicCreditCard"
        }
      ]
    },
    {
      tableName = "consistencytable1"
      file = ${oxygen.application.paths.lookupHome}"/consistency-table1-creditcard.csv"
      keys = [
        {
          index = "incomingCreditCard"
        },
        {
          index = "incomingCreditCard+historicCreditCard"
        },
        {
          index = "incomingCreditCard+historicCreditCard+newCard"
        }
      ]
    },
    {
      tableName = "consistencyfiltertable1"
      file = ${oxygen.application.paths.lookupHome}"/consistencyfiltertable1.csv"
      keys = [
        {
          index = "errorcode"
        },
        {
          index = "errorcode+errorvalue"
        },
        {
          index = "errorcode+errorvalue+value"
        }
      ]
    },
    {
      tableName = "consistency-table1-creditcard"
      file = ${oxygen.application.paths.lookupHome}"/consistency-table1-creditcard.csv"
      keys = [
        {
          index = "incomingCreditCard+historicCreditCard"
        }
      ]
    },
    {
     # processor = "com.experian.edf.oxon.lookup.ExampleLookupProcessor"
      tableName = "sampleTable2"
      file = ${oxygen.application.paths.lookupHome}"/consistency-table1-creditcard.csv"
      //      fileFormat = "json"
      keys = [
        {
          index = "nationalId"
        },
        {
          index = "nationalId+firstName"
        },
        {
          index = "firstName"
        }
      ]
    },
    {
      tableName = "backout_conditions"
      file = ${oxygen.application.paths.lookupHome}"/backout_conditions.csv"
      keys = [
        {
          index = "subscriber"
        },
        {
          index = "subscriber+subscriber_relation"
        }
      ]
    }
  ]
}