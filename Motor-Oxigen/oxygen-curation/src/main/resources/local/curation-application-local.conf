oxygen {
  application {
    lambda = "batch"
    paths {
     #lookupHome = "/data/example/lookup"
      lookupHome = "/Users/c70088a/Documents/innersource_curation/oxygen-curation/example/lookup"
    }
  }
  stage {
    acceptance {
      paths {
       # acceptedDir = "/data/example/accepted-input"
        acceptedDir = "/Users/c70088a/Documents/innersource_curation/oxygen-curation/example/accepted-input"
      }
    }
    curation {
      paths {
       #curatedDir = "/data/example/output-demo"
        curatedDir = "/Users/c70088a/Documents/innersource_curation/oxygen-curation/example/output-demo"
      }

      # runMode options: stock, flow, or eventsync
      runMode = stock

      datasetFormat {
        input = text
        output = text
      }
      configs = [
        {
          filePattern = ".*E-.*\\..+\\.T"
          processor = "com.experian.edf.oxygen.curation.extension.processor.CreditCurationProcessorJson"
        },
        {
          filePattern = ".*X-.*\\..+\\.T"
          processor = "com.experian.edf.oxygen.curation.extension.processor.CreditCurationProcessorJson"
        }
      ]
    }
  }
  features {
    enable{
      changeFrequencyOnCuration = false
    }
  }
}