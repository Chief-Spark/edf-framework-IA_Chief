oxygen {
  application {
    environment = dev
    name = ${oxygen.application.paths.appName}
    lambda = batch
    storage = text
    storeStorage = hbase
    entity = person
    dataPlatform = oxygen
    compression = snappy
    lambdaTestMode = true
    jsonSamplingRatio = 1.0
    pipelineId = default
    batchTableLoadMechanism = "hydrator"
    generation {
      candidate = default
      reference = default
      metadata {
        hfStartOffsetPath = ${oxygen.application.paths.candidateGenerationHome}"/metadata/offset/offset.json"
      }
    }
    orchestration {
      managedBy = markers
      properties {
        serviceUrl = ""
        markersHome = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}".markers"
      }
    }
    processManagement {
      managedBy = markers
      managerStoreUrl = "http://localhost:8081"
      agentUrl = ""
      devMode = true
      kafkaEnabled = false
      writeToFileEnabled = false
      pathToWrite = "/Users/c52558a/Documents/Oxygen/workspace/log"
    }
    configs {
      kafka {
        producer {
          key.serializer = "org.apache.kafka.common.serialization.StringSerializer"
          value.serializer = "org.apache.kafka.common.serialization.StringSerializer"
          enable.idempotence = false
          acks = "all"
        }
        consumer {
          key.deserializer = "org.apache.kafka.common.serialization.StringDeserializer"
          value.deserializer = "org.apache.kafka.common.serialization.StringDeserializer"
          max.poll.records = "1"
          enable.auto.commit = false
          auto.commit.interval.ms = 0
          group.id = "oxygen_pipeline"
          auto.offset.reset = "earliest"
          isolation.level = "read_committed"
        }
        loggerTopic {
          metricTopic = "oxygen-metrics"
          puTopic = "oxygen-process-update"
          serviceUpdates = "oxygen-service-updates"
          hfServiceUpdates = "oxygen-hf-service-updates"
          vleTriggerTopic = "oxygen-vle-triggers"
        }
      }
      hbase {
        namespace = "oxygen"
        namespaceWithEnvironment = ${oxygen.application.configs.hbase.namespace}":"${oxygen.application.environment}
        namespaceWithEnviromnmentAndGeneration = ${oxygen.application.configs.hbase.namespaceWithEnvironment}"_"${oxygen.application.generation.candidate}"_"${oxygen.application.entity}
        bulkLoadDirectory = ""
      }
    }
    paths {
      generator = "create"
      separator = "/"
      appName = "oxygen-ri"
      appHome = ${oxygen.application.paths.userHome}${oxygen.application.paths.separator}${oxygen.application.name}"-app"
      markersHome = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}".markers"
      cleanup = [
        ${oxygen.application.paths.markersHome}${oxygen.application.paths.separator}${oxygen.application.name}"-stateCalculated"
      ]
      lookupHome = ${oxygen.application.paths.userHome}${oxygen.application.paths.separator}${oxygen.application.name}"-lookup"
      keepTogetherHome = ${oxygen.application.paths.userHome}${oxygen.application.paths.separator}${oxygen.application.name}"-keep-together"
      keepApartHome = ${oxygen.application.paths.userHome}${oxygen.application.paths.separator}${oxygen.application.name}"-keep-apart"
      tempHome = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"temp",
      generationHome = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"generations"
      candidateGenerationHome = ${oxygen.application.paths.generationHome}${oxygen.application.paths.separator}${oxygen.application.generation.candidate}${oxygen.application.paths.separator}${oxygen.application.entity}
      referenceGenerationHome = ${oxygen.application.paths.generationHome}${oxygen.application.paths.separator}${oxygen.application.generation.reference}${oxygen.application.paths.separator}${oxygen.application.entity}
      dataHome = [
        ${oxygen.application.paths.userHome}${oxygen.application.paths.separator}${oxygen.application.name}"-data"
      ]
    }
    hydrator {
      schemaRepository {
        hbase {
          candidate {
            table = ${oxygen.application.configs.hbase.namespaceWithEnvironment}"_"${oxygen.application.entity}"_schemas"
            generationKey = ${oxygen.application.generation.candidate}
          }
        }
      }
    }
  }
  stage {
    discovery {
      orchestration {
        source = [${oxygen.application.name}"-discovered"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_discovery"
        target = [${oxygen.application.name}"-discovered"]
      }
    }
    validation {
      discover = true
      checkpointLocation = ${oxygen.stage.validation.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"validated"
      orchestration {
        source = [${oxygen.application.name}"-discovered"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_discovery"
        target = [${oxygen.application.name}"-validated"]
        error = ${oxygen.application.name}"-error"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      contextualValidationFormat = ${oxygen.application.storage}
      runDuration = -1
      paths {
        validationDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"validation"
        checkpointBaseLocation = ${oxygen.stage.validation.paths.validationDir}${oxygen.application.paths.separator}"hf-checkpoint"
        checkpointLocation = ${oxygen.stage.validation.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"validated"
        alreadyValidatedDir = ${oxygen.stage.validation.paths.validationDir}${oxygen.application.paths.separator}".alreadyvalidated"
        logsDir = ${oxygen.stage.validation.paths.validationDir}${oxygen.application.paths.separator}"logs"
        validatedDir = ${oxygen.stage.validation.paths.validationDir}${oxygen.application.paths.separator}"validated"
        currentlyValidatingDir = ${oxygen.stage.validation.paths.validationDir}${oxygen.application.paths.separator}".currentlyvalidating"
        processedDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"processed"
        processedDatahomeDir = ${oxygen.stage.validation.paths.processedDir}${oxygen.application.paths.separator}"datahome"
        processedValidatedDir = ${oxygen.stage.validation.paths.processedDir}${oxygen.application.paths.separator}"validated"
        processedAcceptedDir = ${oxygen.stage.validation.paths.processedDir}${oxygen.application.paths.separator}"accepted"
      }
    }
    acceptance {
      source = "hf-oxygen-default-validated"
      targetAccepted = "hf-oxygen-default-accepted"
      kafkaPartitions = 1
      kafkaPartitionKeys = "default"
      checkpointLocation = ${oxygen.stage.acceptance.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"acceptance"
      checkpointLocationAccepted = ${oxygen.stage.acceptance.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"accepted"
      checkpointLocationRejected = ${oxygen.stage.acceptance.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"rejected"
      orchestration {
        source = [${oxygen.application.name}"-validated"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_validation"
        target = [${oxygen.application.name}"-accepted", ${oxygen.application.name}"-analyticsAccepted"]
      }
      paths {
        acceptanceDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"acceptance"
        acceptedDir = ${oxygen.stage.acceptance.paths.acceptanceDir}${oxygen.application.paths.separator}"accepted"
        rejectedDir = ${oxygen.stage.acceptance.paths.acceptanceDir}${oxygen.application.paths.separator}"rejected"
        checkpointLocation = ${oxygen.stage.acceptance.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"acceptance"
        lambdasyncData = ${oxygen.stage.acceptance.paths.acceptanceDir}${oxygen.application.paths.separator}"lambda-sync"${oxygen.application.paths.separator}"data"
        lambdasyncOffset = ${oxygen.stage.acceptance.paths.acceptanceDir}${oxygen.application.paths.separator}"lambda-sync"${oxygen.application.paths.separator}"offset"${oxygen.application.paths.separator}"offset.json"
        lambdasyncCheckpoint = ${oxygen.stage.acceptance.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"lambda-sync"
        rejectedFilesDir = ${oxygen.stage.acceptance.paths.rejectedDir}${oxygen.application.paths.separator}"files"
        rejectedRecordsDir = ${oxygen.stage.acceptance.paths.rejectedDir}${oxygen.application.paths.separator}"records"
        checkpointBaseLocation = ${oxygen.stage.acceptance.paths.acceptanceDir}${oxygen.application.paths.separator}"hf-checkpoint"
        acceptedCheckpointLocation = ${oxygen.stage.acceptance.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"accepted"
        rejectedCheckpointLocation = ${oxygen.stage.acceptance.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"rejected"
        logs = ${oxygen.stage.acceptance.paths.acceptanceDir}${oxygen.application.paths.separator}"logs"
      }
      stores {
        acceptedEventsTableName = "accepted-events"
        acceptedEventsLoadMechanism = ${oxygen.application.batchTableLoadMechanism}
        acceptedEventsFQ = ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.acceptance.stores.acceptedEventsTableName}
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
    }
    curation {
      runMode = stock
      enableSSRWrite = false
      checkpointLocation = ${oxygen.stage.curation.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"curated"
      orchestration {
        source = [${oxygen.application.name}"-accepted"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_acceptance"
        target = [${oxygen.application.name}"-curated", ${oxygen.application.name}"-analyticsCurated"]
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      paths {
        curationDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"curation"
        checkpointBaseLocation = ${oxygen.stage.curation.paths.curationDir}${oxygen.application.paths.separator}"hf-checkpoint"
        curatedDir = ${oxygen.stage.curation.paths.curationDir}${oxygen.application.paths.separator}"curated"
        curatedStockDir = ${oxygen.stage.curation.paths.curatedDir}${oxygen.application.paths.separator}"stock"
        curatedFlowDir = ${oxygen.stage.curation.paths.curatedDir}${oxygen.application.paths.separator}"flow"
        curatedSSRDir = ${oxygen.stage.curation.paths.curationDir}${oxygen.application.paths.separator}"curated-ssr"
        curatedSSRStockDir = ${oxygen.stage.curation.paths.curatedSSRDir}${oxygen.application.paths.separator}"stock"
        curatedSSRFlowDir = ${oxygen.stage.curation.paths.curatedSSRDir}${oxygen.application.paths.separator}"flow"
        archivedDir = ${oxygen.stage.curation.paths.curationDir}${oxygen.application.paths.separator}"archived"
        logsDir = ${oxygen.stage.curation.paths.curationDir}${oxygen.application.paths.separator}"logs"
        lambdaSync {
          dataSource = ${oxygen.stage.acceptance.paths.lambdasyncData}
          offsetSource = ${oxygen.stage.acceptance.paths.lambdasyncOffset}
          dataTarget = ${oxygen.stage.curation.paths.curatedDir}${oxygen.application.paths.separator}"hf-flow"
          lambdasyncMetadata = ${oxygen.stage.curation.paths.curationDir}${oxygen.application.paths.separator}"lambdasync-metadata"
          offsetTarget = ${oxygen.stage.curation.paths.lambdaSync.lambdasyncMetadata}${oxygen.application.paths.separator}"offset"${oxygen.application.paths.separator}"offest.json"
          syncMetadata = ${oxygen.stage.curation.paths.lambdaSync.lambdasyncMetadata}${oxygen.application.paths.separator}"sync-metadata"
          syncArchived = ${oxygen.stage.curation.paths.lambdaSync.lambdasyncMetadata}${oxygen.application.paths.separator}"sync-archived"
        }
      }
    }
    vle {
      orchestration {
        source = [${oxygen.application.paths.appName}"-stateCalculated"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_calculated"
        target = ${oxygen.application.paths.appName}"-xpmOutput"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      partitionCount = 200
      paths {
        sourceDirectory = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"*-pin-unpinned-celebrity-events"
        vleDir = ${oxygen.application.paths.candidateGenerationHome}${oxygen.application.paths.separator}"vle"
        vleDirPartitioned = ${oxygen.stage.vle.paths.vleDir}${oxygen.application.paths.separator}"partitioned"
        archivedDir = ${oxygen.stage.vle.paths.vleDir}${oxygen.application.paths.separator}"archived"
      }
    }
    eventsync {
      lambdaAccepted {
        topic = ${oxygen.stage.acceptance.targetAccepted},
        targetPath = ${oxygen.stage.acceptance.paths.lambdasyncData},
        format = text,
        offsetLocation = ${oxygen.stage.acceptance.paths.lambdasyncOffset},
        checkpointLocation = ${oxygen.stage.acceptance.paths.lambdasyncCheckpoint}
        syncInterval = 60
        enabled = false
      }
    }
    metrics {
      paths{
        checkpointLocation = ${oxygen.stage.validation.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"metrics"
      }
    }
    analyticsCurated {
      monthsOfHistory = 24
      orchestration {
        source = [${oxygen.application.name}"-analyticsCurated"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_analyticsCurated"
        target = [${oxygen.application.name}"-analyticsCuratedCompleted"]
      }
      paths {
        analyticsCuratedDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"analytics"${oxygen.application.paths.separator}"curation"${oxygen.application.paths.separator}"curated"
        analyticsCuratedArchiveDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"analytics"${oxygen.application.paths.separator}"curation"${oxygen.application.paths.separator}"archived"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
    }
    analyticsValidated {
      runMode = flow
      multipleSubscriber = false
      orchestration {
        source = [${oxygen.application.name}"-analyticsAccepted"] # , ${oxygen.application.name}"-validated/failed"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_analyticsAccepted"
        target = [${oxygen.application.name}"-analyticsAcceptedCompleted"]
      }
      paths {
        analyticsValidationDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"analytics"${oxygen.application.paths.separator}"validation"
        analyticsValidatedDir = ${oxygen.stage.analyticsValidated.paths.analyticsValidationDir}${oxygen.application.paths.separator}"validated"
        analyticsValidatedArchivedDir = ${oxygen.stage.analyticsValidated.paths.analyticsValidationDir}${oxygen.application.paths.separator}${oxygen.application.paths.separator}"archive"
        analyticsValidationOffsetDir = ${oxygen.stage.analyticsValidated.paths.analyticsValidationDir}${oxygen.application.paths.separator}"offset"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
    }
    dataExtraction {
      paths {
        dataExtractionDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"dataExtractionDir"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
    }
    backout {
      orchestration {
        source = [${oxygen.application.name}"-backout"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_backout"
      }
      paths {
        backoutDir = ${oxygen.stage.acceptance.paths.acceptanceDir}${oxygen.application.paths.separator}"backout"
        conditionaldDir = ${oxygen.stage.acceptance.paths.acceptedDir}${oxygen.application.paths.separator}"backout_conditional"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      conditionalExpression = ""
      runMode = "conditional"
    }
    pinning {
      checkpointLocation = ${oxygen.stage.pinning.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"pinned"
      entityType = ${oxygen.application.entity}
      filePattern = ""
      target = default_pinning_target_topic
      orchestration {
        source = [${oxygen.application.name}"-curated"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_acceptance"
        target = [${oxygen.application.name}"-pinned"]
      }
      stores {
        nearNeighborStateTableName: "near-neighbor-batch"
        nearNeighborStateLoadMechanism: ${oxygen.application.batchTableLoadMechanism}
        nearNeighborRealTimeTableName: "near-neighbor-realtime"

        stampedIdentityStateTableName: "stamped-identity-batch"
        stampedIdentityStateLoadMechanism: ${oxygen.application.batchTableLoadMechanism}
        stampedIdentityRealTimeTableName: "stamped-identity-realtime"

        pinIndexStateTableName: "pin-index-batch"
        pinIndexStateLoadMechanism: ${oxygen.application.batchTableLoadMechanism}
        pinIndexRealTimeTableName: "pin-index-realtime"

        identityPinMapRealTimeTableName: "identity-pin-map-realtime"
        realTimeEventTableName: "event-store-realtime"

        nearNeighborStateFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.nearNeighborStateTableName}
        nearNeighborRealTimeFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.nearNeighborRealTimeTableName}
        stampedIdentityStateFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.stampedIdentityStateTableName}
        stampedIdentityRealTimeFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.stampedIdentityRealTimeTableName}
        pinIndexStateFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.pinIndexStateTableName}
        pinIndexRealTimeFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.pinIndexRealTimeTableName}
        identityPinMapRealTimeFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.identityPinMapRealTimeTableName}
        realTimeEventFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.pinning.stores.realTimeEventTableName}
      }
      paths {
        pinningDir = ${oxygen.application.paths.candidateGenerationHome}${oxygen.application.paths.separator}"pinning"
        pinningReferenceDir = ${oxygen.application.paths.referenceGenerationHome}${oxygen.application.paths.separator}"pinning"
        pinnedDir = ${oxygen.stage.pinning.paths.pinningDir}${oxygen.application.paths.separator}"pinned"
        pinnedPinDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-pin"
        pinnedHCDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-pin-hc"
        pinnedContextPinMapDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-context-pin-map"
        pinnedIdentityPinMapDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-identity-pin-map"
        pinnedMergedPinDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-merged-pin"
        pinnedSplitPinDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-split-pin"
        pinnedNearNeighborDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-nearNeighbor"
        pinnedStampedIdentityDir = ${oxygen.stage.pinning.paths.pinnedDir}${oxygen.application.paths.separator}"-stampedIdentity"

        checkpointBaseLocation = ${oxygen.stage.pinning.paths.pinningDir}${oxygen.application.paths.separator}"checkpoint"
        pinnedReferenceDir = ${oxygen.stage.pinning.paths.pinningReferenceDir}${oxygen.application.paths.separator}"pinned"
        archivedDir = ${oxygen.stage.pinning.paths.pinningDir}${oxygen.application.paths.separator}"archived"
        logsDir = ${oxygen.stage.pinning.paths.pinningDir}${oxygen.application.paths.separator}"logs"
      }
      saveNearNeighborState = false
      nearNeighborStateFormat = ${oxygen.stage.pinning.datasetFormat.output}
      saveStampedIdentityState = false
      stampedIdentityStateFormat = ${oxygen.stage.pinning.datasetFormat.output}
      groupSSR = true
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      staticPinningFormat = ${oxygen.application.storage}
      identitySufficiency = ""
      identityMatcher = ""
      partitioner = "DEFAULT"
      nearNeighborBlockSize = 700
      pinningVleRange = 2000
    }
    pinningService {
      orchestration {
        source = [${oxygen.application.name}"-pinned"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_acceptance"
        target = [${oxygen.application.name}"-paas-pinner"]
      }
      paths {
        pinningInputDir = ${oxygen.application.paths.candidateGenerationHome}${oxygen.application.paths.separator}"pinning"${oxygen.application.paths.separator}${oxygen.application.entity}
        pinnedInputDir = ${oxygen.stage.pinningService.paths.pinningInputDir}${oxygen.application.paths.separator}"pinned"
        pinningOutputDir = ${oxygen.stage.pinningService.paths.pinningInputDir}${oxygen.application.paths.separator}"paas-pinner"
        pinnedOutputDir = ${oxygen.stage.pinningService.paths.pinningOutputDir}${oxygen.application.paths.separator}"pinned"
        archivedDir = ${oxygen.stage.pinningService.paths.pinningOutputDir}${oxygen.application.paths.separator}"archived"
        logsDir = ${oxygen.stage.pinningService.paths.pinningOutputDir}${oxygen.application.paths.separator}"logs"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
    }
    heterogeneousCollection {
      #TODO: To be removed in prod. This is for Analysis purposes only
      #filterKey = "taggedCuratedEvent.curatedRecordJson.standardizedIdNumber"
      filterList = [
        14229470, 38243283, 860003020, 890300279, 890200756, 79350922, 70063828, 860051894, 900677748, 860005224, 860034313, 860059294, 830025638, 830016046, 805027231, 800242106, 830011670, 106523432, 860007738, 860025900, 800250048, 800067065, 860035827
      ]
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      paths {
        heterogeneousCollectionChangeDetection_HC_Dir = ${oxygen.application.paths.candidateGenerationHome}${oxygen.application.paths.separator}"pinning"${oxygen.application.paths.separator}"hc-statechangedetection"
        heterogeneousCollectionChangeDetected_HC_Dir = ${oxygen.stage.heterogeneousCollection.paths.heterogeneousCollectionChangeDetection_HC_Dir}${oxygen.application.paths.separator}"statechangedetected"
        heterogeneousCollectionChangeArchived_HC_Dir = ${oxygen.stage.heterogeneousCollection.paths.heterogeneousCollectionChangeDetection_HC_Dir}${oxygen.application.paths.separator}"archived"
        heterogeneousCollectionLastGenCollection_HC_Dir = ${oxygen.application.paths.candidateGenerationHome}${oxygen.application.paths.separator}"pinning"${oxygen.application.paths.separator}"hc-lastgencollection"
        heterogeneousCollectionLastGenCollected_HC_Dir = ${oxygen.stage.heterogeneousCollection.paths.heterogeneousCollectionLastGenCollection_HC_Dir}${oxygen.application.paths.separator}"lastgencollected"
        heterogeneousCollectionLastGenArchived_HC_Dir = ${oxygen.stage.heterogeneousCollection.paths.heterogeneousCollectionLastGenCollection_HC_Dir}${oxygen.application.paths.separator}"archived"
      }
      processor = com.experian.edf.oxygen.domain.defaults.DefaultHeterogeneousCollectionProcessor
    }
    relationship {
      orchestration {
        source = [${oxygen.application.name}"-stateCalculated"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_calculated"
        target = ${oxygen.application.name}"-relationship"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      paths {
        relationshipDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"relationship"
        entityOutputDir = ${oxygen.stage.relationship.paths.relationshipDir}${oxygen.application.paths.separator}"entityOutput"
        relationOutput = ${oxygen.stage.relationship.paths.relationshipDir}${oxygen.application.paths.separator}"relationOutput"
        entityDir = ${oxygen.stage.relationship.paths.relationshipDir}${oxygen.application.paths.separator}"entity"
      }
    }
    diff {
      orchestration {
        source = [${oxygen.application.paths.appName}"-stateCalculated"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_calculated"
        target = ${oxygen.application.paths.appName}"-xpmOutput"
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      paths {
        diffDir = ${oxygen.application.paths.appHome}${oxygen.application.paths.separator}"diff"
        xpmOutputDir = ${oxygen.stage.diff.paths.diffDir}${oxygen.application.paths.separator}"xpmOutputDir"
        xpmDir = ${oxygen.stage.diff.paths.diffDir}${oxygen.application.paths.separator}"xpmDir"
      }
    }
    consistencyCheck {
      checkpointLocation = ${oxygen.stage.consistencyCheck.paths.checkpointBaseLocation}${oxygen.application.paths.separator}"synthesised"
      entityType = ${oxygen.application.entity}
      stores {
        syntheticEventRealTimeTableName: "synthetic-events-realtime"
        syntheticEventBatchTableName: "synthetic-events-batch"
        stateCheckRealTimeTableName: "statecheck-realtime"

        syntheticEventRealTimeFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.consistencyCheck.stores.syntheticEventRealTimeTableName}
        syntheticEventBatchFQ: ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.consistencyCheck.stores.syntheticEventBatchTableName}
        stateCheckRealtimeFQ = ${oxygen.application.configs.hbase.namespaceWithEnviromnmentAndGeneration}"_"${oxygen.stage.consistencyCheck.stores.stateCheckRealTimeTableName}
        syntheticEventBatchLoadMechanism = ${oxygen.application.batchTableLoadMechanism}
      }
      orchestration {
        source = [${oxygen.application.name}"-pinned"]
        sourceConsumerGroup = "cis_us_edfcolombiabatch_synthesised"
        target = [${oxygen.application.name}"-synthesised"]
      }
      datasetFormat {
        input = ${oxygen.application.storage}
        output = ${oxygen.application.storage}
      }
      paths {
