# Root logger option
log4j.rootLogger=DEBUG, stdout

log4j.logger.org = ERROR

# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
##log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p [%t]: %C: %m%n


#Logger for different classes in oxygen
log4j.logger.com.experian.edf=INFO
log4j.appender.experian=org.apache.log4j.ConsoleAppender
log4j.appender.experian.Target=System.out
log4j.appender.experian.layout=org.apache.log4j.PatternLayout
#log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
log4j.appender.experian.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p [%t]: %C: %m%n

