oxygen {
  stage {
    curation {
      paths {
        curatedDir = "s3://oxygen-innersource/demo-pinning/input/curated-events-input"
      }
    }
  
    pinning {
      paths {
        pinnedDir = "s3://oxygen-innersource/demo-pinning/output/demo-0"
#        pinnedReferenceDir = "s3://oxygen-innersource/demo-pinning/output/demo-0"

        # Json file containing identifying attributes.
        identifyingAttributesFile = ["identifying-attributes.json"]
      }
    
      # Implementation of the IdentityMatcher
      identityMatcher = "com.experian.edf.oxygen.pinning.extension.ISIdentityMatcher"
      
      reusePin = false
      saveNearNeighborState = true
      saveStampedIdentityState = true
      saveHeterogeneousCollection = false
      groupSSR = false
  
      datasetFormat {
        input = text
        output = text
      }

      partitioner = "BY_PIN"

    }

    heterogeneousCollection {
      datasetFormat {
        input = text
        output = text
      }
    }
  
  }
}