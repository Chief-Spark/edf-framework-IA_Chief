oxygen {
  stage {
    curation {
      paths {
        # Input - curated events
        #curatedDir = /data/example/curated-events-input
        curatedDir = /Users/c70088a/Documents/innersource_pinning/oxygen-pinning/example/curated-events-input
      }
    }
  
    pinning {
      paths {
	# Output - pinned
	    #pinnedDir = /data/example/output-demo
        pinnedDir = /Users/c70088a/Documents/innersource_pinning/oxygen-pinning/example/output-demo

    # Reference generation pinned
#        pinnedReferenceDir = /data/example/output-demo

        # Json file containing identifying attributes.
        identifyingAttributesFile = ["identifying-attributes.json"]
      }
    
      # Implementation of the IdentityMatcher
      identityMatcher = "com.experian.edf.oxygen.pinning.extension.ISIdentityMatcher"
      
      reusePin = false
      saveNearNeighborState = true
      saveStampedIdentityState = true
      groupSSR = false
  
      datasetFormat {
        input = text
        output = text
      }

      partitioner = "BY_PIN"

    }

    heterogeneousCollection {
          datasetFormat {
            input = text
            output = text
          }
        }
  }

